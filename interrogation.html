<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interrogation Dashboard</title>
    <link rel="preload" as="image" href="prycecalm.png">
    <link rel="preload" as="image" href="walkercalm.png">
    <link rel="preload" as="image" href="siennacalm.png">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #060a10;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #c8dae5;
            opacity: 0;
            transition: opacity .4s ease;
        }
        body.ready { opacity: 1; }

        .back-to-desk {
            position: fixed;
            top: 14px;
            left: 14px;
            padding: 9px 20px;
            background: rgba(15, 42, 63, 0.85);
            border: 1px solid rgba(182, 139, 92, 0.4);
            border-radius: 40px;
            color: #eace9f;
            font-family: 'Courier New', monospace;
            font-size: .72rem;
            font-weight: bold;
            letter-spacing: .22em;
            text-transform: uppercase;
            text-decoration: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            transition: background .18s ease, border-color .18s ease;
        }
        .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            background: #0b1218;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px #1e3a4a inset;
            display: flex;
            flex-direction: row;
            min-height: 560px;
        }

        /* LEFT PANEL */
        .left-panel {
            flex: 0 0 60%;
            background: radial-gradient(ellipse at 50% 40%, #0f1c2a, #02060a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            position: relative;
            border-right: 2px solid #1e3a4a;
            box-shadow: inset 0 0 60px rgba(0,180,255,0.04);
        }
        .left-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0,255,200,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,200,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .suspect-switcher {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
            z-index: 2;
        }
        .suspect-dot {
            width: 62px; height: 72px;
            border-radius: 16px;
            background: #0f1a22;
            border: 2px solid #2a4a5a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s ease;
            padding: 4px 0;
            gap: 2px;
            position: relative;
        }
        .suspect-dot img {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #1a2a36;
            border: 1px solid #3a5a6a;
        }
        .suspect-dot .emoji-fallback {
            font-size: 1.4rem;
            line-height: 1;
        }
        .suspect-dot span.nm {
            font-size: 0.5rem;
            text-transform: uppercase;
            color: #7a9aaa;
            letter-spacing: 0.5px;
        }
        .suspect-dot.active {
            border-color: #00e5ff;
            box-shadow: 0 0 20px rgba(0,229,255,0.3);
            background: #0f2230;
        }
        .suspect-dot.active span.nm { color: #b0e8ff; }
        .suspect-dot:active { transform: scale(0.94); }
        .suspect-dot .progress-pip {
            position: absolute;
            bottom: 4px;
            width: 30px;
            height: 3px;
            background: #1a2a36;
            border-radius: 3px;
            overflow: hidden;
        }
        .suspect-dot .progress-pip .fill {
            height: 100%;
            background: #4ac0ff;
            transition: width 0.3s ease;
        }

        .portrait-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 6px 0 10px;
            z-index: 2;
        }
        .portrait-wrapper::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            border-radius: 50%;
            border: 3px solid var(--ring-color, #69db7c);
            animation: pulseRing 1.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            box-shadow: 0 0 30px var(--ring-color, #69db7c);
            opacity: 0.6;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.97); opacity: 0.4; box-shadow: 0 0 20px var(--ring-color,#69db7c); }
            50% { transform: scale(1.06); opacity: 1; box-shadow: 0 0 50px var(--ring-color,#69db7c); }
            100% { transform: scale(0.97); opacity: 0.4; box-shadow: 0 0 20px var(--ring-color,#69db7c); }
        }

        .portrait-ring {
            transform: rotate(-90deg);
            width: 160px;
            height: 160px;
            position: relative;
            z-index: 3;
        }
        .portrait-ring .bg { fill: none; stroke: #1a2a3a; stroke-width: 6; }
        .portrait-ring .progress {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease, stroke 0.4s ease;
        }

        .avatar-img {
            position: absolute;
            top: 12px; left: 12px;
            width: 136px; height: 136px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #0a1a2a;
            background: #0f1a22;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .avatar-img img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: filter 0.4s;
        }
        .avatar-img.stressed img {
            filter: contrast(1.2) brightness(0.8) saturate(1.3);
        }
        .avatar-placeholder { font-size: 3.5rem; color: #4a7a8a; }

        .ecg-monitor {
            width: 90%;
            max-width: 300px;
            background: #050d12;
            border: 1px solid #1a3a4a;
            border-radius: 10px;
            padding: 3px 5px;
            margin: 4px 0 6px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            z-index: 2;
            position: relative;
            height: 70px;
        }
        .ecg-monitor canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 5px;
            background: #050d12;
        }
        .ecg-monitor .grid-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background:
                linear-gradient(rgba(0,255,80,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,80,0.06) 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 5px;
            z-index: 1;
        }

        .vitals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            background: rgba(0,10,20,0.7);
            backdrop-filter: blur(4px);
            border: 1px solid #1a3a4a;
            border-radius: 14px;
            padding: 10px 18px;
            width: 90%;
            max-width: 300px;
            z-index: 2;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .vital {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1a2a3a;
            padding: 4px 0;
        }
        .vital .label { color: #6a8a9a; }
        .vital .value { font-weight: bold; font-family: 'Courier New', monospace; }
        .vital .value.low { color: #69db7c; }
        .vital .value.medium { color: #ffb347; }
        .vital .value.high { color: #ff6b6b; }

        /* RIGHT PANEL */
        .right-panel {
            flex: 1;
            background: #0b1218;
            display: flex;
            flex-direction: column;
            padding: 16px 12px 12px 12px;
            min-width: 0;
        }
        .right-header {
            color: #8aacbf;
            font-size: 0.65rem;
            letter-spacing: 2px;
            border-bottom: 2px solid #1a3a4a;
            padding-bottom: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .right-header .badge {
            background: #1a2a36;
            padding: 2px 12px;
            border-radius: 30px;
            color: #00e5ff;
            font-size: 0.6rem;
        }

        .branch-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            border-bottom: 1px solid #1a3a4a;
        }
        .branch-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #5a7a8a;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 2px 6px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: 0.15s;
            font-weight: bold;
        }
        .branch-tab:hover { color: #b0d4e8; }
        .branch-tab.active {
            color: #00e5ff;
            border-bottom-color: #00e5ff;
        }
        .branch-tab .count {
            display: block;
            font-size: 0.55rem;
            color: #4a7a8a;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        .branch-tab.active .count { color: #6aa8c0; }

        .evidence-zone {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .evidence-zone .zone-label {
            font-size: 0.55rem;
            color: #6a8a9a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .note-entry.evidence-btn {
            border-left-color: #b0884a;
            background: #1a1410;
        }
        .note-entry.evidence-btn:hover {
            border-left-color: #ffc070;
            background: #241a10;
        }

        .notes-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .notes-scroll::-webkit-scrollbar { width: 3px; }
        .notes-scroll::-webkit-scrollbar-track { background: #0a1218; }
        .notes-scroll::-webkit-scrollbar-thumb { background: #2a5a6a; border-radius: 10px; }

        .note-entry {
            background: #0e1a22;
            border-left: 3px solid #2a4a5a;
            padding: 5px 10px;
            border-radius: 4px;
            transition: 0.1s;
            cursor: default;
            position: relative;
        }
        .note-entry.locked {
            opacity: 0.35;
            cursor: not-allowed;
            border-left-color: #3a3a3a;
        }
        .note-entry.answered {
            border-left-color: #2a7a4a;
            background: #0d1a1a;
        }
        .note-entry.askable { cursor: pointer; }
        .note-entry.askable:hover {
            border-left-color: #4ac0ff;
            background: #12222e;
        }

        .note-entry .q {
            color: #b0d4e8;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            gap: 6px;
            align-items: baseline;
        }
        .note-entry .q .badge-q {
            color: #4a8aaa;
            font-size: 0.55rem;
            background: #1a2a36;
            padding: 0 5px;
            border-radius: 10px;
            flex-shrink: 0;
            min-width: 16px;
            text-align: center;
        }
        .note-entry.answered .q .badge-q {
            color: #9ae0b0;
            background: #1a3a2a;
        }
        .note-entry.askable .q .badge-q {
            color: #9ad4ff;
            background: #1a2a3a;
        }

        .note-entry .a {
            color: #9ac0b0;
            font-size: 0.78rem;
            margin-top: 3px;
            padding: 4px 8px;
            background: #0a1a1a;
            border-radius: 5px;
            border-left: 2px solid #3a8a5a;
            font-style: italic;
            animation: typeIn 0.2s ease-out;
        }
        @keyframes typeIn {
            0% { opacity: 0; transform: translateY(-4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 720px) {
            .dashboard { flex-direction: column; }
            .left-panel {
                flex: none;
                border-right: none;
                border-bottom: 2px solid #1e3a4a;
                padding: 14px;
            }
            .right-panel { min-height: 320px; }
            .portrait-wrapper { width: 130px; height: 130px; }
            .avatar-img { width: 106px; height: 106px; top: 12px; left: 12px; }
            .portrait-ring { width: 130px; height: 130px; }
            .portrait-ring .bg, .portrait-ring .progress { stroke-width: 5; }
            .portrait-wrapper::after { top: -8px; left: -8px; width: calc(100% + 16px); height: calc(100% + 16px); border-width: 2px; }
            .ecg-monitor { height: 55px; }
        }
    </style>
</head>
<body>

    <a class="back-to-desk" href="desk.html">← Desk</a>

    <div class="dashboard" id="dashboard"></div>

    <script>
    (function () {
        "use strict";

        /* =========================================================
           EVIDENCE FLAGS
           Set by other puzzle files. The interrogation reads them.
             evidence_archiveLog      (Pryce confrontation)
             evidence_braggersNote    (Walker confrontation)
             evidence_lockerPhoto     (Sienna A1)
             evidence_cryptogram      (Sienna B1)
           Add ?evidence=all to the URL to unlock all for testing.
           ========================================================= */
        let FORCE_ALL_EVIDENCE = false;
        try {
            const params = new URLSearchParams(location.search);
            if (params.get('evidence') === 'all') FORCE_ALL_EVIDENCE = true;
        } catch (e) {}

        function hasFlag(key) {
            if (FORCE_ALL_EVIDENCE) return true;
            try { return localStorage.getItem(key) === '1'; }
            catch (e) { return false; }
        }

        /* =========================================================
           SUSPECT DATA
           ========================================================= */

        const SUSPECTS = [
            /* ================= HAROLD PRYCE ================= */
            {
                id: 'pryce',
                name: 'Harold Pryce',
                emoji: '📁',
                role: 'Night Archivist, Lincoln Record Office',
                image: { calm: 'prycecalm.png', stressed: 'prycestressed.png' },
                guarded: false,
                branches: {
                    A: {
                        id: 'A', ecg: 'calm',
                        q: 'Where were you the night the first piece went missing?',
                        a: "Home. Alone. No one to vouch for me, if that's what you're getting at.",
                        children: [
                            { id: 'A1', ecg: 'mild',
                              q: 'No one at all — a call, a neighbour, anything?',
                              a: "I don't have people checking in on me, Detective. That's not a crime.",
                              children: [
                                { id: 'A1a', ecg: 'calm', q: 'Sounds lonely.', a: "It is, some nights. Doesn't make me a thief." },
                                { id: 'A1b', ecg: 'hard', q: 'Any financial troubles lately?', a: 'No more than anyone else. Why do you ask?' },
                                { id: 'A1c', ecg: 'calm', q: 'Could anyone confirm you never left your flat, even briefly?', a: "No. But I didn't leave it." }
                              ]
                            },
                            { id: 'A2', ecg: 'calm',
                              q: 'What were you actually doing that night?',
                              a: 'Television. Paperwork. Nothing worth writing down.',
                              children: [
                                { id: 'A2a', ecg: 'calm', q: 'Any strange calls or messages that night?', a: 'None. Unremarkable evening, right up until your lot showed up.' },
                                { id: 'A2b', ecg: 'mild', q: 'What kind of paperwork?', a: 'Just personal admin. Bills, that sort of thing.' },
                                { id: 'A2c', ecg: 'calm', q: 'Do you usually remember evenings this clearly?', a: 'I remember that one because of what happened the next morning.' }
                              ]
                            },
                            { id: 'A3', ecg: 'mild',
                              q: 'Any particular reason you stayed in rather than going out?',
                              a: "No reason. I just don't go out much these days.",
                              children: [
                                { id: 'A3a', ecg: 'falling', q: 'You hesitated. Tell me about the money.', a: "Fine — I'm behind on a few things. Betting, mostly. It's under control." },
                                { id: 'A3b', ecg: 'calm', q: 'Does Professor Vale know about your debts?', a: "Why would he? We're not friends. He's a client." },
                                { id: 'A3c', ecg: 'hard', q: 'Would money be enough to make you look the other way for someone?', a: "I don't know what you're implying, Detective." }
                              ]
                            }
                        ]
                    },
                    B: {
                        id: 'B', ecg: 'mild',
                        q: 'Who had access to the archive besides you?',
                        a: 'Officially, just me and the duty manager. Unofficially, researchers get let in if I sign off.',
                        children: [
                            { id: 'B1', ecg: 'hard',
                              q: 'Did Professor Vale ever ask you to sign off on anything unusual?',
                              a: 'No. Nothing unusual. He was just a historian doing research.',
                              children: [
                                { id: 'B1a', ecg: 'falling', q: 'You hesitated before answering that.', a: "...He paid me to get into boxes that weren't on the approved list. That's all I did." },
                                { id: 'B1b', ecg: 'calm', q: 'What was in those boxes?', a: "I don't know. I never looked. That wasn't part of the arrangement." },
                                { id: 'B1c', ecg: 'mild', q: 'How much did he pay you?', a: "Enough that I didn't ask questions. That's the honest answer." }
                              ]
                            },
                            { id: 'B2', ecg: 'calm',
                              q: 'How often did Vale actually visit?',
                              a: 'Regularly, for years. Always had the right permits.',
                              children: [
                                { id: 'B2a', ecg: 'mild', q: 'Did his visits change in the weeks before the first theft?', a: "He got more focused. Specific requests, specific dates. I didn't think much of it at the time." },
                                { id: 'B2b', ecg: 'calm', q: 'Did he ever bring anyone with him?', a: "Once, near the end. A younger woman. Didn't give her name." },
                                { id: 'B2c', ecg: 'calm', q: 'Did you ever see his research notes?', a: 'No. He kept all that close. I just opened doors.' }
                              ]
                            },
                            { id: 'B3', ecg: 'mild',
                              q: 'Did anyone else ever ask you for unofficial access?',
                              a: 'Once or twice. I said no to most of them.',
                              children: [
                                { id: 'B3a', ecg: 'calm', q: 'Who asked, and what did they want?', a: 'A journalism student, once. Wanted the shipping ledgers. Nothing to do with this.' },
                                { id: 'B3b', ecg: 'mild', q: 'Why did you say no to them but not to Vale?', a: "Vale paid. The student didn't. I'm not proud of that, but it's the truth." },
                                { id: 'B3c', ecg: 'calm', q: 'Has anyone threatened you to keep quiet about any of this?', a: "No. Nobody's threatened me. I've just been stupid, not scared." }
                              ]
                            }
                        ]
                    },
                    C: {
                        id: 'C', ecg: 'calm',
                        q: "What's your relationship with Professor Vale?",
                        a: 'Professional. He came in for years, always had permits, always knew what he wanted.',
                        children: [
                            { id: 'C1', ecg: 'calm',
                              q: 'Did he ever mention anyone working with him?',
                              a: 'Once or twice. A niece, I think. She did a lot of the actual digging through records.',
                              children: [
                                { id: 'C1a', ecg: 'calm', q: 'Did you ever meet her in person?', a: 'No, never in person. Just heard the name in passing. Sienna, I think.' },
                                { id: 'C1b', ecg: 'calm', q: 'Did she ever request access on her own?', a: "No. Everything came through Vale's name, officially." },
                                { id: 'C1c', ecg: 'calm', q: 'Did Vale seem to trust her?', a: "Completely. More than he trusted most people, I'd say." }
                              ]
                            },
                            { id: 'C2', ecg: 'mild',
                              q: "Did Vale ever talk about the captain's jewellery specifically?",
                              a: "Not directly to me. But I saw what he was requesting. Wasn't hard to guess the subject.",
                              children: [
                                { id: 'C2a', ecg: 'mild', q: 'What exactly was he requesting?', a: 'Old shipping manifests, insurance records, anything mentioning a Captain Hale.' },
                                { id: 'C2b', ecg: 'calm', q: 'Did that strike you as odd at the time?', a: "Historians chase odd things for a living. I didn't think twice about it." },
                                { id: 'C2c', ecg: 'calm', q: 'Did you ever ask him why he wanted it?', a: "Once. He said it was 'righting an old mistake.' I let it go." }
                              ]
                            },
                            { id: 'C3', ecg: 'calm',
                              q: "How would you describe Vale's state of mind recently?",
                              a: 'Obsessive. In a quiet way. Like a man running out of time to prove something.',
                              children: [
                                { id: 'C3a', ecg: 'mild', q: 'Running out of time — why do you say that?', a: 'Funding was drying up on his research post. He mentioned it, bitterly, more than once.' },
                                { id: 'C3b', ecg: 'calm', q: "Do you think that's why he did this?", a: 'I think he convinced himself it was justice, not theft. People do that.' },
                                { id: 'C3c', ecg: 'mild', q: 'Do you feel any responsibility for what happened?', a: "Yes. I gave him the key, even if I didn't know what door it opened." }
                              ]
                            }
                        ]
                    }
                },
                evidence: [
                    {
                        id: 'log',
                        label: 'Present: Archive Sign-Out Log',
                        requires: 'evidence_archiveLog',
                        stressDelta: 45,
                        response: "Alright — yes. Vale paid me. Three visits, off the books, boxes that weren't on the schedule. I wrote the dates in the sign-out log because I was stupid enough to think nobody would ever cross-check. Look at the third one. That's the night before the first theft. I didn't know what he was planning. I just needed the money. Gambling debts. That's the whole of it."
                    }
                ]
            },

            /* ================= EDMUND WALKER ================= */
            {
                id: 'walker',
                name: 'Edmund Walker',
                emoji: '💎',
                role: "Owner, Walker's Jewellery Store, Stamford",
                image: { calm: 'walkercalm.png', stressed: 'walkerstressed.png' },
                guarded: false,
                branches: {
                    A: {
                        id: 'A', ecg: 'mild',
                        q: 'Where were you when the piece came into your shop?',
                        a: 'Behind the counter, same as every day. It came in with the morning drop-offs.',
                        children: [
                            { id: 'A1', ecg: 'mild',
                              q: "Drop-offs — so you didn't see who brought it?",
                              a: 'No. Already in the tray when I opened up. Courier bag, no name.',
                              children: [

        function getStress(id)  { return state.stress[id] || 0; }

        /* Find a node object anywhere in a suspect's tree by id */
        function searchNode(node, nodeId) {
            if (node.id === nodeId) return node;
            if (node.children) {
                for (const child of node.children) {
                    const found = searchNode(child, nodeId);
                    if (found) return found;
                }
            }
            return null;
        }
        function findNode(suspect, nodeId) {
            for (const bKey of ['A', 'B', 'C']) {
                const found = searchNode(suspect.branches[bKey], nodeId);
                if (found) return found;

            return null;

                if (!raw) return;

                if (saved.currentSuspectId) state.currentSuspectId = saved.currentSuspectId;
                if (saved.currentBranch) Object.assign(state.currentBranch, saved.currentBranch);
                if (saved.answeredNodes) {

                if (saved.shownEvidence) {

        /* =========================================================

        const STRESS_DELTA = {
            calm:     1,
            mild:     4,
            hard:    12,
            falling: -6,
            elevated: 3
        };

        function applyStress(sid, node) {
            const suspect = getSuspect(sid);
            let delta;
            if (node.stressOverride !== undefined) {
                delta = node.stressOverride;
            } else {
                delta = STRESS_DELTA[node.ecg] || 0;
                if (suspect.guarded) delta *= 0.15;
            }
            state.stress[sid] = Math.max(0, Math.min(100, (state.stress[sid] || 0) + delta));
        }

        function isAnswered(sid, nodeId) {
            return state.answeredNodes[sid].has(nodeId);
        }

        function getStressColor(stress) {
            if (stress > 70) return '#ff6b6b';
            if (stress > 40) return '#ffb347';
            return '#69db7c';
        }
        function getStressClass(stress) {
            if (stress > 70) return 'high';
            if (stress > 40) return 'medium';
            return 'low';
        }
        function calculateBPM(stress) {
            return Math.round(60 + (stress / 100) * 60);
        }

        function branchProgress(sid, branchKey) {
            const suspect = getSuspect(sid);
            const branch = suspect.branches[branchKey];
            const set = state.answeredNodes[sid];
            let total = 0, answered = 0;
            (function walk(node) {
                total++;
                if (set.has(node.id)) answered++;
                if (node.children) node.children.forEach(walk);
            })(branch);
            return { answered, total };
        }

        function suspectProgress(sid) {
            let answered = 0, total = 0;
            ['A','B','C'].forEach(b => {
                const p = branchProgress(sid, b);
                answered += p.answered;
                total += p.total;
            });
            return { answered, total };
        }

        /* =========================================================
           ECG
           ========================================================= */
        const MIN_SPEED = 0.06;
        const MAX_SPEED = 0.18;
        const AMPLITUDE_SCALE = 0.30;

        function getCycleLength(stress) {
            if (stress >= 70) return 35;
            if (stress >= 45) return 50;
            if (stress >= 20) return 75;
            return 110;
        }

        let ecgCanvas = null;
        let ecgCtx = null;
        let lastTimestamp = 0;
        let ecgAnimationId = null;

        function startECG() {
            if (ecgAnimationId) return;
            lastTimestamp = performance.now();
            function loop(ts) {
                drawECG(ts);
                ecgAnimationId = requestAnimationFrame(loop);
            }
            loop(lastTimestamp);
        }

        function refreshECG() {
            const canvas = document.getElementById('ecgCanvas');
            if (!canvas) { ecgCanvas = null; ecgCtx = null; return; }
            ecgCanvas = canvas;
            ecgCtx = canvas.getContext('2d');
            resizeECG();
            if (!ecgAnimationId) startECG();
        }

        function resizeECG() {
            if (!ecgCanvas) return;
            const parent = ecgCanvas.parentElement;
            ecgCanvas.width = parent.clientWidth || 280;
            ecgCanvas.height = parent.clientHeight || 60;
        }

        function ecgWave(x, offset, cycleLength) {
            let position = ((x + offset) % cycleLength);
            let y = 0;
            const s = AMPLITUDE_SCALE;
            const scale = cycleLength / 180;
            y += 12 * s * Math.exp(-Math.pow((position - 35 * scale) / (10 * scale), 2));
            y -= 18 * s * Math.exp(-Math.pow((position - 70 * scale) / (4 * scale), 2));
            y += 115 * s * Math.exp(-Math.pow((position - 77 * scale) / (3 * scale), 2));
            y -= 35 * s * Math.exp(-Math.pow((position - 84 * scale) / (5 * scale), 2));
            y += 30 * s * Math.exp(-Math.pow((position - 120 * scale) / (16 * scale), 2));
            return y;
        }

        function drawECG(timestamp) {
            if (!ecgCtx) return;
            const currentId = state.currentSuspectId;
            const stress = getStress(currentId);
            const bpm = calculateBPM(stress);
            const speed = MIN_SPEED + (bpm - 60) / 60 * (MAX_SPEED - MIN_SPEED);
            const cycleLength = getCycleLength(stress);

            if (lastTimestamp > 0) {
                const delta = timestamp - lastTimestamp;
                state.offsets[currentId] += delta * speed;
            }
            lastTimestamp = timestamp;

            const canvas = ecgCanvas;
            const ctx = ecgCtx;
            const w = canvas.width;
            const h = canvas.height;
            const centerY = h * 0.62;
            const color = getStressColor(stress);
            const offset = state.offsets[currentId];

            ctx.clearRect(0, 0, w, h);
            ctx.beginPath();
            for (let x = 0; x < w; x++) {
                let y = centerY - ecgWave(x, offset, cycleLength);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowColor = color;
            ctx.shadowBlur = 6;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        /* =========================================================
           TREE RENDERER
           ========================================================= */
        function renderNodeHTML(node, depth, sid, parentAnswered) {
            const answered = isAnswered(sid, node.id);
            const reqMet = !node.requires || hasFlag(node.requires);
            const askable = parentAnswered && !answered && reqMet;

            let cls = 'note-entry';
            if (answered) cls += ' answered';
            else if (askable) cls += ' askable';
            else cls += ' locked';

            const indent = depth * 14;
            let badge = answered ? '✓' : askable ? '▶' : '🔒';

            let html = `<div class="${cls}" data-qid="${node.id}" data-suspect="${sid}" style="margin-left:${indent}px">
                <div class="q"><span class="badge-q">${badge}</span> ${node.q}</div>`;

            if (answered) {
                html += `<div class="a">💬 ${node.a}</div>`;
            }
            html += `</div>`;

            if (node.children) {
                if (answered || askable) {
                    for (const child of node.children) {
                        html += renderNodeHTML(child, depth + 1, sid, answered);
                    }
                }
            }
            return html;
        }

        function renderEvidenceHTML(sid) {
            const suspect = getSuspect(sid);
            if (!suspect.evidence || suspect.evidence.length === 0) return '';
            let available = suspect.evidence.filter(ev => hasFlag(ev.requires));
            if (available.length === 0) return '';

            let html = '<div class="evidence-zone"><div class="zone-label">📁 Evidence</div>';
            for (const ev of available) {
                const shown = state.shownEvidence[sid].has(ev.id);
                if (shown) {
                    html += `<div class="note-entry answered">
                        <div class="q"><span class="badge-q">✓</span> ${ev.label}</div>
                        <div class="a">💬 ${ev.response}</div>
                    </div>`;
                } else {
                    html += `<div class="note-entry askable evidence-btn" data-evid="${ev.id}" data-suspect="${sid}">
                        <div class="q"><span class="badge-q">📁</span> ${ev.label}</div>
                    </div>`;
                }
            }
            html += '</div>';
            return html;
        }

        /* =========================================================
           RENDER
           ========================================================= */
        function render() {
            const dashboard = document.getElementById('dashboard');
            const sid = state.currentSuspectId;
            const suspect = getSuspect(sid);
            if (!suspect) return;

            const stress = getStress(sid);
            const ringColor = getStressColor(stress);
            const stressClass = getStressClass(stress);

            /* --- Suspect switcher --- */
            let dotsHtml = '';
            for (const s of SUSPECTS) {
                const active = s.id === sid ? 'active' : '';
                const prog = suspectProgress(s.id);
                const pct = prog.total ? Math.round(prog.answered / prog.total * 100) : 0;
                dotsHtml += `
                    <div class="suspect-dot ${active}" data-suspect="${s.id}">
                        <img src="${s.image.calm}" alt=""
                             onerror="this.outerHTML='<span class=\\'emoji-fallback\\'>${s.emoji}</span>'">
                        <span class="nm">${s.name.split(' ')[0]}</span>
                        <div class="progress-pip"><div class="fill" style="width:${pct}%"></div></div>
                    </div>`;
            }

            /* --- Portrait --- */
            const isStressed = stress > 80;
            const imgSrc = suspect.image[isStressed ? 'stressed' : 'calm'];
            const avatarHtml = `
                <img src="${imgSrc}" alt=""
                     onerror="this.outerHTML='<span class=\\'avatar-placeholder\\'>${suspect.emoji}</span>'">`;

            const circumference = 2 * Math.PI * 72;
            const offsetRing = circumference * (1 - Math.min(stress, 100) / 100);

            /* --- Vitals --- */
            const hr = calculateBPM(stress);
            const skinCond = stress > 70 ? 'HIGH' : (stress > 40 ? 'MEDIUM' : 'LOW');
            const resp = Math.round(12 + (stress / 100) * 8);
            const stressIdx = Math.round(stress);

            /* --- Branch tabs --- */
            const branchKey = state.currentBranch[sid];
            const BRANCH_LABELS = { A: 'Alibi', B: 'Knowledge', C: 'Relationship' };
            let tabsHtml = '<div class="branch-tabs">';
            for (const b of ['A','B','C']) {
                const prog = branchProgress(sid, b);
                const active = b === branchKey ? 'active' : '';
                tabsHtml += `<button class="branch-tab ${active}" data-branch="${b}">${BRANCH_LABELS[b]}<span class="count">${prog.answered}/${prog.total}</span></button>`;
            }
            tabsHtml += '</div>';

            /* --- Evidence + tree --- */
            const evidenceHtml = renderEvidenceHTML(sid);
            const branch = suspect.branches[branchKey];
            const treeHtml = renderNodeHTML(branch, 0, sid, true);

            const prog = suspectProgress(sid);

            dashboard.innerHTML = `
                <div class="left-panel">
                    <div class="suspect-switcher">${dotsHtml}</div>

                    <div class="portrait-wrapper" style="--ring-color: ${ringColor};">
                        <svg class="portrait-ring" viewBox="0 0 160 160">
                            <circle class="bg" cx="80" cy="80" r="72" />
                            <circle class="progress" cx="80" cy="80" r="72"
                                stroke="${ringColor}"
                                stroke-dasharray="${circumference}"
                                stroke-dashoffset="${offsetRing}" />
                        </svg>
                        <div class="avatar-img ${isStressed ? 'stressed' : ''}">
                            ${avatarHtml}
                        </div>
                    </div>

                    <div class="ecg-monitor">
                        <div class="grid-overlay"></div>
                        <canvas id="ecgCanvas"></canvas>
                    </div>

                    <div class="vitals">
                        <div class="vital"><span class="label">❤️ Heart Rate</span><span class="value ${stressClass}" id="bpmDisplay">${hr} BPM</span></div>
                        <div class="vital"><span class="label">⚡ Skin Conduct</span><span class="value ${stressClass}">${skinCond}</span></div>
                        <div class="vital"><span class="label">🌬 Respiration</span><span class="value ${stressClass}">${resp}/min</span></div>
                        <div class="vital"><span class="label">📊 Stress Index</span><span class="value ${stressClass}">${stressIdx}%</span></div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="right-header">
                        <span>📋 ${suspect.name.toUpperCase()} — ${suspect.role.toUpperCase()}</span>
                        <span class="badge">${prog.answered}/${prog.total}</span>
                    </div>
                    <div class="notes-scroll" id="notesScroll">
                        ${evidenceHtml}
                        ${tabsHtml}
                        <div class="tree-container" id="treeContainer">
                            ${treeHtml}
                        </div>
                    </div>
                </div>
            `;

            refreshECG();
            attachListeners();
        }

        /* =========================================================
           EVENT WIRING
           ========================================================= */
        function attachListeners() {
            const sid = state.currentSuspectId;

            /* --- Suspect switch --- */
            document.querySelectorAll('.suspect-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const id = dot.dataset.suspect;
                    if (id && id !== state.currentSuspectId) {
                        state.currentSuspectId = id;
                        saveState();
                        render();
                    }
                });
            });

            /* --- Branch tabs --- */
            document.querySelectorAll('.branch-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const b = tab.dataset.branch;
                    if (b && b !== state.currentBranch[sid]) {
                        state.currentBranch[sid] = b;
                        saveState();
                        render();
                    }
                });
            });

            /* --- Ask a question --- */
            document.querySelectorAll('.note-entry.askable:not(.evidence-btn)').forEach(entry => {
                entry.addEventListener('click', () => {
                    const qid = entry.dataset.qid;
                    const suspectId = entry.dataset.suspect;
                    const suspect = getSuspect(suspectId);
                    const node = findNode(suspect, qid);
                    if (!node) return;
                    state.answeredNodes[suspectId].add(qid);
                    applyStress(suspectId, node);
                    saveState();
                    render();
                });
            });

            /* --- Present evidence --- */
            document.querySelectorAll('.evidence-btn').forEach(entry => {
                entry.addEventListener('click', () => {
                    const evid = entry.dataset.evid;
                    const suspectId = entry.dataset.suspect;
                    const suspect = getSuspect(suspectId);
                    const ev = (suspect.evidence || []).find(e => e.id === evid);
                    if (!ev) return;
                    state.shownEvidence[suspectId].add(evid);
                    state.stress[suspectId] = Math.max(0, Math.min(100, (state.stress[suspectId] || 0) + (ev.stressDelta || 0)));
                    saveState();
                    render();
                });
            });
        }

        /* =========================================================
           BOOTSTRAP
           ========================================================= */
        function init() {
            loadState();
            render();
            document.body.classList.add('ready');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>
</body>
</html>
