<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interrogation Dashboard</title>
    <link rel="preload" as="image" href="prycecalm.png">
    <link rel="preload" as="image" href="walkercalm.png">
    <link rel="preload" as="image" href="siennacalm.png">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #060a10;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #c8dae5;
            opacity: 0;
            transition: opacity .4s ease;
        }
        body.ready { opacity: 1; }

        /* Permanent top-left Back to Desk */
        .back-to-desk {
            position: fixed;
            top: 14px;
            left: 14px;
            padding: 9px 20px;
            background: rgba(15, 42, 63, 0.85);
            border: 1px solid rgba(182, 139, 92, 0.4);
            border-radius: 40px;
            color: #eace9f;
            font-family: 'Courier New', monospace;
            font-size: .72rem;
            font-weight: bold;
            letter-spacing: .22em;
            text-transform: uppercase;
            text-decoration: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            transition: background .18s ease, border-color .18s ease;
        }
        .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }

        /* Session banner (notification only, no button) */
        .session-banner {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 12px 22px;
            background: linear-gradient(180deg, #1a3a2a, #0d2118);
            border: 1px solid #3a8a5a;
            border-radius: 40px;
            color: #c8f5dc;
            font-family: 'Courier New', monospace;
            font-size: .78rem;
            font-weight: bold;
            letter-spacing: .14em;
            text-transform: uppercase;
            z-index: 10000;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.7),
                0 0 24px rgba(92,216,138,0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, transform .4s cubic-bezier(.2,.9,.3,1.05),
                        visibility 0s linear .4s;
            pointer-events: none;
        }
        .session-banner.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            transition: opacity .4s ease, transform .4s cubic-bezier(.2,.9,.3,1.05),
                        visibility 0s linear 0s;
        }
        .session-banner .msg {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .session-banner .msg .check {
            color: #5cd88a;
            font-size: 1rem;
        }

        @media (max-width: 620px) {
            .session-banner {
                flex-direction: column;
                gap: 10px;
                padding: 10px 16px;
                font-size: .68rem;
                width: calc(100% - 28px);
                text-align: center;
            }
            .session-banner .msg { white-space: normal; }
        }

        /* Empty state — no suspects unlocked */
        .no-suspects {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            max-width: 480px;
        }
        .no-suspects.visible { display: flex; }
        .no-suspects-icon {
            font-size: 4rem;
            opacity: 0.4;
            margin-bottom: 22px;
        }
        .no-suspects h2 {
            font-family: 'Cinzel', serif;
            color: #eace9f;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 1.15rem;
            margin-bottom: 16px;
        }
        .no-suspects p {
            color: #8aa8ba;
            font-size: 0.88rem;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            background: #0b1218;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px #1e3a4a inset;
            display: flex;
            flex-direction: row;
            min-height: 560px;
        }

        .left-panel {
            flex: 0 0 60%;
            background: radial-gradient(ellipse at 50% 40%, #0f1c2a, #02060a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            position: relative;
            border-right: 2px solid #1e3a4a;
            box-shadow: inset 0 0 60px rgba(0,180,255,0.04);
        }
        .left-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0,255,200,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,200,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .suspect-switcher {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
            z-index: 2;
        }
        .suspect-dot {
            width: 62px; height: 72px;
            border-radius: 16px;
            background: #0f1a22;
            border: 2px solid #2a4a5a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s ease;
            padding: 4px 0;
            gap: 2px;
            position: relative;
        }
        .suspect-dot img {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #1a2a36;
            border: 1px solid #3a5a6a;
        }
        .suspect-dot .emoji-fallback {
            font-size: 1.4rem;
            line-height: 1;
        }
        .suspect-dot span.nm {
            font-size: 0.5rem;
            text-transform: uppercase;
            color: #7a9aaa;
            letter-spacing: 0.5px;
        }
        .suspect-dot.active {
            border-color: #00e5ff;
            box-shadow: 0 0 20px rgba(0,229,255,0.3);
            background: #0f2230;
        }
        .suspect-dot.active span.nm { color: #b0e8ff; }
        .suspect-dot:active { transform: scale(0.94); }
        .suspect-dot .progress-pip {
            position: absolute;
            bottom: 4px;
            width: 30px;
            height: 3px;
            background: #1a2a36;
            border-radius: 3px;
            overflow: hidden;
        }
        .suspect-dot .progress-pip .fill {
            height: 100%;
            background: #4ac0ff;
            transition: width 0.3s ease;
        }

        .portrait-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 6px 0 10px;
            z-index: 2;
        }
        .portrait-wrapper::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            border-radius: 50%;
            border: 3px solid var(--ring-color, #69db7c);
            animation: pulseRing 1.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            box-shadow: 0 0 30px var(--ring-color, #69db7c);
            opacity: 0.6;
        }
        @keyframes pulseRing {
            0%   { transform: scale(0.97); opacity: 0.4; box-shadow: 0 0 20px var(--ring-color,#69db7c); }
            50%  { transform: scale(1.06); opacity: 1;   box-shadow: 0 0 50px var(--ring-color,#69db7c); }
            100% { transform: scale(0.97); opacity: 0.4; box-shadow: 0 0 20px var(--ring-color,#69db7c); }
        }

        .portrait-ring {
            transform: rotate(-90deg);
            width: 160px;
            height: 160px;
            position: relative;
            z-index: 3;
        }
        .portrait-ring .bg { fill: none; stroke: #1a2a3a; stroke-width: 6; }
        .portrait-ring .progress {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease, stroke 0.4s ease;
        }

        .avatar-img {
            position: absolute;
            top: 12px; left: 12px;
            width: 136px; height: 136px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #0a1a2a;
            background: #0f1a22;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .avatar-img img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: filter 0.4s;
        }
        .avatar-img.stressed img {
            filter: contrast(1.2) brightness(0.8) saturate(1.3);
        }
        .avatar-placeholder { font-size: 3.5rem; color: #4a7a8a; }

        .ecg-monitor {
            width: 90%;
            max-width: 300px;
            background: #050d12;
            border: 1px solid #1a3a4a;
            border-radius: 10px;
            padding: 3px 5px;
            margin: 4px 0 6px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            z-index: 2;
            position: relative;
            height: 70px;
        }
        .ecg-monitor canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 5px;
            background: #050d12;
        }
        .ecg-monitor .grid-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background:
                linear-gradient(rgba(0,255,80,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,80,0.06) 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 5px;
            z-index: 1;
        }

        .vitals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            background: rgba(0,10,20,0.7);
            backdrop-filter: blur(4px);
            border: 1px solid #1a3a4a;
            border-radius: 14px;
            padding: 10px 18px;
            width: 90%;
            max-width: 300px;
            z-index: 2;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .vital {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1a2a3a;
            padding: 4px 0;
        }
        .vital .label { color: #6a8a9a; }
        .vital .value { font-weight: bold; font-family: 'Courier New', monospace; }
        .vital .value.low { color: #69db7c; }
        .vital .value.medium { color: #ffb347; }
        .vital .value.high { color: #ff6b6b; }

        .right-panel {
            flex: 1;
            background: #0b1218;
            display: flex;
            flex-direction: column;
            padding: 16px 12px 12px 12px;
            min-width: 0;
        }
        .right-header {
            color: #8aacbf;
            font-size: 0.65rem;
            letter-spacing: 2px;
            border-bottom: 2px solid #1a3a4a;
            padding-bottom: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .right-header .badge {
            background: #1a2a36;
            padding: 2px 12px;
            border-radius: 30px;
            color: #00e5ff;
            font-size: 0.6rem;
        }
        .right-header .q-counter {
            background: #1a2a36;
            padding: 2px 12px;
            border-radius: 30px;
            color: #ffb347;
            font-size: 0.6rem;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .right-header .q-counter.danger { color: #ff6b6b; }
        .right-header .q-counter.locked {
            color: #8a8a8a;
            background: #2a1a1a;
        }

        .branch-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            border-bottom: 1px solid #1a3a4a;
        }
        .branch-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #5a7a8a;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 2px 6px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: 0.15s;
            font-weight: bold;
        }
        .branch-tab:hover { color: #b0d4e8; }
        .branch-tab.active {
            color: #00e5ff;
            border-bottom-color: #00e5ff;
        }
        .branch-tab .count {
            display: block;
            font-size: 0.55rem;
            color: #4a7a8a;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        .branch-tab.active .count { color: #6aa8c0; }

        .accuse-btn-main {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px 20px;
            background: linear-gradient(180deg, #ffd066, #d99a1a);
            border: 1px solid #ffd066;
            border-radius: 12px;
            color: #1a1006;
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            font-weight: bold;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow:
                0 8px 22px rgba(240, 180, 41, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
            transition: transform 0.08s, box-shadow 0.15s, background 0.15s;
        }
        .accuse-btn-main:hover { background: linear-gradient(180deg, #ffe299, #ffd066); }
        .accuse-btn-main:active {
            transform: translateY(2px);
            box-shadow: 0 3px 12px rgba(240, 180, 41, 0.35);
        }

        .evidence-zone {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .evidence-zone .zone-label {
            font-size: 0.55rem;
            color: #6a8a9a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .note-entry.evidence-btn {
            border-left-color: #b0884a;
            background: #1a1410;
        }
        .note-entry.evidence-btn:hover {
            border-left-color: #ffc070;
            background: #241a10;
        }

        .notes-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .notes-scroll::-webkit-scrollbar { width: 3px; }
        .notes-scroll::-webkit-scrollbar-track { background: #0a1218; }
        .notes-scroll::-webkit-scrollbar-thumb { background: #2a5a6a; border-radius: 10px; }

        .note-entry {
            background: #0e1a22;
            border-left: 3px solid #2a4a5a;
            padding: 5px 10px;
            border-radius: 4px;
            transition: 0.1s;
            cursor: default;
            position: relative;
        }
        .note-entry.locked {
            opacity: 0.35;
            cursor: not-allowed;
            border-left-color: #3a3a3a;
        }
        .note-entry.answered {
            border-left-color: #2a7a4a;
            background: #0d1a1a;
        }
        .note-entry.askable { cursor: pointer; }
        .note-entry.askable:hover {
            border-left-color: #4ac0ff;
            background: #12222e;
        }

        .note-entry .q {
            color: #b0d4e8;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            gap: 6px;
            align-items: baseline;
        }
        .note-entry .q .badge-q {
            color: #4a8aaa;
            font-size: 0.55rem;
            background: #1a2a36;
            padding: 0 5px;
            border-radius: 10px;
            flex-shrink: 0;
            min-width: 16px;
            text-align: center;
        }
        .note-entry.answered .q .badge-q {
            color: #9ae0b0;
            background: #1a3a2a;
        }
        .note-entry.askable .q .badge-q {
            color: #9ad4ff;
            background: #1a2a3a;
        }

        .note-entry .a {
            color: #9ac0b0;
            font-size: 0.78rem;
            margin-top: 3px;
            padding: 4px 8px;
            background: #0a1a1a;
            border-radius: 5px;
            border-left: 2px solid #3a8a5a;
            font-style: italic;
            animation: typeIn 0.2s ease-out;
        }
        @keyframes typeIn {
            0%   { opacity: 0; transform: translateY(-4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 720px) {
            .dashboard { flex-direction: column; }
            .left-panel {
                flex: none;
                border-right: none;
                border-bottom: 2px solid #1e3a4a;
                padding: 14px;
            }
            .right-panel { min-height: 320px; }
            .portrait-wrapper { width: 130px; height: 130px; }
            .avatar-img { width: 106px; height: 106px; top: 12px; left: 12px; }
            .portrait-ring { width: 130px; height: 130px; }
            .portrait-ring .bg, .portrait-ring .progress { stroke-width: 5; }
            .portrait-wrapper::after { top: -8px; left: -8px; width: calc(100% + 16px); height: calc(100% + 16px); border-width: 2px; }
            .ecg-monitor { height: 55px; }
        }
    </style>
</head>
<body>

    <a class="back-to-desk" href="desk.html">← Back to Desk</a>

    <div class="session-banner" id="sessionBanner">
        <span class="msg"><span class="check">✓</span> Interview complete — 3 questions asked</span>
    </div>

    <div class="dashboard" id="dashboard"></div>

    <div class="no-suspects" id="noSuspects">
        <div class="no-suspects-icon">🔒</div>
        <h2>No Suspects Available</h2>
        <p>No one has been brought in for questioning yet.<br>Continue your investigation and check back later.</p>
    </div>

    <script>
    (function () {
        "use strict";

        /* =========================================================
           INTERVIEW STEP NUMBERS
           The interrogation only accepts new questions when the
           current story step is one of these
