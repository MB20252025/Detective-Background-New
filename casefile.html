<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case File</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: #0f1d29;
    --panel-light: #142838;
    --border: #1e3a4a;
    --gold: #eace9f;
    --gold-hi: #ffd066;
    --gold-lo: #b68b5c;
    --text: #c8dae5;
    --text-dim: #8aa8ba;
    --green: #5cd88a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #12283a, #060b10 70%), #060b10;
    color: var(--text);
    font-family: 'Courier Prime','Courier New',monospace;
    opacity: 0;
    transition: opacity .4s ease;
  }
  body.ready { opacity: 1; }

  .back-to-desk {
    position: fixed; top: 14px; left: 14px;
    padding: 9px 20px;
    background: rgba(15,42,63,.85);
    border: 1px solid rgba(182,139,92,.4);
    border-radius: 40px;
    color: var(--gold);
    font-family: 'Courier New', monospace;
    font-size: .72rem; font-weight: bold;
    letter-spacing: .22em; text-transform: uppercase;
    text-decoration: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 9999;
    transition: background .18s, border-color .18s;
  }
  .back-to-desk:hover { background:#2a5a6a; border-color: var(--gold); }

  .casefile {
    width: 100%; max-width: 900px; height: 100%;
    margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 70px 20px 20px;
  }

  .casefile-header {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 18px;
  }
  .casefile-header .stamp {
    font-family: 'Cinzel', serif;
    font-size: 2rem; font-weight: 700;
    color: var(--gold);
    letter-spacing: .12em; text-transform: uppercase;
    text-shadow: 0 3px 0 rgba(0,0,0,.7), 0 0 24px rgba(234,206,159,.35);
  }
  .casefile-header .subtitle {
    flex: 1;
    font-size: .68rem; color: var(--text-dim);
    letter-spacing: .28em; text-transform: uppercase;
  }
  .casefile-header .badge {
    font-size: .68rem; padding: 4px 12px;
    border-radius: 30px;
    background: rgba(234,206,159,.12);
    border: 1px solid rgba(234,206,159,.35);
    color: var(--gold);
    letter-spacing: .16em; text-transform: uppercase;
  }

  .tabs {
    display: flex; gap: 6px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 18px;
  }
  .tab {
    flex: 1;
    background: transparent; border: none;
    color: var(--text-dim);
    font-family: 'Courier Prime', monospace;
    font-size: .78rem; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    padding: 12px 8px 10px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color .15s, border-color .15s;
  }
  .tab:hover { color: #c8dae5; }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab .count {
    display: inline-block; margin-left: 6px;
    font-size: .68rem; color: var(--text-dim);
    background: rgba(255,255,255,.05);
    padding: 1px 7px; border-radius: 20px;
  }
  .tab.active .count {
    color: var(--gold-hi);
    background: rgba(234,206,159,.15);
  }

  .tab-content {
    flex: 1; overflow-y: auto;
    padding-right: 4px;
  }
  .tab-content::-webkit-scrollbar { width: 6px; }
  .tab-content::-webkit-scrollbar-track { background: #0a1218; }
  .tab-content::-webkit-scrollbar-thumb { background: #2a5a6a; border-radius: 10px; }

  .puzzle-list { display: flex; flex-direction: column; gap: 10px; }

  .puzzle-card {
    background: linear-gradient(160deg, var(--panel-light), var(--panel));
    border: 1px solid var(--border);
    border-left: 4px solid var(--gold-lo);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 16px;
    transition: transform .12s ease, border-color .15s, box-shadow .15s;
  }
  .puzzle-card.available {
    cursor: pointer;
    border-left-color: var(--gold-hi);
    box-shadow: 0 0 0 1px rgba(234,206,159,.08), 0 6px 18px -8px rgba(234,206,159,.3);
  }
  .puzzle-card.available:hover {
    transform: translateX(4px);
    border-color: var(--gold-hi);
    box-shadow: 0 0 0 1px rgba(234,206,159,.25), 0 8px 22px -6px rgba(234,206,159,.5);
  }
  .puzzle-card.completed {
    border-left-color: var(--green);
    opacity: .95;
  }

  .puzzle-icon {
    width: 42px; height: 42px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    font-size: 1.4rem;
  }
  .puzzle-card.available .puzzle-icon {
    background: rgba(234,206,159,.12);
    border-color: rgba(234,206,159,.35);
  }
  .puzzle-card.completed .puzzle-icon {
    background: rgba(92,216,138,.12);
    border-color: rgba(92,216,138,.35);
    color: var(--green);
    font-weight: 700;
  }

  .puzzle-info { flex: 1; min-width: 0; }
  .puzzle-name {
    font-size: .95rem; font-weight: 700;
    color: #eaf2f8;
    letter-spacing: .02em;
    margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .puzzle-meta {
    font-size: .68rem;
    color: var(--text-dim);
    letter-spacing: .14em; text-transform: uppercase;
  }
  .puzzle-card.available .puzzle-meta { color: var(--gold); }
  .puzzle-card.completed .puzzle-meta { color: var(--green); }

  .puzzle-action {
    flex-shrink: 0;
    padding: 8px 18px;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold-lo));
    border: 1px solid var(--gold-hi);
    border-radius: 40px;
    color: #1a1006;
    font-family: 'Courier Prime', monospace;
    font-size: .68rem; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 12px -4px rgba(234,206,159,.6);
    transition: transform .08s, box-shadow .15s;
  }
  .puzzle-action:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px -4px rgba(234,206,159,.8);
  }
  .puzzle-action:active { transform: translateY(1px); }
  .puzzle-card.completed .puzzle-action {
    background: rgba(255,255,255,.08);
    border-color: var(--border);
    color: var(--text);
    box-shadow: none;
  }
  .puzzle-card.completed .puzzle-action:hover {
    background: rgba(255,255,255,.14);
    border-color: var(--gold-lo);
    color: var(--gold);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .icon {
    font-size: 3rem; opacity: .35;
    margin-bottom: 16px;
  }
  .empty-state h3 {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: .82rem; line-height: 1.6;
    max-width: 340px; margin: 0 auto;
    color: #5a7a8a;
  }

  .debug-footer {
    margin-top: 12px;
    padding: 6px 12px;
    font-size: .62rem;
    color: #4a6a7a;
    letter-spacing: .14em;
    text-transform: uppercase;
    text-align: center;
    border-top: 1px dashed rgba(255,255,255,.05);
    user-select: text;
  }

  @media (max-width: 640px) {
    .casefile { padding: 62px 12px 12px; }
    .casefile-header .stamp { font-size: 1.4rem; }
    .casefile-header .subtitle { display: none; }
    .tab { font-size: .68rem; letter-spacing: .12em; padding: 10px 4px 8px; }
    .tab .count { display: none; }
    .puzzle-card { padding: 12px 14px; gap: 12px; }
    .puzzle-icon { width: 36px; height: 36px; font-size: 1.1rem; }
    .puzzle-name { font-size: .85rem; }
    .puzzle-action { padding: 6px 14px; font-size: .62rem; }
  }
</style>
</head>
<body>

<a class="back-to-desk" href="desk.html">← Desk</a>

<div class="casefile">
  <header class="casefile-header">
    <div class="stamp">CASE FILE</div>
    <div class="subtitle">Operation Lighthouse</div>
    <div class="badge" id="progressBadge">0 / 14</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="available">
      Available <span class="count" id="countAvailable">0</span>
    </button>
    <button class="tab" data-tab="completed">
      Completed <span class="count" id="countCompleted">0</span>
    </button>
    <button class="tab" data-tab="suspects">
      Suspects <span class="count" id="countSuspects">0</span>
    </button>
  </nav>

  <div class="tab-content" id="tabContent"></div>

  <div class="debug-footer" id="debugFooter">Step —</div>
</div>

<script>
(function() {
  'use strict';

  /* =========================================================
     PUZZLE CATALOGUE
     `step` = STEPS index (in desk.html) where the puzzle becomes available.
     p1 is set to step 1 so it's always available on a fresh game.
     ========================================================= */
  const PUZZLES = [
    { id:'p1',        file:'p1.html',        name:'The Escape Route',           flag:'whitby_p1_solved',         step:1,  icon:'🗺️' },
    { id:'braggers',  file:'braggers.html',  name:"The Bragger's Note",         flag:'whitby_braggers_solved',   step:4,  icon:'📜' },
    { id:'p2',        file:'p2.html',        name:'Two Mischievous Watchers',   flag:'whitby_p2_solved',         step:7,  icon:'😈' },
    { id:'scale',     file:'scale.html',     name:'The Scale Room',             flag:'whitby_scale_solved',      step:9,  icon:'⚖️' },
    { id:'p3',        file:'p3.html',        name:'Street of Shining Metal',    flag:'whitby_p3_solved',         step:13, icon:'⛪' },
    { id:'coffee',    file:'coffee.html',    name:'The Coffee Puzzle',          flag:'whitby_coffee_solved',     step:17, icon:'☕' },
    { id:'hanoi',     file:'hanoi.html',     name:'Tower of Hanoi',             flag:'whitby_hanoi_solved',      step:18, icon:'🗼' },
    { id:'p4',        file:'p4.html',        name:'The Chase Through Lincoln',  flag:'whitby_p4_solved',         step:22, icon:'🏃' },
    { id:'locker',    file:'locker.html',    name:'Locker Padlocks',            flag:'whitby_locker_solved',     step:24, icon:'🔒' },
    { id:'p5',        file:'p5.html',        name:'The Roar of the Crowd',      flag:'whitby_p5_solved',         step:28, icon:'🏟️' },
    { id:'bookshelf', file:'bookshelf.html', name:"The Archivist's Bookcase",   flag:'whitby_bookshelf_solved',  step:30, icon:'📚' },
    { id:'p6',        file:'p6.html',        name:'Defenders of the Castle',    flag:'whitby_p6_solved',         step:33, icon:'🔫' },
    { id:'cryptogram',file:'cryptogram.html',name:'The Whitby Cryptogram',      flag:'whitby_cryptogram_solved', step:35, icon:'🔤' },
    { id:'vault',     file:'vault.html',     name:'The Vault',                  flag:'whitby_vault_solved',      step:39, icon:'🏦' }
  ];

  const TOTAL_SUSPECTS = 3;

  function hasFlag(k) {
    try { return localStorage.getItem(k) === '1'; } catch(e) { return false; }
  }
  function getStep() {
    const n = parseInt(localStorage.getItem('whitby_step') || '1', 10);
    return Math.min(Math.max(n, 1), 40);
  }

  function getAvailablePuzzles() {
    const step = getStep();
    return PUZZLES.filter(p => !hasFlag(p.flag) && step >= p.step);
  }
  function getCompletedPuzzles() {
    return PUZZLES.filter(p => hasFlag(p.flag));
  }
  function unlockedSuspects() {
    var c = 1;
    if (hasFlag('evidence_braggersNote')) c++;
    if (hasFlag('evidence_lockerPhoto')) c++;
    return c;
  }

  var currentTab = 'available';
  var contentEl = document.getElementById('tabContent');

  function renderAvailable() {
    const list = getAvailablePuzzles();
    if (list.length === 0) {
      return '<div class="empty-state"><div class="icon">🔍</div>' +
             '<h3>No Puzzles Available</h3>' +
             '<p>Continue the investigation on the desk. New puzzles will appear here as the story progresses.</p></div>';
    }
    return '<div class="puzzle-list">' + list.map(p =>
      '<div class="puzzle-card available">' +
        '<div class="puzzle-icon">' + p.icon + '</div>' +
        '<div class="puzzle-info"><div class="puzzle-name">' + p.name + '</div>' +
        '<div class="puzzle-meta">◉ Available now</div></div>' +
        '<button class="puzzle-action" data-file="' + p.file + '">Start →</button>' +
      '</div>'
    ).join('') + '</div>';
  }

  function renderCompleted() {
    const list = getCompletedPuzzles();
    if (list.length === 0) {
      return '<div class="empty-state"><div class="icon">📁</div>' +
             '<h3>No Completed Puzzles</h3>' +
             '<p>Solve your first puzzle to see it archived here with a replay option.</p></div>';
    }
    return '<div class="puzzle-list">' + list.map(p =>
      '<div class="puzzle-card completed">' +
        '<div class="puzzle-icon">✓</div>' +
        '<div class="puzzle-info"><div class="puzzle-name">' + p.name + '</div>' +
        '<div class="puzzle-meta">✔ Completed</div></div>' +
        '<button class="puzzle-action" data-file="' + p.file + '">↻ Replay</button>' +
      '</div>'
    ).join('') + '</div>';
  }

  function renderSuspects() {
    var c = unlockedSuspects();
    return '<div class="empty-state">' +
      '<div class="icon">🔎</div>' +
      '<h3>Suspect Dossiers</h3>' +
      '<p>' + c + ' of ' + TOTAL_SUSPECTS + ' suspects available for interrogation.<br>' +
      'Opening the suspect database…</p></div>';
  }

  function renderTab() {
    if (currentTab === 'available') contentEl.innerHTML = renderAvailable();
    else if (currentTab === 'completed') contentEl.innerHTML = renderCompleted();
    else contentEl.innerHTML = renderSuspects();

    /* Reattach click handlers to puzzle cards */
    contentEl.querySelectorAll('[data-file]').forEach(el => {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        e.preventDefault();
        var file = this.dataset.file;
        if (file) openPuzzle(file);
      });
    });
  }

  function openPuzzle(file) {
    document.body.style.transition = 'opacity .25s ease';
    document.body.style.opacity = '0';
    setTimeout(function() { window.location.href = file; }, 240);
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
      var name = this.dataset.tab;
      if (name === 'suspects') {
        document.body.style.transition = 'opacity .25s ease';
        document.body.style.opacity = '0';
        setTimeout(function() { window.location.href = 'suspect.html'; }, 240);
        return;
      }
      currentTab = name;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      renderTab();
    });
  });

  function updateCounts() {
    document.getElementById('countAvailable').textContent = getAvailablePuzzles().length;
    document.getElementById('countCompleted').textContent = getCompletedPuzzles().length;
    document.getElementById('countSuspects').textContent  = unlockedSuspects();
    document.getElementById('progressBadge').textContent  = getCompletedPuzzles().length + ' / ' + PUZZLES.length;
    document.getElementById('debugFooter').textContent    = 'Story step: ' + getStep() + ' / 40';
  }

  updateCounts();
  renderTab();

  window.addEventListener('load', function() { document.body.classList.add('ready'); });
  if (document.readyState === 'complete') document.body.classList.add('ready');
})();
</script>
</body>
</html>
