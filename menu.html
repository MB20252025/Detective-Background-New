<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whitby — Main Menu</title>
<style>
/* ============================================================
   👇 TUNE EVERYTHING HERE 👇
   ============================================================ */
:root {
  /* ---- BACKGROUND ZOOM ----
     This single number controls BOTH lampoff.png AND lampon.png.
       1.00  = full size (may be cropped)
       0.90  = slightly zoomed out  ← good starting point
       0.80  = noticeably zoomed out
       0.70  = quite far out
       1.20  = zoomed IN further                        */
  --lamp-scale: 0.85;

  /* ---- LAMP SWITCH POSITION ---- */
  --switch-x: 73;      /* left/right % – 50 = centre */
  --switch-y: 58;      /* up/down %    – 50 = centre */
  --switch-w: 15;      /* width as % of screen       */

  /* ---- MENU POSITION ---- */
  --menu-x:   50;
  --menu-y:   62;

  /* ---- WHERE THE GAME STARTS ---- */
  --new-game-url: 'index.html';
  --continue-url: 'index.html';
}
/* ============================================================
   END OF CONFIG
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Courier New', monospace;
  -webkit-tap-highlight-color: transparent;
}

/* ============================================================
   LAMP STAGE — two stacked background layers for a crossfade
   ============================================================ */
.lamp-stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.lamp-layer {
  position: absolute;
  inset: 0;
  background-repeat: no-repeat;
  background-position: center center;

  /* ★ THE SCALE IS APPLIED HERE.
     Change --lamp-scale at the top of this file to zoom
     lampoff.png and lampon.png in/out together. */
  background-size: calc(var(--lamp-scale) * 100%) auto;

  pointer-events: none;
  transition: opacity 0.9s ease;
}

.lamp-layer.off {
  background-image: url('lampoff.png');
  opacity: 1;
}
.lamp-layer.on {
  background-image: url('lampon.png');
  opacity: 0;
}

/* Crossfade when the lamp is switched on */
.lamp-stage.lit .lamp-layer.off { opacity: 0; }
.lamp-stage.lit .lamp-layer.on  { opacity: 1; }

/* ============================================================
   BLACK LAMP SWITCH  (blacklamp.png)
   ============================================================ */
.blacklamp {
  position: absolute;
  left: calc(var(--switch-x) * 1%);
  top:  calc(var(--switch-y) * 1%);
  width: calc(var(--switch-w) * 1%);
  height: auto;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 10;
  user-select: none;
  -webkit-user-drag: none;
  transition: filter .25s ease, transform .25s ease, opacity .35s ease;
  animation: lampPulse 2.4s ease-in-out infinite;
  filter: drop-shadow(0 0 8px rgba(255, 210, 120, 0.35));
}
.blacklamp:hover {
  filter: brightness(1.3) drop-shadow(0 0 22px rgba(255, 220, 140, 0.85));
  transform: translate(-50%, -50%) scale(1.05);
}
.blacklamp:active {
  transform: translate(-50%, -50%) scale(0.96);
}

@keyframes lampPulse {
  0%, 100% { filter: drop-shadow(0 0 6px  rgba(255, 210, 120, 0.25)) brightness(1); }
  50%      { filter: drop-shadow(0 0 18px rgba(255, 220, 140, 0.60)) brightness(1.12); }
}

.lamp-stage.lit .blacklamp {
  opacity: 0;
  pointer-events: none;
}

/* ============================================================
   MENU BUTTONS
   ============================================================ */
.menu {
  position: absolute;
  left: calc(var(--menu-x) * 1%);
  top:  calc(var(--menu-y) * 1%);
  transform: translate(-50%, -50%) translateY(24px);
  opacity: 0;
  pointer-events: none;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition:
    opacity   .55s ease .45s,
    transform .55s cubic-bezier(.2,.9,.3,1.05) .45s;
}
.lamp-stage.lit .menu {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) translateY(0);
}

.menu-btn {
  position: relative;
  padding: 15px 50px;
  min-width: 300px;
  background: rgba(18, 12, 6, 0.78);
  color: #e8d9b8;
  border: 2px solid #8a6e42;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 1.05rem;
  font-weight: bold;
  letter-spacing: 4px;
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow:
    0 6px 18px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.07);
  transition: all .18s ease;
}
.menu-btn:hover:not(:disabled) {
  background: rgba(55, 38, 16, 0.92);
  color: #fff;
  border-color: #d8ab6a;
  transform: translateY(-2px);
  box-shadow:
    0 10px 26px rgba(0,0,0,0.7),
    0 0 26px rgba(255, 210, 130, 0.32),
    inset 0 1px 0 rgba(255,255,255,0.12);
}
.menu-btn:active:not(:disabled) {
  transform: translateY(1px);
  box-shadow: 0 3px 10px rgba(0,0,0,0.5);
}
.menu-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  color: #9a8a68;
  border-color: #4a3a24;
}

@media (max-width: 640px) {
  .menu-btn {
    min-width: 220px;
    padding: 12px 24px;
    font-size: 0.9rem;
    letter-spacing: 3px;
  }
  .menu { gap: 10px; }
  :root { --switch-w: 18; --lamp-scale: 0.9; }
}

/* ============================================================
   HOW TO PLAY — full-screen overlay page
   ============================================================ */
.how-page {
  position: fixed;
  inset: 0;
  background: #0e0a07;
  z-index: 500;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
}
.how-page.active {
  opacity: 1;
  pointer-events: auto;
}

.page-back {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px 22px;
  background: rgba(20, 15, 8, 0.88);
  color: #e8d9b8;
  border: 1px solid #8a6e42;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all .15s;
  z-index: 10;
}
.page-back:hover {
  background: rgba(60, 40, 15, 0.95);
  color: #fff;
  border-color: #d8ab6a;
}
.page-back:active { transform: translateY(1px); }

.page-content {
  flex: 1;
  padding: 90px 40px 40px;
  overflow-y: auto;
  color: #d8c093;
  font-size: 1rem;
  line-height: 1.7;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-placeholder {
  text-align: center;
  color: #6a5a3f;
  font-size: 0.9rem;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20, 15, 8, 0.92);
  border: 1px solid #8a6e42;
  border-radius: 40px;
  padding: 12px 28px;
  color: #e8d9b8;
  font-size: 0.85rem;
  letter-spacing: 2px;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================================
   PAGE FADE-IN ON LOAD
   ============================================================ */
body {
  opacity: 0;
  transition: opacity .5s ease;
}
body.ready { opacity: 1; }
</style>
</head>
<body>

<div class="lamp-stage" id="lampStage">

  <div class="lamp-layer off"></div>
  <div class="lamp-layer on"></div>

  <img src="blacklamp.png" class="blacklamp" id="blackLamp" alt="Turn on the lamp" draggable="false" />

  <div class="menu" id="menu">
    <button class="menu-btn" id="newGameBtn">New Game</button>
    <button class="menu-btn" id="continueGameBtn">Continue Game</button>
    <button class="menu-btn" id="howToPlayBtn">How To Play</button>
  </div>

</div>

<div class="how-page" id="howPage">
  <button class="page-back" id="howBackBtn">← BACK</button>
  <div class="page-content" id="howContent">
    <div class="page-placeholder">How To Play — coming soon</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var css      = getComputedStyle(document.documentElement);
  var NEW_URL  = css.getPropertyValue('--new-game-url').trim().replace(/^['"]|['"]$/g, '');
  var CONT_URL = css.getPropertyValue('--continue-url').trim().replace(/^['"]|['"]$/g, '');
  var SAVE_KEY = 'whitby_save';

  var stage       = document.getElementById('lampStage');
  var blackLamp   = document.getElementById('blackLamp');
  var newGameBtn  = document.getElementById('newGameBtn');
  var continueBtn = document.getElementById('continueGameBtn');
  var howBtn      = document.getElementById('howToPlayBtn');
  var howPage     = document.getElementById('howPage');
  var howBackBtn  = document.getElementById('howBackBtn');
  var toastEl     = document.getElementById('toast');

  var preload = new Image();
  preload.src = 'lampon.png';

  window.addEventListener('load', function () {
    requestAnimationFrame(function () { document.body.classList.add('ready'); });
  });
  if (document.readyState === 'complete') {
    document.body.classList.add('ready');
  }

  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  blackLamp.addEventListener('click', function () {
    if (stage.classList.contains('lit')) return;
    stage.classList.add('lit');
  });

  var hasSave = false;
  try { hasSave = !!localStorage.getItem(SAVE_KEY); } catch (e) { hasSave = false; }

  if (!hasSave) {
    continueBtn.disabled = true;
    continueBtn.title = 'No saved game found';
  }

  function goTo(url) {
    document.body.style.transition = 'opacity .25s ease';
    document.body.style.opacity = '0';
    setTimeout(function () { window.location.href = url; }, 260);
  }

  newGameBtn.addEventListener('click', function () {
    if (hasSave) {
      var ok = window.confirm(
        'Starting a new game will erase your current save.\n\nContinue?'
      );
      if (!ok) return;
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      hasSave = false;
      continueBtn.disabled = true;
    }
    goTo(NEW_URL);
  });

  continueBtn.addEventListener('click', function () {
    if (continueBtn.disabled) return;
    goTo(CONT_URL);
  });

  howBtn.addEventListener('click', function () {
    howPage.classList.add('active');
  });
  howBackBtn.addEventListener('click', function () {
    howPage.classList.remove('active');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && howPage.classList.contains('active')) {
      howPage.classList.remove('active');
    }
  });

})();
</script>
</body>
</html>
