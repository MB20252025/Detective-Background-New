<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>⚓ WHITBY CRYPTOGRAM</title>
    <link rel="preload" as="image" href="whiteboard.jpg">
    <link rel="preload" as="image" href="postit3.png">
    <link rel="preload" as="image" href="postit4.png">
    <link rel="preload" as="image" href="postit5.png">
    <link rel="preload" as="image" href="postit6.png">
    <link rel="preload" as="image" href="postit7.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --sticky-note-base-width: 150px;

            --postit3-x: 9%;   --postit3-y: 25%;   --postit3-scale: 0.54;
            --postit4-x: 10%;  --postit4-y: 40%;   --postit4-scale: 0.55;
            --postit5-x: 12%;  --postit5-y: 55%;   --postit5-scale: 0.55;
            --postit6-x: 88%;  --postit6-y: 40%;   --postit6-scale: 0.45;
            --postit7-x: 88%;  --postit7-y: 55%;   --postit7-scale: 0.65;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: url('whiteboard.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0;
            margin: 0;
            overflow: hidden;
            opacity: 0;
            transition: opacity .4s ease;
        }
        body.ready { opacity: 1; }

        /* ============================================================
           STICKY NOTES — hidden by default, only .visible shows them
           ============================================================ */
        .sticky-note {
            position: fixed;
            height: auto;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.9s ease, visibility 0s linear 0.9s;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .sticky-note.visible {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.9s ease, visibility 0s linear 0s;
        }

        #postit3 { left: var(--postit3-x); top: var(--postit3-y); width: calc(var(--sticky-note-base-width) * var(--postit3-scale)); }
        #postit4 { left: var(--postit4-x); top: var(--postit4-y); width: calc(var(--sticky-note-base-width) * var(--postit4-scale)); }
        #postit5 { left: var(--postit5-x); top: var(--postit5-y); width: calc(var(--sticky-note-base-width) * var(--postit5-scale)); }
        #postit6 { left: var(--postit6-x); top: var(--postit6-y); width: calc(var(--sticky-note-base-width) * var(--postit6-scale)); }
        #postit7 { left: var(--postit7-x); top: var(--postit7-y); width: calc(var(--sticky-note-base-width) * var(--postit7-scale)); }

        .back-to-desk {
            position: fixed;
            top: 14px;
            left: 14px;
            padding: 9px 20px;
            background: rgba(15, 42, 63, 0.85);
            border: 1px solid rgba(182, 139, 92, 0.4);
            border-radius: 40px;
            color: #eace9f;
            font-family: 'Courier New', monospace;
            font-size: .72rem;
            font-weight: bold;
            letter-spacing: .22em;
            text-transform: uppercase;
            text-decoration: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            transition: background .18s ease, border-color .18s ease;
        }
        .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }

        #cryptogramContainer {
            transform-origin: top center;
            transition: transform 0.2s ease;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 1100px;
            height: auto;
            position: relative;
            z-index: 10;
        }

        .cryptogram-wrapper {
            width: 100%;
            max-width: 1100px;
            background: transparent;
            border: none;
            box-shadow: none;
            overflow: visible;
        }

        .cryptogram-body {
            padding: 24px 16px 20px;
            background: transparent;
        }

        .crypto-words {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 12px 8px;
            margin: 0 0 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            justify-content: center;
            overflow-x: auto;
        }

        .word {
            display: flex;
            flex-wrap: nowrap;
            gap: 0px;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .crypto-cell-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            flex-shrink: 0;
        }

        .crypto-cell {
            background: transparent;
            border: 1px dashed rgba(60, 60, 60, 0.35);
            border-radius: 6px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: 'Courier Prime', monospace;
            box-shadow: none;
            user-select: none;
            overflow: hidden;
            position: relative;
            pointer-events: auto;
        }

        .crypto-cell video {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 3px;
            display: block;
            background: transparent;
        }

        .crypto-cell .cell-placeholder {
            font-size: 0.9rem;
            color: #b68b5c;
            font-weight: 700;
            font-family: 'Courier Prime', monospace;
            opacity: 0.7;
        }

        .crypto-cell .letter-fallback {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .crypto-cell.revealed {
            background: transparent;
            border: none;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }

        .crypto-cell:hover:not(.revealed) {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.3);
            border-color: #b68b5c;
            border-style: solid;
        }

        .cell-number {
            font-size: 0.7rem;
            font-weight: 700;
            color: #2c3e50;
            font-family: 'Courier Prime', monospace;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.25);
            padding: 0 6px;
            border-radius: 16px;
            border: 1px solid rgba(176, 176, 176, 0.20);
            min-width: 20px;
            text-align: center;
            transition: 0.2s;
            line-height: 1.4;
        }
        .cell-number.solved-number {
            border-color: rgba(176, 176, 176, 0.50);
            background: rgba(240, 240, 240, 0.35);
        }

        @media (max-width: 680px) {
            .crypto-cell { width: 40px; height: 40px; font-size: 1.2rem; }
            .crypto-cell .letter-fallback { font-size: 1.3rem; }
            .cell-number { font-size: 0.65rem; min-width: 18px; }
            .crypto-words { gap: 10px 14px; padding: 10px 6px; }
        }
        @media (max-width: 550px) {
            .crypto-cell { width: 34px; height: 34px; font-size: 0.9rem; border-radius: 4px; }
            .crypto-cell .letter-fallback { font-size: 1.0rem; }
            .cell-number { font-size: 0.55rem; min-width: 16px; padding: 0 4px; }
            .crypto-words { gap: 8px 12px; padding: 8px 4px; }
        }
        @media (max-width: 420px) {
            .crypto-cell { width: 28px; height: 28px; font-size: 0.7rem; border-radius: 3px; }
            .crypto-cell .letter-fallback { font-size: 0.8rem; }
            .cell-number { font-size: 0.5rem; min-width: 14px; padding: 0 3px; }
            .crypto-words { gap: 6px 10px; padding: 6px 3px; }
        }

        .cryptogram-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 4px 0 0;
            flex-wrap: wrap;
        }

        .cryptogram-hint-btn {
            background: rgba(182, 139, 92, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #ffffff;
            border: none;
            border-radius: 60px;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 2px 0 rgba(138, 109, 68, 0.30);
            font-family: 'Cinzel', serif;
        }
        .cryptogram-hint-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 rgba(138, 109, 68, 0.30);
        }
        .cryptogram-hint-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .celebration {
            text-align: center;
            padding: 10px;
            background: rgba(58, 122, 90, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 12px;
            border: 2px solid rgba(176, 176, 176, 0.30);
            box-shadow: 0 0 20px rgba(58, 122, 90, 0.15);
            font-family: 'Cinzel', serif;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(176, 176, 176, 0.30);
            border-radius: 50px;
            padding: 8px 24px;
            color: #ffffff;
            font-weight: bold;
            z-index: 5000;
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            animation: toastFade 2.4s ease forwards;
            pointer-events: none;
        }
        @keyframes toastFade {
            0%   { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            85%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        /* ============================================================
           GUESS MODAL
           ============================================================ */
        .guess-modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 8000;
            padding: 20px;
        }
        .guess-modal.active { display: flex; }

        .guess-modal-content {
            background: #fbf5e8;
            border: 2px solid #b68b5c;
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            color: #1a1a1a;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(234, 206, 159, 0.25);
            pointer-events: auto;
        }

        .guess-modal-content h3 {
            font-size: 1.6rem;
            margin-bottom: 14px;
            color: #2c3e50;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.06em;
        }
        .guess-modal-content h3 i { color: #b68b5c; }

        .guess-modal-content p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            color: #4a5f6b;
            margin-bottom: 12px;
        }

        .guess-number-preview {
            display: inline-block;
            font-family: 'Courier Prime', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: #b68b5c;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 20px;
            border-radius: 40px;
            margin-bottom: 10px;
            border: 1px solid rgba(182, 139, 92, 0.4);
        }

        .guess-input {
            background: #ffffff;
            border: 2px solid rgba(176, 176, 176, 0.6);
            border-radius: 50px;
            padding: 12px;
            font-size: 2rem;
            width: 90px;
            text-align: center;
            margin: 12px auto;
            display: block;
            color: #1a1a1a;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            outline: none;
            text-transform: uppercase;
            pointer-events: auto;
        }
        .guess-input:focus {
            border-color: #b68b5c;
            box-shadow: 0 0 0 3px rgba(182, 139, 92, 0.25);
        }

        .modal-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .modal-btn {
            background: #b68b5c;
            border: none;
            border-radius: 60px;
            padding: 10px 28px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            color: #ffffff;
            transition: 0.1s;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
        }
        .modal-btn:active { transform: scale(0.96); }
        .modal-btn.secondary { background: #a0a0a0; }

        .guess-feedback {
            background: rgba(240, 240, 240, 0.7);
            padding: 10px;
            border-radius: 30px;
            margin-top: 12px;
            font-size: 0.88rem;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier Prime', monospace;
        }
        .guess-feedback.success { color: #3a7a5a; }
        .guess-feedback.error { color: #c0392b; }

        @media (max-width: 480px) {
            .cryptogram-body { padding: 14px 10px 16px; }
            .guess-modal-content { padding: 20px 16px; }
            .guess-modal-content h3 { font-size: 1.3rem; }
            .guess-input { width: 70px; padding: 10px; font-size: 1.5rem; }
        }

        /* ============================================================
           STICKY POPUP
           ============================================================ */
        .sticky-popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        .sticky-popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sticky-popup {
            background: linear-gradient(160deg, #fef8e6 0%, #f5e8b8 100%);
            border-radius: 8px;
            padding: 28px 26px 22px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            transform: translateY(12px) scale(0.96);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.05);
            position: relative;
        }
        .sticky-popup-overlay.active .sticky-popup {
            transform: translateY(0) scale(1);
        }
        .sticky-popup::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 74px;
            height: 22px;
            background: rgba(255, 235, 130, 0.75);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            border-radius: 1px;
        }
        .sticky-popup-icon {
            font-size: 1.6rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
        }
        .sticky-popup h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #6b4a25;
            margin-bottom: 14px;
            font-weight: 700;
        }
        .sticky-popup-img-wrapper {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }
        .sticky-popup-img {
            max-width: 100%;
            max-height: 110px;
            width: auto;
            height: auto;
            display: block;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.2));
        }
        .sticky-popup-message {
            font-family: 'Courier Prime', monospace;
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #2c3e50;
            margin-bottom: 18px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        .sticky-popup-btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(180deg, #d99a1a, #b07820);
            border: 1px solid #ffd066;
            border-radius: 60px;
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.20em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow:
                0 6px 18px rgba(180, 120, 20, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            transition: transform 0.08s ease, box-shadow 0.15s ease;
        }
        .sticky-popup-btn:hover { background: linear-gradient(180deg, #e0a62c, #c08828); }
        .sticky-popup-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(180, 120, 20, 0.35);
        }

        .how-to-hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.85);
            color: #f5e7c8;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            border: 1px solid rgba(182, 139, 92, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 3;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }
        @media (max-width: 680px) {
            .how-to-hint { font-size: 0.6rem; padding: 6px 14px; }
        }

        /* ============================================================
           RETURN TO DESK BUTTON — appears after the cryptogram is solved
           ============================================================ */
        #cryptoReturnBtn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 13px 34px;
            background: linear-gradient(180deg, #5cd88a, #2e8b57);
            color: #062a1a;
            border: 1px solid rgba(92, 216, 138, 0.75);
            border-radius: 40px;
            font-family: 'Courier New', monospace;
            font-size: .84rem;
            font-weight: bold;
            letter-spacing: .22em;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 9999;
            display: none;
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.7),
                0 0 22px rgba(92, 216, 138, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: cryptoReturnPulse 2.2s ease-in-out infinite;
            transition: background .18s ease, transform .12s ease;
        }
        #cryptoReturnBtn.visible { display: inline-block; }
        #cryptoReturnBtn:hover {
            background: linear-gradient(180deg, #7ee5a8, #34a96b);
            transform: translateX(-50%) translateY(-1px);
        }
        #cryptoReturnBtn:active { transform: translateX(-50%) translateY(1px); }
        @keyframes cryptoReturnPulse {
            0%, 100% { box-shadow: 0 8px 22px rgba(0,0,0,0.7), 0 0 18px rgba(92,216,138,0.40); }
            50%      { box-shadow: 0 8px 22px rgba(0,0,0,0.7), 0 0 32px rgba(92,216,138,0.75); }
        }
    </style>
</head>
<body>

    <a class="back-to-desk" href="desk.html">← Desk</a>

    <img src="postit3.png" class="sticky-note" id="postit3" alt="Y = 9" draggable="false">
    <img src="postit4.png" class="sticky-note" id="postit4" alt="R = 5" draggable="false">
    <img src="postit5.png" class="sticky-note" id="postit5" alt="S = 7" draggable="false">
    <img src="postit6.png" class="sticky-note" id="postit6" alt="L = 8" draggable="false">
    <img src="postit7.png" class="sticky-note" id="postit7" alt="E = 2" draggable="false">

    <div id="cryptogramContainer">
        <div class="cryptogram-wrapper">
            <div class="cryptogram-body" id="cryptogramRoot"></div>
        </div>
    </div>

    <div class="how-to-hint">Tap any dashed cell to enter a letter</div>

    <div class="guess-modal" id="guessModal">
        <div class="guess-modal-content">
            <h3><i class="fas fa-question-circle"></i> Enter Letter</h3>
            <p>What letter does this number represent?</p>
            <div class="guess-number-preview" id="guessNumberPreview">?</div>
            <input type="text" class="guess-input" id="guessInput"
                   maxlength="1" spellcheck="false"
                   autocomplete="off" autocorrect="off" autocapitalize="characters" />
            <div class="modal-buttons">
                <button class="modal-btn" id="submitGuessBtn" type="button">SUBMIT</button>
                <button class="modal-btn secondary" id="cancelGuessBtn" type="button">CANCEL</button>
            </div>
            <div class="guess-feedback" id="guessFeedback"></div>
        </div>
    </div>

    <div class="sticky-popup-overlay" id="stickyPopupOverlay">
        <div class="sticky-popup">
            <div class="sticky-popup-icon">📌</div>
            <h3>New Clue Discovered</h3>
            <div class="sticky-popup-img-wrapper">
                <img src="" alt="" class="sticky-popup-img" id="stickyPopupImg">
            </div>
            <div class="sticky-popup-message" id="stickyPopupMessage">Y = 9</div>
            <button class="sticky-popup-btn" id="stickyPopupBtn">Continue</button>
        </div>
    </div>

    <button id="cryptoReturnBtn" type="button">→ Return to Desk</button>

    <script>
        /* ============================================================
           STICKY CONFIG — each entry maps a puzzle flag → a letter/number
           ============================================================ */
        const STICKY_CONFIG = [
            { id: 'postit3', flag: 'evidence_lockerPhoto', letter: 'Y', number: '9' },
            { id: 'postit4', flag: 'evidence_archiveLog',  letter: 'R', number: '5' },
            { id: 'postit5', flag: 'evidence_postit5',     letter: 'S', number: '7' },
            { id: 'postit6', flag: 'whitby_p6_solved',     letter: 'L', number: '8' },
            { id: 'postit7', flag: 'evidence_postit7',     letter: 'E', number: '2' }
        ];

        /* A letter that actually appears in the target sentence, so this
           hint is visible from the very start (T appears many times). */
        const ALWAYS_REVEALED_LETTER = 'T';

        function hasFlag(key) {
            try { return localStorage.getItem(key) === '1'; }
            catch (e) { return false; }
        }
        function setFlag(key) {
            try { localStorage.setItem(key, '1'); } catch (e) {}
        }

        /* ============================================================
           STICKY POPUP QUEUE — only fires for earned flags
           ============================================================ */
        let popupQueue = [];
        let popupActive = false;

        function processNextPopup() {
            if (popupQueue.length === 0) {
                popupActive = false;
                return;
            }
            popupActive = true;
            const cfg = popupQueue.shift();
            const overlay = document.getElementById('stickyPopupOverlay');
            const msg = document.getElementById('stickyPopupMessage');
            const img = document.getElementById('stickyPopupImg');

            msg.textContent = cfg.letter + ' = ' + cfg.number;
            img.src = cfg.id + '.png';
            img.alt = cfg.letter + ' = ' + cfg.number;

            overlay.classList.add('active');
        }

        document.getElementById('stickyPopupBtn').addEventListener('click', function () {
            const overlay = document.getElementById('stickyPopupOverlay');
            for (let i = 0; i < STICKY_CONFIG.length; i++) {
                const cfg = STICKY_CONFIG[i];
                const label = cfg.letter + ' = ' + cfg.number;
                if (label === document.getElementById('stickyPopupMessage').textContent) {
                    setFlag(cfg.flag + '_shown');
                    break;
                }
            }
            overlay.classList.remove('active');
            setTimeout(processNextPopup, 320);
        });

        /* ============================================================
           STICKY VISIBILITY — ONLY show a sticky if its flag exists
           ============================================================ */
        function checkStickyNotes() {
            STICKY_CONFIG.forEach(function (cfg) {
                const el = document.getElementById(cfg.id);
                if (!el) return;

                if (hasFlag(cfg.flag)) {
                    el.classList.add('visible');

                    const shownKey = cfg.flag + '_shown';
                    if (!hasFlag(shownKey)) {
                        popupQueue.push(cfg);
                    }
                } else {
                    /* Explicitly hide — no flag, no sticky */
                    el.classList.remove('visible');
                }
            });

            if (popupQueue.length > 0 && !popupActive) {
                setTimeout(processNextPopup, 400);
            }
        }

        /* ============================================================
           RETURN TO DESK
           ============================================================ */
        (function setupReturnButton() {
            var btn = document.getElementById('cryptoReturnBtn');
            if (!btn) return;

            btn.addEventListener('click', function () {
                document.body.style.transition = 'opacity .4s ease';
                document.body.style.opacity = '0';
                setTimeout(function () {
                    window.location.href = 'desk.html';
                }, 450);
            });

            /* If the cryptogram was already solved in a previous session,
               show the return button immediately. */
            if (hasFlag('whitby_cryptogram_solved')) {
                btn.classList.add('visible');
            }
        })();

        /* ============================================================
           CRYPTOGRAM CORE
           ============================================================ */
        (function() {
            const TOP_OFFSET   = 155;
            const MAX_SCALE    = 0.80;
            const SIDE_PADDING = 20;

            const LETTER_TO_NUMBER = {
                'A': 21, 'B': 24, 'C': 6,  'D': 22, 'E': 2,  'F': 15, 'G': 11,
                'H': 17, 'I': 20, 'J': 10, 'K': 23, 'L': 8,  'M': 16, 'N': 12,
                'O': 14, 'P': 13, 'Q': 3,  'R': 5,  'S': 7,  'T': 25, 'U': 4,
                'V': 19, 'W': 18, 'X': 26, 'Y': 9,  'Z': 1
            };

            const TARGET_SENTENCE = "THE VAULT IS BENEATH THE STAGE OF THE NEW THEATRE ROYAL";
            const MAX_HINTS = 3;

            let sentenceItems = [];
            let hintsUsed = 0;
            let isSolved = false;
            let cellWrappers = [];

            const root = document.getElementById('cryptogramRoot');
            const modal = document.getElementById('guessModal');
            const guessInput = document.getElementById('guessInput');
            const guessFeedback = document.getElementById('guessFeedback');
            const guessNumberPreview = document.getElementById('guessNumberPreview');
            const submitBtn = document.getElementById('submitGuessBtn');
            const cancelBtn = document.getElementById('cancelGuessBtn');

            /* Only the letters you've actually earned are known,
               plus the always-revealed starter letter. */
            function getKnownLetters() {
                const known = {};
                known[ALWAYS_REVEALED_LETTER] = true;
                STICKY_CONFIG.forEach(function (cfg) {
                    if (hasFlag(cfg.flag)) known[cfg.letter] = true;
                });
                return known;
            }

            function createVideoWithFallback(letter) {
                const container = document.createElement('div');
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.display = 'flex';
                container.style.alignItems = 'center';
                container.style.justifyContent = 'center';

                const video = document.createElement('video');
                video.muted = true;
                video.autoplay = true;
                video.loop = false;
                video.playsInline = true;
                video.controls = false;
                video.preload = 'auto';
                video.setAttribute('muted', '');
                video.setAttribute('playsinline', '');
                video.setAttribute('autoplay', '');
                video.style.width = '70%';
                video.style.height = '70%';
                video.style.objectFit = 'contain';
                video.style.borderRadius = '3px';

                const src = document.createElement('source');
                src.src = letter + '.mp4';
                src.type = 'video/mp4';
                video.appendChild(src);

                video.onerror = function() {
                    this.remove();
                    const fallback = document.createElement('span');
                    fallback.className = 'letter-fallback';
                    fallback.textContent = letter;
                    container.appendChild(fallback);
                };

                container.appendChild(video);
                video.play().catch(function() {
                    if (container.querySelector('.letter-fallback')) return;
                    video.remove();
                    const fallback = document.createElement('span');
                    fallback.className = 'letter-fallback';
                    fallback.textContent = letter;
                    container.appendChild(fallback);
                });

                return container;
            }

            function init() {
                const known = getKnownLetters();
                sentenceItems = [];
                for (let ch of TARGET_SENTENCE) {
                    if (ch === ' ') continue;
                    const num = LETTER_TO_NUMBER[ch];
                    sentenceItems.push({
                        letter: ch,
                        number: num,
                        revealed: !!known[ch]
                    });
                }
                buildFullDOM();
                applyScale();

                if (countRevealed() === getTotal()) {
                    isSolved = true;
                    showCelebration();
                }
            }

            function buildFullDOM() {
                root.innerHTML = '';

                const wordsContainer = document.createElement('div');
                wordsContainer.className = 'crypto-words';

                const words = TARGET_SENTENCE.split(' ');
                let globalIdx = 0;
                cellWrappers = [];

                for (let w of words) {
                    const wordDiv = document.createElement('div');
                    wordDiv.className = 'word';

                    for (let i = 0; i < w.length; i++) {
                        const item = sentenceItems[globalIdx];
                        const isRevealed = item.revealed;
                        const num = item.number;
                        const letter = item.letter;

                        const wrapper = document.createElement('div');
                        wrapper.className = 'crypto-cell-wrapper';

                        const cell = document.createElement('div');
                        cell.className = 'crypto-cell ' + (isRevealed ? 'revealed' : '');
                        cell.dataset.pos = globalIdx;
                        cell.dataset.letter = letter;
                        cell.dataset.number = num;

                        if (isRevealed) {
                            cell.appendChild(createVideoWithFallback(letter));
                        } else {
                            const placeholder = document.createElement('span');
                            placeholder.className = 'cell-placeholder';
                            placeholder.textContent = '?';
                            cell.appendChild(placeholder);
                        }

                        const numUnder = document.createElement('div');
                        numUnder.className = 'cell-number ' + (isRevealed ? 'solved-number' : '');
                        numUnder.textContent = num;

                        wrapper.appendChild(cell);
                        wrapper.appendChild(numUnder);
                        wordDiv.appendChild(wrapper);

                        cellWrappers[globalIdx] = { cell: cell, numberEl: numUnder };
                        globalIdx++;
                    }
                    wordsContainer.appendChild(wordDiv);
                }

                root.appendChild(wordsContainer);

                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'cryptogram-controls';
                const hintBtn = document.createElement('button');
                hintBtn.className = 'cryptogram-hint-btn';
                hintBtn.id = 'cryptogramHintBtn';
                hintBtn.type = 'button';
                hintBtn.innerHTML = '<i class="fas fa-lightbulb"></i> REVEAL HINT (' + MAX_HINTS + ' left)';
                controlsDiv.appendChild(hintBtn);
                root.appendChild(controlsDiv);

                /* Attach click events to every non-revealed cell */
                root.querySelectorAll('.crypto-cell:not(.revealed)').forEach(function(cell) {
                    cell.addEventListener('click', cellClickHandler);
                    cell.addEventListener('touchend', function(e) {
                        e.preventDefault();
                        cellClickHandler.call(this, e);
                    }, { passive: false });
                });

                hintBtn.addEventListener('click', hintClickHandler);
                updateHintButton();
            }

            function cellClickHandler(e) {
                if (isSolved) return;
                if (this.classList.contains('revealed')) return;

                const pos = parseInt(this.dataset.pos, 10);
                const expectedLetter = this.dataset.letter;
                openGuessModal(pos, expectedLetter);
            }

            function hintClickHandler() {
                if (hintsUsed >= MAX_HINTS || isSolved) return;
                for (let item of sentenceItems) {
                    if (!item.revealed) {
                        revealLetter(item.letter);
                        hintsUsed++;
                        showToast('🔎 Hint: letter \'' + item.letter + '\' revealed.');
                        updateHintButton();
                        break;
                    }
                }
            }

            function countRevealed() {
                return sentenceItems.filter(function(item) { return item.revealed; }).length;
            }
            function getTotal() { return sentenceItems.length; }

            function revealLetter(letter) {
                let changed = false;
                for (let i = 0; i < sentenceItems.length; i++) {
                    const item = sentenceItems[i];
                    if (item.letter === letter && !item.revealed) {
                        item.revealed = true;
                        changed = true;
                        updateCell(i);
                    }
                }
                if (changed) {
                    if (countRevealed() === getTotal() && !isSolved) {
                        isSolved = true;
                        try { localStorage.setItem('evidence_cryptogram', '1'); } catch (e) {}
                        try { localStorage.setItem('whitby_cryptogram_solved', '1'); } catch (e) {}
                        showToast('🎉 Cryptogram solved! The truth is revealed.');
                        showCelebration();
                        updateHintButton();

                        /* Reveal the Return to Desk button */
                        var btn = document.getElementById('cryptoReturnBtn');
                        if (btn) btn.classList.add('visible');
                    }
                }
            }

            function updateCell(index) {
                const item = sentenceItems[index];
                const refs = cellWrappers[index];
                if (!refs) return;
                const cell = refs.cell;
                const numberEl = refs.numberEl;

                cell.innerHTML = '';
                cell.classList.add('revealed');
                cell.appendChild(createVideoWithFallback(item.letter));
                numberEl.classList.add('solved-number');
            }

            function updateHintButton() {
                const hintBtn = document.getElementById('cryptogramHintBtn');
                if (!hintBtn) return;
                const remaining = MAX_HINTS - hintsUsed;
                const disabled = hintsUsed >= MAX_HINTS || isSolved;
                hintBtn.disabled = disabled;
                hintBtn.innerHTML = '<i class="fas fa-lightbulb"></i> REVEAL HINT (' + remaining + ' left)';
            }

            function showCelebration() {
                const existing = document.querySelector('.celebration');
                if (existing) existing.remove();
                const celeb = document.createElement('div');
                celeb.className = 'celebration';
                celeb.innerHTML = '🔓 MESSAGE DECRYPTED — The conspiracy is unveiled.';
                root.appendChild(celeb);
            }

            function applyScale() {
                const container = document.getElementById('cryptogramContainer');
                const wrapper = document.querySelector('.cryptogram-wrapper');
                if (!container || !wrapper) return;

                const wrapperWidth  = wrapper.scrollWidth  || 1100;
                const wrapperHeight = wrapper.scrollHeight || 700;
                const availWidth  = window.innerWidth  - SIDE_PADDING * 2;
                const availHeight = window.innerHeight - TOP_OFFSET - SIDE_PADDING;

                let scaleX = availWidth  / wrapperWidth;
                let scaleY = availHeight / wrapperHeight;
                let scale  = Math.min(scaleX, scaleY, MAX_SCALE);

                container.style.transform = 'translateY(' + TOP_OFFSET + 'px) scale(' + scale + ')';
                container.style.margin = '0 auto';
                container.style.width  = wrapperWidth + 'px';
                container.style.height = wrapperHeight + 'px';
                container.style.transformOrigin = 'top center';
            }

            function showToast(msg) {
                const el = document.createElement('div');
                el.className = 'toast';
                el.textContent = msg;
                document.body.appendChild(el);
                setTimeout(function() { el.remove(); }, 2400);
            }

            /* ---------------------------------------------------
               GUESS MODAL
               --------------------------------------------------- */
            let currentGuessPos = null;
            let currentGuessLetter = null;

            function openGuessModal(pos, correctLetter) {
                if (isSolved) return;
                currentGuessPos = pos;
                currentGuessLetter = correctLetter;

                const item = sentenceItems[pos];
                if (item) guessNumberPreview.textContent = item.number;

                guessFeedback.textContent = '';
                guessFeedback.className = 'guess-feedback';
                guessInput.value = '';

                modal.classList.add('active');

                setTimeout(function() {
                    try {
                        guessInput.focus();
                        guessInput.setSelectionRange(0, 1);
                    } catch (e) {}
                }, 50);
            }

            function closeGuessModal() {
                modal.classList.remove('active');
                currentGuessPos = null;
                currentGuessLetter = null;
                guessInput.blur();
            }

            function submitGuess() {
                let guess = guessInput.value.trim().toUpperCase();
                const feedback = guessFeedback;

                if (!guess || !guess.match(/[A-Z]/)) {
                    feedback.textContent = '❌ Enter a single letter A–Z';
                    feedback.className = 'guess-feedback error';
                    guessInput.value = '';
                    guessInput.focus();
                    return;
                }
                if (guess.length > 1) guess = guess[0];

                if (currentGuessPos === null) { closeGuessModal(); return; }

                const correct = (guess === currentGuessLetter);

                if (correct) {
                    feedback.textContent = '✅ Correct! Letter revealed.';
                    feedback.className = 'guess-feedback success';
                    const letterToReveal = currentGuessLetter;
                    revealLetter(letterToReveal);
                    setTimeout(function() { closeGuessModal(); }, 500);
                } else {
                    feedback.textContent = '❌ Wrong. \'' + guess + '\' is not correct.';
                    feedback.className = 'guess-feedback error';
                    guessInput.value = '';
                    guessInput.focus();
                }
            }

            submitBtn.addEventListener('click', submitGuess);
            cancelBtn.addEventListener('click', closeGuessModal);

            guessInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitGuess();
                }
            });

            /* Auto-submit when a single letter is typed */
            guessInput.addEventListener('input', function() {
                const val = this.value.trim().toUpperCase();
                if (val.length === 1 && /[A-Z]/.test(val)) {
                    setTimeout(submitGuess, 180);
                }
            });

            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeGuessModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeGuessModal();
                }
            });

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(applyScale, 100);
            });

            window.addEventListener('load', function() {
                setTimeout(applyScale, 300);
            });

            init();

            /* Expose for debugging */
            window.__cryptogram = { openGuessModal: openGuessModal, closeGuessModal: closeGuessModal };
        })();

        /* ============================================================
           BOOT
           ============================================================ */
        window.addEventListener('load', function () {
            document.body.classList.add('ready');
            checkStickyNotes();
        });
        if (document.readyState === 'complete') {
            document.body.classList.add('ready');
            checkStickyNotes();
        }
    </script>
</body>
</html>
