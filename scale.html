<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚖️ Real Balance</title>
<link rel="preload" as="image" href="assets/background.png">
<link rel="preload" as="image" href="assets/column.png">
<link rel="preload" as="image" href="assets/beam.png">
<link rel="preload" as="image" href="assets/panstring.png">
<link rel="preload" as="image" href="assets/cogback.png">
<style>
    /* =========================================================
       ★★★ POSITION & SCALE CONTROLS — EDIT THESE ★★★
       ========================================================= */
    :root {
        /* ----- DRAWER (drawopen / drawclose) ----- */
        --drawer-top:        -300px;
        --drawer-shift-x:    0px;
        --drawer-close-scale: 0.403;
        --drawer-open-scale:  0.49;
        --drawer-open-top:    -13px;
        --drawer-open-shift-x: 0px;

        /* ----- DRAWER LETTER (drawletter.png) ----- */
        --drawletter-x:     0px;
        --drawletter-y:     15px;
        --drawletter-scale: 0.3;

        /* ----- DRAWER LETTER BIG (drawletterbig.png) ----- */
        --drawletterbig-x:     0px;
        --drawletterbig-y:     -230px;
        --drawletterbig-scale: 0.8;

        /* ----- BEAM WIDTH ----- */
        --beam-width-factor: 0.75;

        /* ----- SCALE SECTION ----- */
        --scale-top:         0px;
        --scale-shift-x:     0px;

        /* =========================================================
           ★★★ COG CONTROLS ★★★
           ========================================================= */
        --cog-stage-top:    0px;
        --cog-stage-bottom: 0px;
        --cog-stage-height: 0px;

        --cogback-x:     -167px;
        --cogback-y:     398px;
        --cogback-scale: 0.13;
        --cogback-layer: 1;

        --cog1-x:     -170px;
        --cog1-y:     410px;
        --cog1-scale: 0.06;
        --cog1-spin:  8s;
        --cog1-dir:   normal;
        --cog1-layer: 4;

        --cog2-x:     -170px;
        --cog2-y:     445px;
        --cog2-scale: 0.09;
        --cog2-spin:  6s;
        --cog2-dir:   reverse;
        --cog2-layer: 3;

        --cog3-x:     -173px;
        --cog3-y:     430px;
        --cog3-scale: 0.095;
        --cog3-spin:  10s;
        --cog3-dir:   normal;
        --cog3-layer: 2;

        --cog4-x:     -175px;
        --cog4-y:     382px;
        --cog4-scale: 0.09;
        --cog4-spin:  12s;
        --cog4-dir:   reverse;
        --cog4-layer: 5;

        --cog5-x:     -174px;
        --cog5-y:     416px;
        --cog5-scale: 0.09;
        --cog5-spin:  8s;
        --cog5-dir:   normal;
        --cog5-layer: 6;

        --cog6-x:     175px;
        --cog6-y:     441px;
        --cog6-scale: 0.09;
        --cog6-spin:  8s;
        --cog6-dir:   reverse;
        --cog6-layer: 13;

        --cog7-x:     172px;
        --cog7-y:     390px;
        --cog7-scale: 0.09;
        --cog7-spin:  8s;
        --cog7-dir:   normal;
        --cog7-layer: 10;

        --cog8-x:     170px;
        --cog8-y:     400px;
        --cog8-scale: 0.09;
        --cog8-spin:  8s;
        --cog8-dir:   reverse;
        --cog8-layer: 11;

        --cog9-x:     168px;
        --cog9-y:     430px;
        --cog9-scale: 0.1;
        --cog9-spin:  8s;
        --cog9-dir:   normal;
        --cog9-layer: 12;

        --cog10-x:     172px;
        --cog10-y:     380px;
        --cog10-scale: 0.07;
        --cog10-spin:  8s;
        --cog10-dir:   normal;
        --cog10-layer: 9;

        --cog11-x:     173px;
        --cog11-y:     420px;
        --cog11-scale: 0.08;
        --cog11-spin:  8s;
        --cog11-dir:   reverse;
        --cog11-layer: 8;

        --cog12-x:     184px;
        --cog12-y:     455px;
        --cog12-scale: 0.05;
        --cog12-spin:  8s;
        --cog12-dir:   normal;
        --cog12-layer: 7;

        --bg:        #0a0d16;
        --text:      #e8ecf5;
        --muted:     #8892ab;
        --gold:      #f0b429;
        --gold-hi:   #ffd066;
        --gold-lo:   #d99a1a;
        --green:     #34d399;
        --red:       #f87171;
        --line:      rgba(255,255,255,0.08);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    html { background-color: #0a0d16; }

    body {
        min-height: 100vh;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                     'Helvetica Neue', Arial, sans-serif;
        color: var(--text);
        background-color: #0a0d16;
        background-image: url('assets/background.png');
        background-position: center top;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: scroll;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        opacity: 0;
        transition: opacity .4s ease;
    }
    body.ready { opacity: 1; }

    /* ---- Back buttons ---- */
    .back-to-desk,
    .back-to-puzzles {
        position: fixed;
        top: 14px;
        padding: 9px 20px;
        border-radius: 40px;
        font-family: 'Courier New', monospace;
        font-size: .72rem;
        font-weight: bold;
        letter-spacing: .22em;
        text-transform: uppercase;
        text-decoration: none;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 9999;
        transition: background .18s ease, border-color .18s ease;
    }
    .back-to-puzzles {
        left: 14px;
        background: rgba(15,12,8,.85);
        border: 1px solid #8a6e42;
        color: #eace9f;
    }
    .back-to-puzzles:hover { background: rgba(60,40,15,.95); border-color: #d8ab6a; }
    .back-to-desk {
        right: 14px;
        background: rgba(15,42,63,.85);
        border: 1px solid rgba(182,139,92,.4);
        color: #eace9f;
    }
    .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }

    .game-container {
        width: 100%;
        max-width: 100%;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
        position: relative;
    }

    .ui-header {
        position: relative;
        z-index: 40;
        max-width: 560px;
        margin: 0 auto;
        padding: 30px 20px 14px;
        text-align: center;
    }

    h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        line-height: 1.25;
        color: #eef2fb;
    }

    .balance-word {
        display: inline-block;
        transform-origin: center center;
        color: var(--gold);
        animation: wobbleBalance 2.8s ease-in-out 1 forwards;
    }

    @keyframes wobbleBalance {
        0%   { transform: rotate(0deg)     scale(1);    }
        8%   { transform: rotate(-4.5deg)  scale(1.04); }
        18%  { transform: rotate(5deg)     scale(0.97); }
        30%  { transform: rotate(-3deg)    scale(1.02); }
        42%  { transform: rotate(2deg)     scale(1);    }
        58%  { transform: rotate(-1.2deg)  scale(1);    }
        75%  { transform: rotate(0.5deg)   scale(1);    }
        100% { transform: rotate(0deg)     scale(1);    }
    }

    .sub {
        margin-top: 9px;
        font-size: 0.76rem;
        line-height: 1.5;
        color: var(--muted);
        letter-spacing: 0.02em;
    }

    .cog-stage {
        position: relative;
        z-index: 1;
        width: 100%;
        height: var(--cog-stage-height);
        margin-top: var(--cog-stage-top);
        margin-bottom: var(--cog-stage-bottom);
        pointer-events: none;
        overflow: visible;
    }

    .cog-holder {
        position: absolute;
        left: 50%;
        top: 0;
        pointer-events: none;
    }

    .cog-holder img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }

    .cog-spin {
        animation-name: cogSpin;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }

    @keyframes cogSpin {
        from { transform: rotate(0deg);   }
        to   { transform: rotate(360deg); }
    }

    #cogBackHolder {
        width: calc(100% * var(--cogback-scale));
        transform: translate(-50%, 0) translate(var(--cogback-x), var(--cogback-y));
        z-index: var(--cogback-layer);
    }
    #cog1Holder  { width: calc(100% * var(--cog1-scale));  transform: translate(-50%, 0) translate(var(--cog1-x),  var(--cog1-y));  z-index: var(--cog1-layer); }
    #cog1Holder  .cog-spin { animation-duration: var(--cog1-spin);  animation-direction: var(--cog1-dir); }
    #cog2Holder  { width: calc(100% * var(--cog2-scale));  transform: translate(-50%, 0) translate(var(--cog2-x),  var(--cog2-y));  z-index: var(--cog2-layer); }
    #cog2Holder  .cog-spin { animation-duration: var(--cog2-spin);  animation-direction: var(--cog2-dir); }
    #cog3Holder  { width: calc(100% * var(--cog3-scale));  transform: translate(-50%, 0) translate(var(--cog3-x),  var(--cog3-y));  z-index: var(--cog3-layer); }
    #cog3Holder  .cog-spin { animation-duration: var(--cog3-spin);  animation-direction: var(--cog3-dir); }
    #cog4Holder  { width: calc(100% * var(--cog4-scale));  transform: translate(-50%, 0) translate(var(--cog4-x),  var(--cog4-y));  z-index: var(--cog4-layer); }
    #cog4Holder  .cog-spin { animation-duration: var(--cog4-spin);  animation-direction: var(--cog4-dir); }
    #cog5Holder  { width: calc(100% * var(--cog5-scale));  transform: translate(-50%, 0) translate(var(--cog5-x),  var(--cog5-y));  z-index: var(--cog5-layer); }
    #cog5Holder  .cog-spin { animation-duration: var(--cog5-spin);  animation-direction: var(--cog5-dir); }
    #cog6Holder  { width: calc(100% * var(--cog6-scale));  transform: translate(-50%, 0) translate(var(--cog6-x),  var(--cog6-y));  z-index: var(--cog6-layer); }
    #cog6Holder  .cog-spin { animation-duration: var(--cog6-spin);  animation-direction: var(--cog6-dir); }
    #cog7Holder  { width: calc(100% * var(--cog7-scale));  transform: translate(-50%, 0) translate(var(--cog7-x),  var(--cog7-y));  z-index: var(--cog7-layer); }
    #cog7Holder  .cog-spin { animation-duration: var(--cog7-spin);  animation-direction: var(--cog7-dir); }
    #cog8Holder  { width: calc(100% * var(--cog8-scale));  transform: translate(-50%, 0) translate(var(--cog8-x),  var(--cog8-y));  z-index: var(--cog8-layer); }
    #cog8Holder  .cog-spin { animation-duration: var(--cog8-spin);  animation-direction: var(--cog8-dir); }
    #cog9Holder  { width: calc(100% * var(--cog9-scale));  transform: translate(-50%, 0) translate(var(--cog9-x),  var(--cog9-y));  z-index: var(--cog9-layer); }
    #cog9Holder  .cog-spin { animation-duration: var(--cog9-spin);  animation-direction: var(--cog9-dir); }
    #cog10Holder { width: calc(100% * var(--cog10-scale)); transform: translate(-50%, 0) translate(var(--cog10-x), var(--cog10-y)); z-index: var(--cog10-layer); }
    #cog10Holder .cog-spin { animation-duration: var(--cog10-spin); animation-direction: var(--cog10-dir); }
    #cog11Holder { width: calc(100% * var(--cog11-scale)); transform: translate(-50%, 0) translate(var(--cog11-x), var(--cog11-y)); z-index: var(--cog11-layer); }
    #cog11Holder .cog-spin { animation-duration: var(--cog11-spin); animation-direction: var(--cog11-dir); }
    #cog12Holder { width: calc(100% * var(--cog12-scale)); transform: translate(-50%, 0) translate(var(--cog12-x), var(--cog12-y)); z-index: var(--cog12-layer); }
    #cog12Holder .cog-spin { animation-duration: var(--cog12-spin); animation-direction: var(--cog12-dir); }

    .scale-section {
        position: relative;
        z-index: 30;
        width: 100%;
        min-height: 300px;
        overflow: hidden;
        margin-top: var(--scale-top);
        transform: translateX(var(--scale-shift-x));
    }

    .scale-holder { position: relative; width: 100%; height: 100%; }

    .part {
        position: absolute;
        pointer-events: none;
        background-repeat: no-repeat;
        background-position: center;
    }

    #columnPart {
        background-image: url('assets/column.png');
        background-size: 100% 100%;
        background-position: center bottom;
        z-index: 2;
    }

    #beamPart {
        background-image: url('assets/beam.png');
        background-size: 100% 100%;
        z-index: 5;
        transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55));
    }

    #dialLayer {
        position: absolute;
        z-index: 1;
        pointer-events: none;
    }

    .dial {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        padding: 0;
        line-height: 1;
        font-family: inherit;
        font-weight: 800;
        color: #ffffff;
        cursor: pointer;
        pointer-events: auto;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255,255,255,0.22);
        background: #1a2238 url('assets/backgrounddial.jpg') center / cover no-repeat;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow:
            0 6px 16px rgba(0,0,0,0.55),
            0 0 0 1px rgba(0,0,0,0.35),
            inset 0 1px 0 rgba(255,255,255,0.30);
        text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.06s;
        touch-action: manipulation;
    }

    .dial:hover, .dial:focus-visible {
        border-color: rgba(240,180,41,0.85);
        box-shadow:
            0 6px 18px rgba(0,0,0,0.6),
            0 0 0 3px rgba(240,180,41,0.28),
            inset 0 1px 0 rgba(255,255,255,0.35);
        outline: none;
    }

    .dial:active { transform: translate(-50%, -50%) scale(0.92); }

    .dial.solved {
        border-color: var(--green);
        color: #d6ffee;
        box-shadow:
            0 0 0 3px rgba(52,211,153,0.28),
            0 6px 22px rgba(52,211,153,0.45),
            inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .dial.pop { animation: dialPop 0.22s ease-out; }

    @keyframes dialPop {
        0%   { transform: translate(-50%, -50%) scale(1);    }
        45%  { transform: translate(-50%, -50%) scale(1.18); }
        100% { transform: translate(-50%, -50%) scale(1);    }
    }

    .pan-string {
        position: absolute;
        z-index: 20;
        pointer-events: auto;
        cursor: pointer;
        background-image: url('assets/panstring.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 18px;
        filter: drop-shadow(0 10px 14px rgba(0,0,0,0.45));
        transition: filter 0.15s;
    }

    .pan-string:active { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
    .pan-string.bounce { animation: panBounce 0.2s ease-out; }

    @keyframes panBounce {
        0%   { transform: scale(1);    }
        30%  { transform: scale(1.08); }
        70%  { transform: scale(0.96); }
        100% { transform: scale(1);    }
    }

    .weights-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        width: 100%;
        gap: 3px;
        padding-bottom: 4px;
        pointer-events: none;
    }

    .bottom-row, .top-row {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: nowrap;
        width: 100%;
    }

    .weight-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        flex-shrink: 0;
        cursor: pointer;
        pointer-events: auto;
        background: transparent;
        border: none;
        filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
        transition: filter 0.08s, transform 0.08s;
    }

    .weight-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .weight-badge:hover { filter: drop-shadow(0 0 8px rgba(240,180,41,0.85)); }
    .weight-badge:active {
        transform: translateY(2px) scale(0.95);
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
    }

    .ui-body {
        position: relative;
        z-index: 40;
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 18px 40px;
    }

    .tray-label {
        margin: 0 0 8px 2px;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
    }

    .tray {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 13px 12px;
        border-radius: 18px;
        background: rgba(255,255,255,0.035);
        border: 1px solid var(--line);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .tray-item {
        width: 56px;
        height: 56px;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        cursor: pointer;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 6px 14px -6px rgba(0,0,0,0.7);
        transition: transform 0.12s ease, background 0.12s,
                    border-color 0.12s, box-shadow 0.12s;
    }

    .tray-item img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }

    .tray-item:hover { background: rgba(255,255,255,0.09); transform: translateY(-2px); }
    .tray-item:active { transform: translateY(1px) scale(0.96); }

    .tray-item.selected {
        border-color: var(--gold);
        background: rgba(240,180,41,0.14);
        box-shadow:
            0 0 0 2px rgba(240,180,41,0.35),
            0 10px 22px -8px rgba(240,180,41,0.6);
        transform: translateY(-3px);
    }

    .tray-item.used {
        opacity: 0.20;
        filter: grayscale(1);
        pointer-events: none;
        transform: scale(0.94);
    }

    .action-row { display: flex; gap: 10px; margin-top: 16px; }

    .btn {
        flex: 1;
        padding: 14px 16px;
        border-radius: 15px;
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        color: #dfe5f2;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 8px 18px -12px rgba(0,0,0,0.9);
        transition: transform 0.08s, background 0.15s,
                    box-shadow 0.15s, border-color 0.15s;
    }

    .btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18); }
    .btn:active { transform: translateY(2px); box-shadow: none; }

    .btn-primary {
        color: #261a04;
        border-color: rgba(255,255,255,0.35);
        background: linear-gradient(180deg, var(--gold-hi), var(--gold-lo));
        box-shadow:
            0 10px 24px -10px rgba(240,180,41,0.85),
            inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .btn-primary:hover { background: linear-gradient(180deg, #ffd97a, #e2a623); }

    .message {
        margin-top: 14px;
        min-height: 1.25rem;
        text-align: center;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        transition: color 0.2s;
    }

    .message.ok  { color: var(--green); }
    .message.err { color: var(--red);   }

    .drawer {
        display: grid;
        place-items: start center;
        position: relative;
        z-index: 50;
        margin-top: var(--drawer-top);
        transform: translateX(var(--drawer-shift-x));
        pointer-events: auto;
    }

    .drawer-img {
        grid-area: 1 / 1;
        display: block;
        max-width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: auto;
    }

    #drawerClose {
        width: calc(100% * var(--drawer-close-scale));
        cursor: pointer;
        visibility: visible;
    }

    #drawerOpen {
        width: calc(100% * var(--drawer-open-scale));
        transform: translate(var(--drawer-open-shift-x), var(--drawer-open-top));
        cursor: pointer;
        visibility: hidden;
    }

    .drawer.is-open #drawerClose { visibility: hidden; }
    .drawer.is-open #drawerOpen  { visibility: visible; }

    @keyframes drawerGlow {
        0%, 100% {
            filter:
                drop-shadow(0 0 3px rgba(240,180,41,0.35))
                drop-shadow(0 0 6px rgba(240,180,41,0.20));
        }
        50% {
            filter:
                drop-shadow(0 0 8px rgba(240,180,41,0.75))
                drop-shadow(0 0 16px rgba(240,180,41,0.40));
        }
    }

    .drawer.can-open #drawerClose {
        animation: drawerGlow 2.4s ease-in-out infinite;
    }

    .drawer-letter,
    .drawer-letterbig {
        position: absolute;
        left: 50%;
        top: 0;
        display: block;
        max-width: none;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        cursor: pointer;
        visibility: hidden;
        transform-origin: top center;
    }

    #drawerLetter {
        width: calc(100% * var(--drawletter-scale));
        transform: translate(-50%, 0) translate(var(--drawletter-x), var(--drawletter-y));
        z-index: 2;
    }

    #drawerLetterBig {
        width: calc(100% * var(--drawletterbig-scale));
        transform: translate(-50%, 0) translate(var(--drawletterbig-x), var(--drawletterbig-y));
        z-index: 3;
    }

    .drawer.is-open #drawerLetter { visibility: visible; }
    .drawer.letter-open #drawerLetterBig { visibility: visible; }

    @media (max-width: 420px) {
        .ui-header { padding: 22px 16px 12px; }
        h1 { font-size: 1.28rem; letter-spacing: 0.15em; }
        .weight-badge { width: 38px; height: 38px; }
        .tray-item { width: 50px; height: 50px; padding: 6px; border-radius: 14px; }
        .tray { gap: 8px; padding: 11px 10px; }
        .btn { font-size: 0.76rem; padding: 13px 10px; letter-spacing: 0.09em; }
        .ui-body { padding: 16px 14px 32px; }
        .back-to-desk, .back-to-puzzles { font-size: .68rem; padding: 8px 14px; letter-spacing: .18em; }
    }

    @media (max-width: 360px) {
        h1 { font-size: 1.1rem; }
        .sub { font-size: 0.68rem; }
        .weight-badge { width: 32px; height: 32px; }
        .tray-item { width: 44px; height: 44px; padding: 5px; }
        .tray { gap: 7px; padding: 10px 8px; }
    }
</style>
</head>
<body>

<a class="back-to-puzzles" href="puzzles.html">← Puzzles</a>
<a class="back-to-desk" href="index.html">← Desk</a>

<div class="game-container">

    <header class="ui-header">
        <h1>
            <span>⚖️ REAL </span><span class="balance-word">BALANCE</span>
        </h1>
        <p class="sub">tap a weight, then a pan &middot; tap a dial on the column to set the code</p>
    </header>

    <section class="cog-stage" id="cogStage">
        <div class="cog-holder" id="cogBackHolder"><img src="assets/cogback.png" alt=""></div>
        <div class="cog-holder" id="cog1Holder"><img src="assets/cog1.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog2Holder"><img src="assets/cog2.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog3Holder"><img src="assets/cog3.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog4Holder"><img src="assets/cog4.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog5Holder"><img src="assets/cog5.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog6Holder"><img src="assets/cog6.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog7Holder"><img src="assets/cog7.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog8Holder"><img src="assets/cog8.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog9Holder"><img src="assets/cog9.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog10Holder"><img src="assets/cog10.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog11Holder"><img src="assets/cog11.png" alt="" class="cog-spin"></div>
        <div class="cog-holder" id="cog12Holder"><img src="assets/cog12.png" alt="" class="cog-spin"></div>
    </section>

    <section class="scale-section" id="scaleSection">
        <div class="scale-holder" id="scaleHolder">
            <div id="columnPart" class="part"></div>
            <div id="dialLayer"></div>
            <div id="beamPart" class="part"></div>

            <div class="pan-string" id="leftPan">
                <div class="weights-container">
                    <div class="top-row"    id="leftTopRow"></div>
                    <div class="bottom-row" id="leftBottomRow"></div>
                </div>
            </div>

            <div class="pan-string" id="rightPan">
                <div class="weights-container">
                    <div class="top-row"    id="rightTopRow"></div>
                    <div class="bottom-row" id="rightBottomRow"></div>
                </div>
            </div>
        </div>
    </section>

    <div class="ui-body">
        <div class="tray-label">Weights</div>
        <div class="tray" id="tray">
            <div class="tray-item" data-type="2"><img src="assets/2weight.png" alt="2"></div>
            <div class="tray-item" data-type="5"><img src="assets/5weight.png" alt="5"></div>
            <div class="tray-item" data-type="star"><img src="assets/star.png" alt="star"></div>
            <div class="tray-item" data-type="triangle"><img src="assets/triangle.png" alt="triangle"></div>
            <div class="tray-item" data-type="circle"><img src="assets/ball.png" alt="circle"></div>
        </div>

        <div class="action-row">
            <button class="btn" id="resetBtn">Reset</button>
            <button class="btn btn-primary" id="checkBtn">Check</button>
        </div>

        <div class="message" id="messageDisplay"></div>

        <div class="drawer" id="drawer">
            <img src="assets/drawclose.png" alt="drawer" class="drawer-img drawer-close" id="drawerClose">
            <img src="assets/drawopen.png" alt="drawer open" class="drawer-img drawer-open" id="drawerOpen">
            <img src="assets/drawletter.png" alt="letter" class="drawer-letter" id="drawerLetter">
            <img src="assets/drawletterbig.png" alt="letter big" class="drawer-letterbig" id="drawerLetterBig">
        </div>
    </div>
</div>

<script>
(function () {
    "use strict";

    const OFFSETS = {
        column:   { x: 0, y: 100, scale: 1 },
        beam:     { x: 0, y: 0, scale: 1 },
        leftPan:  { x: 0, y: 0, scale: 1 },
        rightPan: { x: 0, y: 0, scale: 1 }
    };

    const CONFIG = {
        columnWidth:  100,
        columnHeight: 260,
        colTop:       110,
        beamWidth:    320,
        beamHeight:   80,
        panWidth:     130,
        panHeight:    160,
        containerWidth:  380,
        containerHeight: 320,
        pivotY: 50,
        pivotX: 190
    };

    const DIALS = [
        { x: 22, y: 75.5, size: 10, value: 0, symbol: '⭐' },
        { x: 50, y: 68,   size: 13, value: 0, symbol: '🔺' },
        { x: 78, y: 75.5, size: 10, value: 0, symbol: '⚫' }
    ];

    const SECRET = { star: 2, triangle: 4, circle: 6 };

    const scaleSection  = document.getElementById('scaleSection');
    const beamEl        = document.getElementById('beamPart');
    const columnEl      = document.getElementById('columnPart');
    const dialLayer     = document.getElementById('dialLayer');
    const leftPan       = document.getElementById('leftPan');
    const rightPan      = document.getElementById('rightPan');
    const leftTopRow    = document.getElementById('leftTopRow');
    const leftBottomRow = document.getElementById('leftBottomRow');
    const rightTopRow   = document.getElementById('rightTopRow');
    const rightBottomRow= document.getElementById('rightBottomRow');
    const trayItems     = document.querySelectorAll('.tray-item');
    const resetBtn      = document.getElementById('resetBtn');
    const checkBtn      = document.getElementById('checkBtn');
    const msgEl         = document.getElementById('messageDisplay');
    const drawer        = document.getElementById('drawer');
    const drawerClose   = document.getElementById('drawerClose');
    const drawerLetter  = document.getElementById('drawerLetter');

    let leftSet      = new Set();
    let rightSet     = new Set();
    let selectedType = null;

    const dialEls  = [];
    const dialNums = [];

    let columnAspect = 100 / 260;
    let msgTimer     = null;

    function getImagePath(type) {
        return {
            '2':        'assets/2weight.png',
            '5':        'assets/5weight.png',
            'star':     'assets/star.png',
            'triangle': 'assets/triangle.png',
            'circle':   'assets/ball.png'
        }[type] || '';
    }

    function getValue(type) {
        if (type === '2') return 2;
        if (type === '5') return 5;
        if (type === 'star')     return SECRET.star;
        if (type === 'triangle') return SECRET.triangle;
        if (type === 'circle')   return SECRET.circle;
        return 0;
    }

    function getChar(type) {
        return { '2': '2', '5': '5', star: '⭐', triangle: '🔺', circle: '⚫' }[type] || '?';
    }

    function splitPyramid(set) {
        const arr = Array.from(set);
        const n = arr.length;
        if (n <= 2) return { bottom: arr, top: [] };
        if (n <= 4) return { bottom: arr.slice(0, 2), top: arr.slice(2) };
        return { bottom: arr.slice(0, 3), top: arr.slice(3) };
    }

    function computeTotals() {
        let l = 0, r = 0;
        for (const t of leftSet)  l += getValue(t);
        for (const t of rightSet) r += getValue(t);
        return { l, r };
    }

    function setMsg(text, kind, autoClearMs) {
        clearTimeout(msgTimer);
        msgEl.textContent = text;
        msgEl.className = 'message' + (kind ? ' ' + kind : '');
        if (autoClearMs) {
            msgTimer = setTimeout(function () {
                if (msgEl.textContent === text) {
                    msgEl.textContent = '';
                    msgEl.className = 'message';
                }
            }, autoClearMs);
        }
    }

    function dialDisplay(i) {
        const d = DIALS[i];
        return d.value === 10 ? d.symbol : String(d.value);
    }

    function isCodeCorrect() {
        return DIALS[0].value === SECRET.star &&
               DIALS[1].value === SECRET.triangle &&
               DIALS[2].value === SECRET.circle;
    }

    function updateDrawerGlow() {
        if (isCodeCorrect()) drawer.classList.add('can-open');
        else                 drawer.classList.remove('can-open');
    }

    function fitColumn() {
        const stageW = scaleSection.clientWidth;
        if (!stageW) return;

        const ar = columnAspect;
        const maxColW = Math.min(stageW, 760);
        let w = maxColW;
        let h = w / ar;

        const maxH = Math.max(420, window.innerHeight * 0.80);
        if (h > maxH) { h = maxH; w = h * ar; }

        CONFIG.columnWidth  = w;
        CONFIG.columnHeight = h;
        CONFIG.colTop       = 0;
        CONFIG.pivotY       = CONFIG.colTop + h * 0.155;

        const beamFactor = parseFloat(
            getComputedStyle(document.documentElement)
                .getPropertyValue('--beam-width-factor')
        ) || 1.25;

        const beamW = Math.min(stageW - 24, Math.max(120, w * beamFactor));
        CONFIG.beamWidth  = beamW;
        CONFIG.beamHeight = beamW * 0.25;

        const sectionH = h + 115;
        scaleSection.style.height = sectionH + 'px';

        CONFIG.containerWidth  = stageW;
        CONFIG.containerHeight = sectionH;
        CONFIG.pivotX          = stageW / 2;
    }

    function buildDials() {
        dialLayer.innerHTML = '';
        dialEls.length  = 0;
        dialNums.length = 0;

        DIALS.forEach(function (dial, i) {
            const el = document.createElement('button');
            el.type = 'button';
            el.className = 'dial';

            const num = document.createElement('span');
            num.textContent = dialDisplay(i);
            el.appendChild(num);

            el.addEventListener('click', function (e) {
                e.stopPropagation(); e.preventDefault();
                stepDial(i, 1);
            });
            el.addEventListener('contextmenu', function (e) {
                e.preventDefault(); e.stopPropagation();
                stepDial(i, -1);
            });
            el.addEventListener('wheel', function (e) {
                e.preventDefault();
                stepDial(i, e.deltaY < 0 ? 1 : -1);
            }, { passive: false });
            el.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                    e.preventDefault(); stepDial(i, 1);
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                    e.preventDefault(); stepDial(i, -1);
                }
            });
            el.addEventListener('animationend', function () { el.classList.remove('pop'); });

            dialLayer.appendChild(el);
            dialEls.push(el);
            dialNums.push(num);
        });

        updateDialLabels();
    }

    function layoutDials(colW, colH) {
        dialEls.forEach(function (el, i) {
            const d = DIALS[i];
            const sizePx = colW * d.size / 100;
            el.style.width  = sizePx + 'px';
            el.style.height = sizePx + 'px';
            el.style.left   = (colW * d.x / 100) + 'px';
            el.style.top    = (colH * d.y / 100) + 'px';
            el.style.fontSize = Math.max(10, Math.round(sizePx * 0.62)) + 'px';
        });
    }

    function stepDial(i, delta) {
        const d = DIALS[i];
        d.value = (d.value + delta + 11) % 11;
        dialNums[i].textContent = dialDisplay(i);

        const el = dialEls[i];
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');

        dialEls.forEach(function (x) { x.classList.remove('solved'); });
        updateDialLabels();
        updateDrawerGlow();
    }

    function updateDialLabels() {
        const names = ['star', 'triangle', 'circle'];
        dialEls.forEach(function (el, i) {
            const shown = DIALS[i].value === 10 ? DIALS[i].symbol : DIALS[i].value;
            el.setAttribute('aria-label', names[i] + ' dial, value ' + shown);
        });
    }

    function renderWeights() {
        leftBottomRow.innerHTML  = '';
        leftTopRow.innerHTML     = '';
        rightBottomRow.innerHTML = '';
        rightTopRow.innerHTML    = '';

        const l = splitPyramid(leftSet);
        l.bottom.forEach(function (t) { leftBottomRow.appendChild(makeBadge(t, 'left')); });
        l.top.forEach(function (t)    { leftTopRow.appendChild(makeBadge(t, 'left')); });

        const r = splitPyramid(rightSet);
        r.bottom.forEach(function (t) { rightBottomRow.appendChild(makeBadge(t, 'right')); });
        r.top.forEach(function (t)    { rightTopRow.appendChild(makeBadge(t, 'right')); });
    }

    function makeBadge(type, side) {
        const b = document.createElement('span');
        b.className = 'weight-badge';
        const img = document.createElement('img');
        img.src = getImagePath(type);
        img.alt = getChar(type);
        b.appendChild(img);
        b.addEventListener('click', function (e) {
            e.stopPropagation();
            if (selectedType !== null) addToSide(side);
            else                       removeWeight(side, type);
        });
        return b;
    }

    function removeWeight(side, type) {
        if (side === 'left') leftSet.delete(type);
        else                 rightSet.delete(type);
        if (selectedType === type) selectedType = null;
        renderAll();
    }

    function updatePositions(angle) {
        const column = OFFSETS.column;
        const beam   = OFFSETS.beam;
        const lpo    = OFFSETS.leftPan;
        const rpo    = OFFSETS.rightPan;
        const { containerWidth, containerHeight } = CONFIG;

        const colW = CONFIG.columnWidth  * column.scale;
        const colH = CONFIG.columnHeight * column.scale;
        const colTopPx = CONFIG.colTop + column.y;
        const colLeftCss = 'calc(50% - ' + (colW / 2) + 'px + ' + column.x + 'px)';

        columnEl.style.width  = colW + 'px';
        columnEl.style.height = colH + 'px';
        columnEl.style.left   = colLeftCss;
        columnEl.style.top    = colTopPx + 'px';

        dialLayer.style.width  = colW + 'px';
        dialLayer.style.height = colH + 'px';
        dialLayer.style.left   = colLeftCss;
        dialLayer.style.top    = colTopPx + 'px';
        layoutDials(colW, colH);

        const beamW = CONFIG.beamWidth  * beam.scale;
        const beamH = CONFIG.beamHeight * beam.scale;
        const halfW = beamW / 2;
        const pivotX = containerWidth / 2;

        beamEl.style.width  = beamW + 'px';
        beamEl.style.height = beamH + 'px';
        beamEl.style.left   = (pivotX - halfW + beam.x) + 'px';
        beamEl.style.top    = (CONFIG.pivotY - beamH / 2 + beam.y) + 'px';
        beamEl.style.transformOrigin = halfW + 'px ' + (beamH / 2) + 'px';
        beamEl.style.transform = 'rotate(' + angle + 'deg)';

        const rad = angle * Math.PI / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);
        const beamCX = pivotX + beam.x;
        const beamCY = CONFIG.pivotY + beam.y;

        const leftEndX  = beamCX - halfW * cos;
        const leftEndY  = beamCY - halfW * sin;
        const rightEndX = beamCX + halfW * cos;
        const rightEndY = beamCY + halfW * sin;

        const stringLen = 70;

        const panW = CONFIG.panWidth  * lpo.scale;
        const panH = CONFIG.panHeight * lpo.scale;
        let lx = leftEndX + lpo.x;
        let ly = leftEndY + stringLen + lpo.y;
        lx = Math.max(panW / 2, Math.min(containerWidth  - panW / 2, lx));
        ly = Math.max(panH / 2, Math.min(containerHeight - panH / 2, ly));
        leftPan.style.width  = panW + 'px';
        leftPan.style.height = panH + 'px';
        leftPan.style.left   = (lx - panW / 2) + 'px';
        leftPan.style.top    = (ly - panH / 2) + 'px';

        const panWR = CONFIG.panWidth  * rpo.scale;
        const panHR = CONFIG.panHeight * rpo.scale;
        let rx = rightEndX + rpo.x;
        let ry = rightEndY + stringLen + rpo.y;
        rx = Math.max(panWR / 2, Math.min(containerWidth  - panWR / 2, rx));
        ry = Math.max(panHR / 2, Math.min(containerHeight - panHR / 2, ry));
        rightPan.style.width  = panWR + 'px';
        rightPan.style.height = panHR + 'px';
        rightPan.style.left   = (rx - panWR / 2) + 'px';
        rightPan.style.top    = (ry - panHR / 2) + 'px';
    }

    function renderAll() {
        renderWeights();
        const { l, r } = computeTotals();
        const diff  = l - r;
        const angle = Math.min(18, Math.max(-18, -diff * 0.8));
        updatePositions(angle);

        trayItems.forEach(function (item) {
            const t = item.dataset.type;
            item.classList.toggle('used', leftSet.has(t) || rightSet.has(t));
            item.classList.toggle('selected',
                t === selectedType && !leftSet.has(t) && !rightSet.has(t));
        });
    }

    function addToSide(side) {
        if (!selectedType) {
            setMsg('Pick a weight from the tray first', 'err', 900);
            return;
        }
        if (leftSet.has(selectedType) || rightSet.has(selectedType)) {
            setMsg('That weight is already on the scale', 'err', 1000);
            return;
        }
        if (side === 'left') leftSet.add(selectedType);
        else                 rightSet.add(selectedType);

        selectedType = null;
        renderAll();

        const pan = (side === 'left') ? leftPan : rightPan;
        pan.classList.add('bounce');
        setTimeout(function () { pan.classList.remove('bounce'); }, 200);

        setMsg('');
    }

    function resetAll() {
        leftSet.clear();
        rightSet.clear();
        selectedType = null;

        DIALS.forEach(function (d, i) {
            d.value = 0;
            dialNums[i].textContent = dialDisplay(i);
            dialEls[i].classList.remove('solved', 'pop');
        });
        updateDialLabels();

        renderAll();
        setMsg('');
        updateDrawerGlow();
    }

    trayItems.forEach(function (item) {
        item.addEventListener('click', function () {
            const t = item.dataset.type;
            if (leftSet.has(t) || rightSet.has(t)) {
                setMsg('That weight is already on the scale', 'err', 900);
                return;
            }
            selectedType = (selectedType === t) ? null : t;
            renderAll();
            if (selectedType) setMsg('Selected ' + getChar(selectedType) + ' — now tap a pan', null, 1100);
            else              setMsg('', null, 0);
        });
    });

    leftPan.addEventListener('click',  function () { addToSide('left');  });
    rightPan.addEventListener('click', function () { addToSide('right'); });
    resetBtn.addEventListener('click', resetAll);

    checkBtn.addEventListener('click', function () {
        if (isCodeCorrect()) {
            setMsg('✅ Solved — the code is right!', 'ok');
            dialEls.forEach(function (el) { el.classList.add('solved'); });
        } else {
            setMsg('❌ Not quite — keep testing the pans.', 'err', 1800);
            dialEls.forEach(function (el) { el.classList.remove('solved'); });
        }
    });

    drawerClose.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!isCodeCorrect()) {
            setMsg('🔒 Set the correct code on the dials first', 'err', 1400);
            return;
        }
        drawer.classList.remove('can-open');
        drawer.classList.add('is-open');
    });

    drawerLetter.addEventListener('click', function (e) {
        e.stopPropagation();
        drawer.classList.add('letter-open');
    });

    function init() {
        fitColumn();
        renderAll();
        updateDrawerGlow();
    }

    (function preloadColumn() {
        const img = new Image();
        img.onload = function () {
            if (img.naturalWidth && img.naturalHeight) {
                columnAspect = img.naturalWidth / img.naturalHeight;
            }
            init();
        };
        img.onerror = function () { init(); };
        img.src = 'assets/column.png';
    })();

    buildDials();

    window.addEventListener('load', init);
    window.addEventListener('resize', init);
    setTimeout(init, 100);

    /* ---- fade in when everything is ready ---- */
    window.addEventListener('load', function () { document.body.classList.add('ready'); });
    if (document.readyState === 'complete') { document.body.classList.add('ready'); }
})();
</script>
</body>
