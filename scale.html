<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Scale Room</title>
<link rel="preload" as="image" href="scalebookpuzzlebackground.png">
<link rel="preload" as="image" href="scalepart.png">
<link rel="preload" as="image" href="bookoverlay.png">
<link rel="preload" as="image" href="bookpuzzlebackground.png">

<link rel="preload" as="image" href="column.png">
<link rel="preload" as="image" href="beam.png">
<link rel="preload" as="image" href="panstring.png">
<style>
    /* =========================================================
       ★★★ ROOM IMAGE POSITION & SCALE — EDIT THESE ★★★
       ========================================================= */
    :root {
        /* ---------- SCALE PART (scalepart.png) ---------- */
        --scalepart-w:      55%;
        --scalepart-x:      0px;
        --scalepart-y:      0px;
        --scalepart-scale:  0.6;

        /* ---------- BOOK OVERLAY (bookoverlay.png) ---------- */
        --bookoverlay-w:      40%;
        --bookoverlay-x:      0px;
        --bookoverlay-y:      0px;
        --bookoverlay-scale:  0.6;

        /* =========================================================
           ★★★ SCALE PUZZLE CONTROLS — EXACT COPY OF ORIGINAL ★★★
           ========================================================= */
        --drawer-top:        -355px;
        --drawer-shift-x:    0px;
        --drawer-close-scale: 0.403;
        --drawer-open-scale:  0.49;
        --drawer-open-top:    -13px;
        --drawer-open-shift-x: 0px;

        --drawletter-x:     0px;
        --drawletter-y:     15px;
        --drawletter-scale: 0.3;

        --drawletterbig-x:     0px;
        --drawletterbig-y:     -230px;
        --drawletterbig-scale: 0.8;

        --beam-width-factor: 0.75;

        --scale-top:         0px;
        --scale-shift-x:     0px;

        --cog-stage-top:    0px;
        --cog-stage-bottom: 0px;
        --cog-stage-height: 0px;

        --cogback-x:     -167px;
        --cogback-y:     398px;
        --cogback-scale: 0.13;
        --cogback-layer: 1;

        --cog1-x:     -170px;
        --cog1-y:     410px;
        --cog1-scale: 0.06;
        --cog1-spin:  8s;
        --cog1-dir:   normal;
        --cog1-layer: 4;

        --cog2-x:     -170px;
        --cog2-y:     445px;
        --cog2-scale: 0.09;
        --cog2-spin:  6s;
        --cog2-dir:   reverse;
        --cog2-layer: 3;

        --cog3-x:     -173px;
        --cog3-y:     430px;
        --cog3-scale: 0.095;
        --cog3-spin:  10s;
        --cog3-dir:   normal;
        --cog3-layer: 2;

        --cog4-x:     -175px;
        --cog4-y:     382px;
        --cog4-scale: 0.09;
        --cog4-spin:  12s;
        --cog4-dir:   reverse;
        --cog4-layer: 5;

        --cog5-x:     -174px;
        --cog5-y:     416px;
        --cog5-scale: 0.09;
        --cog5-spin:  8s;
        --cog5-dir:   normal;
        --cog5-layer: 6;

        --cog6-x:     175px;
        --cog6-y:     441px;
        --cog6-scale: 0.09;
        --cog6-spin:  8s;
        --cog6-dir:   reverse;
        --cog6-layer: 13;

        --cog7-x:     172px;
        --cog7-y:     390px;
        --cog7-scale: 0.09;
        --cog7-spin:  8s;
        --cog7-dir:   normal;
        --cog7-layer: 10;

        --cog8-x:     170px;
        --cog8-y:     400px;
        --cog8-scale: 0.09;
        --cog8-spin:  8s;
        --cog8-dir:   reverse;
        --cog8-layer: 11;

        --cog9-x:     168px;
        --cog9-y:     430px;
        --cog9-scale: 0.1;
        --cog9-spin:  8s;
        --cog9-dir:   normal;
        --cog9-layer: 12;

        --cog10-x:     172px;
        --cog10-y:     380px;
        --cog10-scale: 0.07;
        --cog10-spin:  8s;
        --cog10-dir:   normal;
        --cog10-layer: 9;

        --cog11-x:     173px;
        --cog11-y:     420px;
        --cog11-scale: 0.08;
        --cog11-spin:  8s;
        --cog11-dir:   reverse;
        --cog11-layer: 8;

        --cog12-x:     184px;
        --cog12-y:     455px;
        --cog12-scale: 0.05;
        --cog12-spin:  8s;
        --cog12-dir:   normal;
        --cog12-layer: 7;

        --bg:        #0a0d16;
        --text:      #e8ecf5;
        --muted:     #8892ab;
        --gold:      #f0b429;
        --gold-hi:   #ffd066;
        --gold-lo:   #d99a1a;
        --green:     #34d399;
        --red:       #f87171;
        --line:      rgba(255,255,255,0.08);
    }

    /* ======================= GLOBAL ======================= */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }
    html { background-color: #0a0d16; }

    body {
        min-height: 100vh;
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                     'Helvetica Neue', Arial, sans-serif;
        background-color: #0a0d16;
        color: #e8ecf5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        opacity: 0;
        transition: opacity .4s ease;
    }
    body.ready { opacity: 1; }

    .screen[hidden] { display: none !important; }

    /* ---- Back buttons ---- */
    .back-to-desk,
    .back-to-puzzles {
        position: fixed;
        top: 14px;
        padding: 9px 20px;
        border-radius: 40px;
        font-family: 'Courier New', monospace;
        font-size: .72rem;
        font-weight: bold;
        letter-spacing: .22em;
        text-transform: uppercase;
        text-decoration: none;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 99999;
        transition: background .18s ease, border-color .18s ease;
        cursor: pointer;
        border: none;
    }
    .back-to-puzzles {
        left: 14px;
        background: rgba(15,12,8,.85);
        border: 1px solid #8a6e42;
        color: #eace9f;
    }
    .back-to-puzzles:hover { background: rgba(60,40,15,.95); border-color: #d8ab6a; }
    .back-to-desk {
        right: 14px;
        background: rgba(15,42,63,.85);
        border: 1px solid rgba(182,139,92,.4);
        color: #eace9f;
    }
    .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }

    /* =========================================================
       ROOM SCREEN
       ========================================================= */
    .screen-room {
        position: relative;
        width: 100%;
        max-width: 100%;
        line-height: 0;
        overflow: visible;
    }
    .room-bg {
        display: block;
        width: 100%;
        height: auto;
        max-width: 100%;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }
    .room-hotspot {
        position: absolute;
        top: 0;
        left: 50%;
        display: block;
        height: auto;
        max-width: none;
        transform-origin: top center;
        cursor: pointer;
        user-select: none;
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
        transition: filter .18s ease;
        will-change: transform;
    }
    #scalePart {
        width: var(--scalepart-w);
        z-index: 3;
        transform: translate(-50%, 0)
                   translate(var(--scalepart-x), var(--scalepart-y))
                   scale(var(--scalepart-scale));
    }
    #bookOverlay {
        width: var(--bookoverlay-w);
        z-index: 2;
        transform: translate(-50%, 0)
                   translate(var(--bookoverlay-x), var(--bookoverlay-y))
                   scale(var(--bookoverlay-scale));
    }
    .room-hotspot:hover {
        filter: drop-shadow(0 0 14px rgba(240,180,41,.75)) brightness(1.07);
    }
    .room-hotspot:active {
        filter: drop-shadow(0 0 8px rgba(240,180,41,.9)) brightness(.94);
    }

    /* =========================================================
       BOOK PUZZLE SCREEN
       ========================================================= */
    .screen-book {
        min-height: 100vh;
        color: #d9c58f;
        font-family: Georgia, 'Times New Roman', serif;
        background: #0a0705;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    .screen-book .topbar {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 14px;
        text-align: center;
    }
    .screen-book h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: 2px;
        font-weight: normal;
        text-shadow: 0 0 12px #c9832f88, 0 2px 6px #000;
    }
    .screen-book .sub {
        font-size: 11px;
        opacity: .75;
        margin: 4px 0 8px;
        font-style: italic;
        text-shadow: 0 1px 4px #000;
    }
    .screen-book .hud {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 12px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .screen-book .bk-tray { display: flex; gap: 6px; }
    .screen-book .slot {
        width: 34px;
        height: 34px;
        border: 1px solid #6b4a25;
        border-radius: 6px;
        background: #1a110acc;
        display: grid;
        place-items: center;
        opacity: .9;
    }
    .screen-book .slot svg {
        width: 26px;
        height: 26px;
        filter: brightness(.25) grayscale(1);
        transition: .6s;
    }
    .screen-book .slot.on {
        border-color: #c9a24b;
        box-shadow: 0 0 12px #c9a24b99;
    }
    .screen-book .slot.on svg { filter: none; }
    .screen-book button {
        font: inherit;
        color: #d9c58f;
        background: #2a1a0dcc;
        border: 1px solid #7a5a2d;
        border-radius: 6px;
        padding: 5px 11px;
        cursor: pointer;
        font-size: 12px;
    }
    .screen-book button:disabled { opacity: .5; cursor: default; }

    .screen-book .stage {
        position: relative;
        width: 100%;
        max-width: 100%;
        line-height: 0;
    }
    .screen-book .bg-full {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 0;
        transform: translate(var(--bk-bgx, 0px), var(--bk-bgy, 0px));
        will-change: transform;
    }
    .screen-book .board {
        position: absolute;
        top: 0;
        left: 50%;
        z-index: 3;
        touch-action: none;
        line-height: normal;
        transform: translateX(-50%)
                   translate(var(--bk-px, 0px), var(--bk-py, 0px))
                   scale(var(--bk-psx, 1), var(--bk-psy, 1));
        transform-origin: top center;
        will-change: transform;
    }
    .screen-book .pc {
        position: absolute;
        left: 0;
        top: 0;
        display: grid;
        place-items: center;
        z-index: 1;
        transition: opacity .8s;
    }
    .screen-book .pc svg { width: 80%; height: 80%; }
    .screen-book .pc.got svg { animation: bkSh .9s ease-out forwards; }
    .screen-book .pc.gone { opacity: 0; }
    @keyframes bkSh {
        0%   { filter: drop-shadow(0 0 0 #ffd86b); }
        40%  { filter: drop-shadow(0 0 14px #ffd86b); transform: scale(1.25); }
        100% { filter: drop-shadow(0 0 6px #ffd86b); transform: scale(1); }
    }
    .screen-book .blk {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        z-index: 2;
        cursor: grab;
        border-radius: 3px;
        box-shadow: 0 4px 10px #000a, 0 0 0 1px #0009;
        transition: transform .16s ease-out, filter .15s;
        overflow: hidden;
    }
    .screen-book .blk:hover { filter: brightness(1.15); }
    .screen-book .blk.drag {
        transition: none;
        z-index: 5;
        cursor: grabbing;
        filter: brightness(1.25);
    }
    .screen-book .blk img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        -webkit-user-drag: none;
        user-select: none;
        -webkit-touch-callout: none;
    }
    .screen-book #win {
        position: fixed;
        inset: 0;
        background: #000c;
        display: none;
        place-items: center;
        z-index: 20;
        text-align: center;
        padding: 20px;
    }
    .screen-book #win.on { display: grid; }
    .screen-book #win > div {
        max-width: 340px;
        padding: 26px;
        border: 1px solid #c9a24b;
        border-radius: 10px;
        background: #1d130b;
        box-shadow: 0 0 40px #c9a24b55;
    }
    .screen-book #win h2 {
        margin: 0 0 8px;
        font-weight: normal;
        color: #ffd86b;
        font-size: 20px;
    }
    .screen-book #win p {
        font-size: 13px;
        line-height: 1.55;
        color: #d9c58f;
        margin-bottom: 12px;
    }

    /* =========================================================
       SCALE PUZZLE SCREEN
       ========================================================= */
    .screen-scale {
        min-height: 100vh;
        color: var(--text);
        background-color: var(--bg);
        background-image: url('background.png');
        background-position: center top;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: scroll;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }
    .screen-scale .game-container {
        width: 100%;
        max-width: 100%;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
        position: relative;
    }
    .screen-scale .ui-header {
        position: relative;
        z-index: 40;
        max-width: 560px;
        margin: 0 auto;
        padding: 30px 20px 14px;
        text-align: center;
    }
    .screen-scale h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        line-height: 1.25;
        color: #eef2fb;
    }
    .screen-scale .balance-word {
        display: inline-block;
        transform-origin: center center;
        color: var(--gold);
        animation: wobbleBalance 2.8s ease-in-out 1 forwards;
    }
    @keyframes wobbleBalance {
        0%   { transform: rotate(0deg)     scale(1);    }
        8%   { transform: rotate(-4.5deg)  scale(1.04); }
        18%  { transform: rotate(5deg)     scale(0.97); }
        30%  { transform: rotate(-3deg)    scale(1.02); }
        42%  { transform: rotate(2deg)     scale(1);    }
        58%  { transform: rotate(-1.2deg)  scale(1);    }
        75%  { transform: rotate(0.5deg)   scale(1);    }
        100% { transform: rotate(0deg)     scale(1);    }
    }
    .screen-scale .sub {
        margin-top: 9px;
        font-size: 0.76rem;
        line-height: 1.5;
        color: var(--muted);
        letter-spacing: 0.02em;
    }
    .screen-scale .cog-stage {
        position: relative;
        z-index: 1;
        width: 100%;
        height: var(--cog-stage-height);
        margin-top: var(--cog-stage-top);
        margin-bottom: var(--cog-stage-bottom);
        pointer-events: none;
        overflow: visible;
    }
    .screen-scale .cog-holder {
        position: absolute;
        left: 50%;
        top: 0;
        pointer-events: none;
    }
    .screen-scale .cog-holder img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }
    .screen-scale .cog-spin {
        animation-name: cogSpin;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }
    @keyframes cogSpin {
        from { transform: rotate(0deg);   }
        to   { transform: rotate(360deg); }
    }
    .screen-scale #cogBackHolder {
        width: calc(100% * var(--cogback-scale));
        transform: translate(-50%, 0) translate(var(--cogback-x), var(--cogback-y));
        z-index: var(--cogback-layer);
    }
    .screen-scale #cog1Holder  { width: calc(100% * var(--cog1-scale));  transform: translate(-50%, 0) translate(var(--cog1-x),  var(--cog1-y));  z-index: var(--cog1-layer); }
    .screen-scale #cog1Holder  .cog-spin { animation-duration: var(--cog1-spin);  animation-direction: var(--cog1-dir); }
    .screen-scale #cog2Holder  { width: calc(100% * var(--cog2-scale));  transform: translate(-50%, 0) translate(var(--cog2-x),  var(--cog2-y));  z-index: var(--cog2-layer); }
    .screen-scale #cog2Holder  .cog-spin { animation-duration: var(--cog2-spin);  animation-direction: var(--cog2-dir); }
    .screen-scale #cog3Holder  { width: calc(100% * var(--cog3-scale));  transform: translate(-50%, 0) translate(var(--cog3-x),  var(--cog3-y));  z-index: var(--cog3-layer); }
    .screen-scale #cog3Holder  .cog-spin { animation-duration: var(--cog3-spin);  animation-direction: var(--cog3-dir); }
    .screen-scale #cog4Holder  { width: calc(100% * var(--cog4-scale));  transform: translate(-50%, 0) translate(var(--cog4-x),  var(--cog4-y));  z-index: var(--cog4-layer); }
    .screen-scale #cog4Holder  .cog-spin { animation-duration: var(--cog4-spin);  animation-direction: var(--cog4-dir); }
    .screen-scale #cog5Holder  { width: calc(100% * var(--cog5-scale));  transform: translate(-50%, 0) translate(var(--cog5-x),  var(--cog5-y));  z-index: var(--cog5-layer); }
    .screen-scale #cog5Holder  .cog-spin { animation-duration: var(--cog5-spin);  animation-direction: var(--cog5-dir); }
    .screen-scale #cog6Holder  { width: calc(100% * var(--cog6-scale));  transform: translate(-50%, 0) translate(var(--cog6-x),  var(--cog6-y));  z-index: var(--cog6-layer); }
    .screen-scale #cog6Holder  .cog-spin { animation-duration: var(--cog6-spin);  animation-direction: var(--cog6-dir); }
    .screen-scale #cog7Holder  { width: calc(100% * var(--cog7-scale));  transform: translate(-50%, 0) translate(var(--cog7-x),  var(--cog7-y));  z-index: var(--cog7-layer); }
    .screen-scale #cog7Holder  .cog-spin { animation-duration: var(--cog7-spin);  animation-direction: var(--cog7-dir); }
    .screen-scale #cog8Holder  { width: calc(100% * var(--cog8-scale));  transform: translate(-50%, 0) translate(var(--cog8-x),  var(--cog8-y));  z-index: var(--cog8-layer); }
    .screen-scale #cog8Holder  .cog-spin { animation-duration: var(--cog8-spin);  animation-direction: var(--cog8-dir); }
    .screen-scale #cog9Holder  { width: calc(100% * var(--cog9-scale));  transform: translate(-50%, 0) translate(var(--cog9-x),  var(--cog9-y));  z-index: var(--cog9-layer); }
    .screen-scale #cog9Holder  .cog-spin { animation-duration: var(--cog9-spin);  animation-direction: var(--cog9-dir); }
    .screen-scale #cog10Holder { width: calc(100% * var(--cog10-scale)); transform: translate(-50%, 0) translate(var(--cog10-x), var(--cog10-y)); z-index: var(--cog10-layer); }
    .screen-scale #cog10Holder .cog-spin { animation-duration: var(--cog10-spin); animation-direction: var(--cog10-dir); }
    .screen-scale #cog11Holder { width: calc(100% * var(--cog11-scale)); transform: translate(-50%, 0) translate(var(--cog11-x), var(--cog11-y)); z-index: var(--cog11-layer); }
    .screen-scale #cog11Holder .cog-spin { animation-duration: var(--cog11-spin); animation-direction: var(--cog11-dir); }
    .screen-scale #cog12Holder { width: calc(100% * var(--cog12-scale)); transform: translate(-50%, 0) translate(var(--cog12-x), var(--cog12-y)); z-index: var(--cog12-layer); }
    .screen-scale #cog12Holder .cog-spin { animation-duration: var(--cog12-spin); animation-direction: var(--cog12-dir); }

    .screen-scale .scale-section {
        position: relative;
        z-index: 30;
        width: 100%;
        min-height: 300px;
        overflow: hidden;
        margin-top: var(--scale-top);
        transform: translateX(var(--scale-shift-x));
    }
    .screen-scale .scale-holder { position: relative; width: 100%; height: 100%; }
    .screen-scale .part {
        position: absolute;
        pointer-events: none;
        background-repeat: no-repeat;
        background-position: center;
    }
    .screen-scale #columnPart {
        background-image: url('column.png');
        background-size: 100% 100%;
        background-position: center bottom;
        z-index: 2;
    }
    .screen-scale #beamPart {
        background-image: url('beam.png');
        background-size: 100% 100%;
        z-index: 5;
        transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55));
    }
    .screen-scale #dialLayer {
        position: absolute;
        z-index: 1;
        pointer-events: none;
    }
    .screen-scale .dial {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        padding: 0;
        line-height: 1;
        font-family: inherit;
        font-weight: 800;
        color: #ffffff;
        cursor: pointer;
        pointer-events: auto;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255,255,255,0.22);
        background: #1a2238 url('backgrounddial.jpg') center / cover no-repeat;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow:
            0 6px 16px rgba(0,0,0,0.55),
            0 0 0 1px rgba(0,0,0,0.35),
            inset 0 1px 0 rgba(255,255,255,0.30);
        text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.06s;
        touch-action: manipulation;
    }
    .screen-scale .dial:hover, .screen-scale .dial:focus-visible {
        border-color: rgba(240,180,41,0.85);
        box-shadow:
            0 6px 18px rgba(0,0,0,0.6),
            0 0 0 3px rgba(240,180,41,0.28),
            inset 0 1px 0 rgba(255,255,255,0.35);
        outline: none;
    }
    .screen-scale .dial:active { transform: translate(-50%, -50%) scale(0.92); }
    .screen-scale .dial.solved {
        border-color: var(--green);
        color: #d6ffee;
        box-shadow:
            0 0 0 3px rgba(52,211,153,0.28),
            0 6px 22px rgba(52,211,153,0.45),
            inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .screen-scale .dial.pop { animation: dialPop 0.22s ease-out; }
    @keyframes dialPop {
        0%   { transform: translate(-50%, -50%) scale(1);    }
        45%  { transform: translate(-50%, -50%) scale(1.18); }
        100% { transform: translate(-50%, -50%) scale(1);    }
    }
    .screen-scale .pan-string {
        position: absolute;
        z-index: 20;
        pointer-events: auto;
        cursor: pointer;
        background-image: url('panstring.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 18px;
        filter: drop-shadow(0 10px 14px rgba(0,0,0,0.45));
        transition: filter 0.15s;
    }
    .screen-scale .pan-string:active { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
    .screen-scale .pan-string.bounce { animation: panBounce 0.2s ease-out; }
    @keyframes panBounce {
        0%   { transform: scale(1);    }
        30%  { transform: scale(1.08); }
        70%  { transform: scale(0.96); }
        100% { transform: scale(1);    }
    }
    .screen-scale .weights-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        width: 100%;
        gap: 3px;
        padding-bottom: 4px;
        pointer-events: none;
    }
    .screen-scale .bottom-row,
    .screen-scale .top-row {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: nowrap;
        width: 100%;
    }
    .screen-scale .weight-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        flex-shrink: 0;
        cursor: pointer;
        pointer-events: auto;
        background: transparent;
        border: none;
        filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
        transition: filter 0.08s, transform 0.08s;
    }
    .screen-scale .weight-badge img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }
    .screen-scale .weight-badge:hover { filter: drop-shadow(0 0 8px rgba(240,180,41,0.85)); }
    .screen-scale .weight-badge:active {
        transform: translateY(2px) scale(0.95);
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
    }
    .screen-scale .ui-body {
        position: relative;
        z-index: 40;
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 18px 40px;
    }
    .screen-scale .tray-label {
        margin: 0 0 8px 2px;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
    }
    .screen-scale .tray {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 13px 12px;
        border-radius: 18px;
        background: rgba(255,255,255,0.035);
        border: 1px solid var(--line);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .screen-scale .tray-item {
        width: 56px;
        height: 56px;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        cursor: pointer;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 6px 14px -6px rgba(0,0,0,0.7);
        transition: transform 0.12s ease, background 0.12s,
                    border-color 0.12s, box-shadow 0.12s;
    }
    .screen-scale .tray-item img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
    }
    .screen-scale .tray-item:hover { background: rgba(255,255,255,0.09); transform: translateY(-2px); }
    .screen-scale .tray-item:active { transform: translateY(1px) scale(0.96); }
    .screen-scale .tray-item.selected {
        border-color: var(--gold);
        background: rgba(240,180,41,0.14);
        box-shadow:
            0 0 0 2px rgba(240,180,41,0.35),
            0 10px 22px -8px rgba(240,180,41,0.6);
        transform: translateY(-3px);
    }
    .screen-scale .tray-item.used {
        opacity: 0.20;
        filter: grayscale(1);
        pointer-events: none;
        transform: scale(0.94);
    }
    .screen-scale .action-row { display: flex; gap: 10px; margin-top: 16px; }
    .screen-scale .btn {
        flex: 1;
        padding: 14px 16px;
        border-radius: 15px;
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        color: #dfe5f2;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 8px 18px -12px rgba(0,0,0,0.9);
        transition: transform 0.08s, background 0.15s,
                    box-shadow 0.15s, border-color 0.15s;
    }
    .screen-scale .btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18); }
    .screen-scale .btn:active { transform: translateY(2px); box-shadow: none; }
    .screen-scale .btn-primary {
        color: #261a04;
        border-color: rgba(255,255,255,0.35);
        background: linear-gradient(180deg, var(--gold-hi), var(--gold-lo));
        box-shadow:
            0 10px 24px -10px rgba(240,180,41,0.85),
            inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .screen-scale .btn-primary:hover { background: linear-gradient(180deg, #ffd97a, #e2a623); }

    .screen-scale .scale-back-btn {
        display: block;
        width: 100%;
        margin-top: 10px;
        flex: none;
    }

    .screen-scale .message {
        margin-top: 14px;
        min-height: 1.25rem;
        text-align: center;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        transition: color 0.2s;
    }
    .screen-scale .message.ok  { color: var(--green); }
    .screen-scale .message.err { color: var(--red);   }

    .screen-scale .drawer {
        display: grid;
        place-items: start center;
        position: relative;
        z-index: 50;
        margin-top: var(--drawer-top);
        transform: translateX(var(--drawer-shift-x));
        pointer-events: auto;
    }
    .screen-scale .drawer-img {
        grid-area: 1 / 1;
        display: block;
        max-width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: auto;
    }
    .screen-scale #drawerClose {
        width: calc(100% * var(--drawer-close-scale));
        cursor: pointer;
        visibility: visible;
    }
    .screen-scale #drawerOpen {
        width: calc(100% * var(--drawer-open-scale));
        transform: translate(var(--drawer-open-shift-x), var(--drawer-open-top));
        cursor: pointer;
        visibility: hidden;
    }
    .screen-scale .drawer.is-open #drawerClose { visibility: hidden; }
    .screen-scale .drawer.is-open #drawerOpen  { visibility: visible; }

    @keyframes drawerGlow {
        0%, 100% {
            filter:
                drop-shadow(0 0 3px rgba(240,180,41,0.35))
                drop-shadow(0 0 6px rgba(240,180,41,0.20));
        }
        50% {
            filter:
                drop-shadow(0 0 8px rgba(240,180,41,0.75))
                drop-shadow(0 0 16px rgba(240,180,41,0.40));
        }
    }
    .screen-scale .drawer.can-open #drawerClose {
        animation: drawerGlow 2.4s ease-in-out infinite;
    }
    .screen-scale .drawer-letter,
    .screen-scale .drawer-letterbig {
        position: absolute;
        left: 50%;
        top: 0;
        display: block;
        max-width: none;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        cursor: pointer;
        visibility: hidden;
        transform-origin: top center;
    }
    .screen-scale #drawerLetter {
        width: calc(100% * var(--drawletter-scale));
        transform: translate(-50%, 0) translate(var(--drawletter-x), var(--drawletter-y));
        z-index: 2;
    }
    .screen-scale #drawerLetterBig {
        width: calc(100% * var(--drawletterbig-scale));
        transform: translate(-50%, 0) translate(var(--drawletterbig-x), var(--drawletterbig-y));
        z-index: 3;
    }
    .screen-scale .drawer.is-open #drawerLetter { visibility: visible; }
    .screen-scale .drawer.letter-open #drawerLetterBig { visibility: visible; }

    /* =========================================================
       MISSING-PARTS STATE
       Column, dials, drawer and Back-to-Room button stay visible.
       Beam, pan strings, weights and Reset/Check become invisible
       but keep their layout space (drawer stays put).
       ========================================================= */
    #screenScale.parts-missing #beamPart,
    #screenScale.parts-missing #leftPan,
    #screenScale.parts-missing #rightPan,
    #screenScale.parts-missing .pan-string,
    #screenScale.parts-missing .tray-label,
    #screenScale.parts-missing #tray,
    #screenScale.parts-missing .action-row {
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
    }

    #screenScale.parts-missing .ui-header::after {
        content: "🔒 Beam, pan strings and weights missing";
        display: block;
        margin-top: 10px;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(240,180,41,0.75);
    }

    /* ---- Responsive tweaks ---- */
    @media (max-width: 420px) {
        .screen-scale .ui-header { padding: 22px 16px 12px; }
        .screen-scale h1 { font-size: 1.28rem; letter-spacing: 0.15em; }
        .screen-scale .weight-badge { width: 38px; height: 38px; }
        .screen-scale .tray-item { width: 50px; height: 50px; padding: 6px; border-radius: 14px; }
        .screen-scale .tray { gap: 8px; padding: 11px 10px; }
        .screen-scale .btn { font-size: 0.76rem; padding: 13px 10px; letter-spacing: 0.09em; }
        .screen-scale .ui-body { padding: 16px 14px 32px; }
        .back-to-desk, .back-to-puzzles { font-size: .68rem; padding: 8px 14px; letter-spacing: .18em; }
    }
    @media (max-width: 360px) {
        .screen-scale h1 { font-size: 1.1rem; }
        .screen-scale .sub { font-size: 0.68rem; }
        .screen-scale .weight-badge { width: 32px; height: 32px; }
        .screen-scale .tray-item { width: 44px; height: 44px; padding: 5px; }
        .screen-scale .tray { gap: 7px; padding: 10px 8px; }
    }
</style>
</head>
<body>

<script>
(function () {
    "use strict";

    /* =========================================================
       UNLOCK FLAG
       Uses the whitby_ prefix so "New Game" on the main menu
       wipes it along with all other progress.
       ========================================================= */
    var UNLOCK_KEY = 'whitby_scalePartsUnlocked';

    function isUnlocked() {
        try { return localStorage.getItem(UNLOCK_KEY) === '1'; }
        catch (e) { return false; }
    }
    function setUnlocked(v) {
        try {
            if (v) localStorage.setItem(UNLOCK_KEY, '1');
            else   localStorage.removeItem(UNLOCK_KEY);
        } catch (e) {}
    }

    /* Dev shortcut: ?unlock=1 forces on, ?unlock=0 forces off */
    try {
        var params = new URLSearchParams(location.search);
        var ov = params.get('unlock');
        if (ov === '1') setUnlocked(true);
        if (ov === '0') setUnlocked(false);
    } catch (e) {}

    /* =========================================================
       SCREEN ROUTER
       ========================================================= */
    var screens = {
        room:  document.getElementById('screenRoom'),
        book:  document.getElementById('screenBook'),
        scale: document.getElementById('screenScale')
    };

    function applyPartsState(locked) {
        var ids = ['beamPart', 'leftPan', 'rightPan', 'tray'];
        var classes = ['tray-label', 'action-row', 'pan-string'];

        ids.forEach(function(id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.style.visibility = locked ? 'hidden' : '';
            el.style.opacity    = locked ? '0'      : '';
            el.style.pointerEvents = locked ? 'none' : '';
        });
        classes.forEach(function(cls) {
            var list = document.querySelectorAll('.screen-scale .' + cls);
            for (var i = 0; i < list.length; i++) {
                list[i].style.visibility = locked ? 'hidden' : '';
                list[i].style.opacity    = locked ? '0'      : '';
                list[i].style.pointerEvents = locked ? 'none' : '';
            }
        });
    }

    function showScreen(name) {
        for (var k in screens) if (screens[k]) screens[k].hidden = (k !== name);

        if (name === 'book') {
            /* Wait two animation frames so the browser has fully laid
               out the newly-unhidden book screen before we measure it. */
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    if (window.__bookOnShow) window.__bookOnShow();
                });
            });
        }

        if (name === 'scale') {
            var unlocked = isUnlocked();
            screens.scale.classList.toggle('parts-missing', !unlocked);
            applyPartsState(!unlocked);
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    if (window.__scaleOnShow) window.__scaleOnShow();
                });
            });
        }

        window.scrollTo(0, 0);
    }

    /* ---- Nav buttons ---- */
    document.getElementById('navPuzzles').addEventListener('click', function () {
        location.href = 'puzzles.html';
    });
    document.getElementById('navDesk').addEventListener('click', function () {
        location.href = 'desk.html';
    });

    /* ---- Room hotspots ---- */
    document.getElementById('bookOverlay').addEventListener('click', function () {
        showScreen('book');
    });
    document.getElementById('scalePart').addEventListener('click', function () {
        showScreen('scale');
    });

    /* ---- Book screen nav ---- */
    document.getElementById('bkBack').addEventListener('click', function () {
        showScreen('room');
    });
    document.getElementById('bkBackToRoom').addEventListener('click', function () {
        showScreen('room');
    });

    /* =========================================================
       BOOK PUZZLE
       ========================================================= */
    (function () {
        var CONFIG = {
            BG_X: 0, BG_Y: 0,
            PUZZLE_X: 20, PUZZLE_Y: 85,
            PUZZLE_SCALE_X: 1.40, PUZZLE_SCALE_Y: 0.95
        };

        var B=[[1,2,0,1],[1,3,0,2],[1,3,0,3],[1,3,1,0],[1,3,2,1],[1,1,3,2],[1,3,3,3],[1,1,4,0],[2,1,5,0],[1,3,5,2],[2,2,6,0],[1,3,6,3],[1,2,8,0],[1,2,8,1],[1,1,9,2],[1,1,9,3]];
        var T=[[7,2,'beam'],[6,3,'pan'],[2,1,'weight']];
        var IC={
            beam:'<path d="M4 14h32M20 14v16M13 31h14" stroke="url(#br)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="14" r="4.5" fill="url(#br)"/><circle cx="4" cy="16" r="2.5" fill="url(#br)"/><circle cx="36" cy="16" r="2.5" fill="url(#br)"/>',
            pan:'<path d="M20 4L7 22M20 4l13 18" stroke="url(#br)" stroke-width="2" fill="none"/><path d="M5 22h30c0 8-6 13-15 13S5 30 5 22z" fill="url(#br)"/>',
            weight:'<circle cx="20" cy="9" r="4.5" stroke="url(#br)" stroke-width="2.5" fill="none"/><path d="M14 14h12l6 21H8z" fill="url(#br)"/>'
        };
        var svg=function(k){return '<svg viewBox="0 0 40 40">'+IC[k]+'</svg>'};
        var $=function(id){return document.getElementById(id)};
        var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

        var s,pos,moves,got,els,pcs,drag=null;
        var solving=false, solveGen=0;

        function applyConfig() {
            var r=document.documentElement.style;
            r.setProperty('--bk-bgx', CONFIG.BG_X+'px');
            r.setProperty('--bk-bgy', CONFIG.BG_Y+'px');
            r.setProperty('--bk-px',  CONFIG.PUZZLE_X+'px');
            r.setProperty('--bk-py',  CONFIG.PUZZLE_Y+'px');
            r.setProperty('--bk-psx', CONFIG.PUZZLE_SCALE_X);
            r.setProperty('--bk-psy', CONFIG.PUZZLE_SCALE_Y);
        }

        function buildGrid(p){
            var g=Array.from({length:10},function(){return Array(4).fill(-1)});
            for(var i=0;i<B.length;i++){
                var w=B[i][0],h=B[i][1],r0=p[i][0],c0=p[i][1];
                for(var y=0;y<h;y++)for(var x=0;x<w;x++) g[r0+y][c0+x]=i;
            }
            return g;
        }
        function keyFromPos(p){
            var s='';
            for(var i=0;i<p.length;i++) s+=String.fromCharCode(32+p[i][0]*4+p[i][1]);
            return s;
        }
        function posFromKey(k){
            var p=[];
            for(var i=0;i<k.length;i++){
                var v=k.charCodeAt(i)-32;
                p.push([Math.floor(v/4),v%4]);
            }
            return p;
        }
        function solve(startPos,tr,tc,maxStates){
            maxStates = maxStates || 400000;
            var startKey=keyFromPos(startPos);
            var visited=new Set([startKey]);
            var keys=[startKey], parents=[-1], moveInfos=[null], head=0;
            while(head<keys.length && keys.length<maxStates){
                var k=keys[head];
                var p=posFromKey(k);
                var g=buildGrid(p);
                for(var i=0;i<B.length;i++){
                    var w=B[i][0],h=B[i][1];
                    var r0=p[i][0],c0=p[i][1];
                    var iCovers = tr>=r0 && tr<r0+h && tc>=c0 && tc<c0+w;
                    var dirs=[[0,-1],[0,1],[-1,0],[1,0]];
                    for(var d=0;d<4;d++){
                        var dr=dirs[d][0],dc=dirs[d][1];
                        var r=r0,c=c0;
                        for(var dist=1;;dist++){
                            r+=dr;c+=dc;
                            if(r<0||c<0||r+h>10||c+w>4) break;
                            var ok=true;
                            for(var y=0;y<h&&ok;y++){
                                for(var x=0;x<w;x++){
                                    var cell=g[r+y][c+x];
                                    if(cell!==-1&&cell!==i){ok=false;break}
                                }
                            }
                            if(!ok) break;
                            var nk=k.substring(0,i)+String.fromCharCode(32+r*4+c)+k.substring(i+1);
                            if(visited.has(nk)) continue;
                            visited.add(nk);
                            keys.push(nk);parents.push(head);
                            moveInfos.push({i:i,dr:dr,dc:dc,dist:dist});
                            var newCovers = tr>=r && tr<r+h && tc>=c && tc<c+w;
                            if(iCovers && !newCovers){
                                var path=[];var cur=keys.length-1;
                                while(parents[cur]!==-1){
                                    path.unshift(moveInfos[cur]);
                                    cur=parents[cur];
                                }
                                return path;
                            }
                        }
                    }
                }
                head++;
            }
            return null;
        }

        function occ(ex){
            var g=Array.from({length:10},function(){return Array(4).fill(-1)});
            B.forEach(function(b,i){
                if(i==ex)return;
                for(var y=0;y<b[1];y++)for(var x=0;x<b[0];x++)g[pos[i][0]+y][pos[i][1]+x]=i;
            });
            return g;
        }
        function free(i,dr,dc){
            var g=occ(i),w=B[i][0],h=B[i][1];
            var r=pos[i][0],c=pos[i][1],k=0;
            for(;;){
                r+=dr;c+=dc;
                if(r<0||c<0||r+h>10||c+w>4)break;
                var ok=1;
                for(var y=0;y<h;y++)for(var x=0;x<w;x++)if(g[r+y][c+x]>=0)ok=0;
                if(!ok)break;
                k++;
            }
            return k;
        }
        function place(i,ox,oy){
            ox=ox||0;oy=oy||0;
            els[i].style.transform='translate('+(pos[i][1]*s+2+ox)+'px,'+(pos[i][0]*s+2+oy)+'px)';
        }
        function layout(){
            var screenEl  = document.getElementById('screenBook');
            var boardEl   = $('bkBd');
            var stageEl   = boardEl ? boardEl.parentNode : null;
            var measuredW = (screenEl && screenEl.clientWidth)
                         || (stageEl && stageEl.clientWidth)
                         || innerWidth
                         || 360;

            var availW = measuredW - 30;
            var availH = innerHeight - 190;
            s = Math.max(28, Math.min(96, Math.floor(availW/4), Math.floor(availH/10)));

            var bd=$('bkBd');
            bd.style.width  = 4*s + 'px';
            bd.style.height = 10*s + 'px';
            B.forEach(function(b,i){
                var e=els[i];
                e.style.width=b[0]*s-4+'px';
                e.style.height=b[1]*s-4+'px';
                place(i);
            });
            T.forEach(function(t,k){
                var e=pcs[k];
                e.style.width=e.style.height=s+'px';
                e.style.transform='translate('+(t[1]*s)+'px,'+(t[0]*s)+'px)';
            });
        }

        function init(){
            solveGen++; solving=false; drag=null;
            var bd=$('bkBd'); bd.innerHTML=''; $('win').classList.remove('on');
            pos=B.map(function(b){return [b[2],b[3]]});
            moves=0; got=[0,0,0]; $('bkMv').textContent=0; els=[]; pcs=[];
            $('bkTray').innerHTML=T.map(function(t,k){
                return '<div class="slot" id="bkS'+k+'">'+svg(t[2])+'</div>';
            }).join('');
            T.forEach(function(t){
                var e=document.createElement('div');
                e.className='pc'; e.innerHTML=svg(t[2]); bd.appendChild(e); pcs.push(e);
            });
            B.forEach(function(b,i){
                var e=document.createElement('div');
                e.className='blk'; e.dataset.i=i;
                var im=new Image();
                im.src='block'+(i+1)+'.png';
                im.alt=''; im.draggable=false;
                e.appendChild(im);
                bd.appendChild(e); els.push(e);
            });
            var btn=$('bkAs'); btn.disabled=false; btn.textContent='Auto Solve';
            layout();
        }

        function check(){
            T.forEach(function(t,k){
                if(got[k])return;
                if(occ(-1)[t[0]][t[1]]<0){
                    got[k]=1;
                    pcs[k].classList.add('got');
                    $('bkS'+k).classList.add('on');
                    setTimeout(function(){pcs[k].classList.add('gone')},1200);
                }
            });
            if(got.every(Boolean)) setTimeout(function(){
                setUnlocked(true);
                $('wt').textContent='Beam, pan and counterweight recovered in '+moves+' moves (par 22).';
                $('win').classList.add('on');
            },1400);
        }

        function doMoveAsync(m){
            return new Promise(function(resolve){
                var i=m.i,dr=m.dr,dc=m.dc,dist=m.dist;
                var e=els[i];
                var nr=pos[i][0]+dr*dist;
                var nc=pos[i][1]+dc*dist;
                e.style.transform='translate('+(nc*s+2)+'px,'+(nr*s+2)+'px)';
                setTimeout(function(){
                    pos[i][0]=nr; pos[i][1]=nc;
                    moves++; $('bkMv').textContent=moves;
                    resolve();
                },180);
            });
        }
        function autoSolve(){
            if(solving) return;
            var next=got.indexOf(0);
            if(next===-1) return;
            solving=true;
            var myGen=solveGen;
            var btn=$('bkAs');
            btn.disabled=true; btn.textContent='Solving…';
            drag=null;
            var tr=T[next][0], tc=T[next][1];
            var pathSolve=solve(pos,tr,tc);
            if(solveGen!==myGen) return;
            if(!pathSolve){
                btn.textContent='No solution';
                setTimeout(function(){
                    btn.disabled=false; btn.textContent='Auto Solve'; solving=false;
                },1500);
                return;
            }
            var chain=Promise.resolve();
            if(pathSolve.length===0){
                chain=chain.then(function(){check();});
            } else {
                pathSolve.forEach(function(m){
                    chain=chain.then(function(){return doMoveAsync(m)});
                });
                chain=chain.then(function(){check();});
            }
            chain.then(function(){
                if(solveGen===myGen){
                    solving=false;
                    btn.disabled=false;
                    btn.textContent='Auto Solve';
                }
            });
        }

        var bd=$('bkBd');
        bd.addEventListener('pointerdown',function(e){
            if(solving) return;
            var el=e.target.closest('.blk'); if(!el) return;
            var i=+el.dataset.i;
            var effX = s * CONFIG.PUZZLE_SCALE_X;
            var effY = s * CONFIG.PUZZLE_SCALE_Y;
            drag={i:i, sx:e.clientX, sy:e.clientY, ax:null, off:0,
                  l:free(i,0,-1)*effX, r:free(i,0,1)*effX,
                  u:free(i,-1,0)*effY, d:free(i,1,0)*effY};
            el.classList.add('drag');
            bd.setPointerCapture(e.pointerId);
        });
        bd.addEventListener('pointermove',function(e){
            if(!drag) return;
            var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
            if(!drag.ax && Math.max(Math.abs(dx),Math.abs(dy))>5)
                drag.ax = Math.abs(dx)>Math.abs(dy)?'x':'y';
            if(!drag.ax) return;
            var v = drag.ax==='x'?dx:dy;
            var lo = -(drag.ax==='x'?drag.l:drag.u);
            var hi = (drag.ax==='x'?drag.r:drag.d);
            drag.off = Math.max(lo, Math.min(hi, v));
            if(drag.ax==='x') place(drag.i, drag.off, 0);
            else              place(drag.i, 0, drag.off);
        });
        function end(){
            if(!drag) return;
            var i=drag.i, ax=drag.ax, off=drag.off;
            els[i].classList.remove('drag');
            drag=null;
            if(!ax) return;
            var cellPx = ax==='x' ? s*CONFIG.PUZZLE_SCALE_X : s*CONFIG.PUZZLE_SCALE_Y;
            var n=Math.round(off/cellPx);
            if(n){
                if(ax==='x') pos[i][1]+=n;
                else         pos[i][0]+=n;
                moves++; $('bkMv').textContent=moves;
            }
            place(i);
            if(n) check();
        }
        bd.addEventListener('pointerup', end);
        bd.addEventListener('pointercancel', end);

        $('bkRs').onclick = init;
        $('bkAs').onclick = autoSolve;
        $('bkAgain').onclick = init;

        applyConfig();
        init();

        window.__bookOnShow = function(){ layout(); };
    })();

    /* =========================================================
       SCALE PUZZLE
       ========================================================= */
    (function () {
        const OFFSETS = {
            column:   { x: 0, y: 100, scale: 1 },
            beam:     { x: 0, y: 0, scale: 1 },
            leftPan:  { x: 0, y: 0, scale: 1 },
            rightPan: { x: 0, y: 0, scale: 1 }
        };

        const CONFIG = {
            columnWidth:  100,
            columnHeight: 260,
            colTop:       110,
            beamWidth:    320,
            beamHeight:   80,
            panWidth:     130,
            panHeight:    160,
            containerWidth:  380,
            containerHeight: 320,
            pivotY: 50,
            pivotX: 190
        };

        const DIALS = [
            { x: 22, y: 75.5, size: 10, value: 0, symbol: '⭐' },
            { x: 50, y: 68,   size: 13, value: 0, symbol: '🔺' },
            { x: 78, y: 75.5, size: 10, value: 0, symbol: '⚫' }
        ];

        const SECRET = { star: 2, triangle: 4, circle: 6 };

        const scaleSection  = document.getElementById('scaleSection');
        const beamEl        = document.getElementById('beamPart');
        const columnEl      = document.getElementById('columnPart');
        const dialLayer     = document.getElementById('dialLayer');
        const leftPan       = document.getElementById('leftPan');
        const rightPan      = document.getElementById('rightPan');
        const leftTopRow    = document.getElementById('leftTopRow');
        const leftBottomRow = document.getElementById('leftBottomRow');
        const rightTopRow   = document.getElementById('rightTopRow');
        const rightBottomRow= document.getElementById('rightBottomRow');
        const trayItems     = document.querySelectorAll('.screen-scale .tray-item');
        const resetBtn      = document.getElementById('resetBtn');
        const checkBtn      = document.getElementById('checkBtn');
        const msgEl         = document.getElementById('messageDisplay');
        const drawer        = document.getElementById('drawer');
        const drawerClose   = document.getElementById('drawerClose');
        const drawerLetter  = document.getElementById('drawerLetter');

        let leftSet      = new Set();
        let rightSet     = new Set();
        let selectedType = null;

        const dialEls  = [];
        const dialNums = [];

        let columnAspect = 100 / 260;
        let msgTimer     = null;

        function getImagePath(type) {
            return {
                '2':        '2weight.png',
                '5':        '5weight.png',
                'star':     'star.png',
                'triangle': 'triangle.png',
                'circle':   'ball.png'
            }[type] || '';
        }

        function getValue(type) {
            if (type === '2') return 2;
            if (type === '5') return 5;
            if (type === 'star')     return SECRET.star;
            if (type === 'triangle') return SECRET.triangle;
            if (type === 'circle')   return SECRET.circle;
            return 0;
        }

        function getChar(type) {
            return { '2': '2', '5': '5', star: '⭐', triangle: '🔺', circle: '⚫' }[type] || '?';
        }

        function splitPyramid(set) {
            const arr = Array.from(set);
            const n = arr.length;
            if (n <= 2) return { bottom: arr, top: [] };
            if (n <= 4) return { bottom: arr.slice(0, 2), top: arr.slice(2) };
            return { bottom: arr.slice(0, 3), top: arr.slice(3) };
        }

        function computeTotals() {
            let l = 0, r = 0;
            for (const t of leftSet)  l += getValue(t);
            for (const t of rightSet) r += getValue(t);
            return { l, r };
        }

        function setMsg(text, kind, autoClearMs) {
            clearTimeout(msgTimer);
            msgEl.textContent = text;
            msgEl.className = 'message' + (kind ? ' ' + kind : '');
            if (autoClearMs) {
                msgTimer = setTimeout(function () {
                    if (msgEl.textContent === text) {
                        msgEl.textContent = '';
                        msgEl.className = 'message';
                    }
                }, autoClearMs);
            }
        }

        function dialDisplay(i) {
            const d = DIALS[i];
            return d.value === 10 ? d.symbol : String(d.value);
        }

        function isCodeCorrect() {
            return DIALS[0].value === SECRET.star &&
                   DIALS[1].value === SECRET.triangle &&
                   DIALS[2].value === SECRET.circle;
        }

        function updateDrawerGlow() {
            if (isCodeCorrect()) drawer.classList.add('can-open');
            else                 drawer.classList.remove('can-open');
        }

        function fitColumn() {
            const stageW = scaleSection.clientWidth
                        || scaleSection.offsetWidth
                        || window.innerWidth
                        || 360;
            if (!stageW) return;

            const ar = columnAspect;
            const maxColW = Math.min(stageW, 760);
            let w = maxColW;
            let h = w / ar;

            const maxH = Math.max(420, window.innerHeight * 0.80);
            if (h > maxH) { h = maxH; w = h * ar; }

            CONFIG.columnWidth  = w;
            CONFIG.columnHeight = h;
            CONFIG.colTop       = 0;
            CONFIG.pivotY       = CONFIG.colTop + h * 0.155;

            const beamFactor = parseFloat(
                getComputedStyle(document.documentElement)
                    .getPropertyValue('--beam-width-factor')
            ) || 1.25;

            const beamW = Math.min(stageW - 24, Math.max(120, w * beamFactor));
            CONFIG.beamWidth  = beamW;
            CONFIG.beamHeight = beamW * 0.25;

            const sectionH = h + 115;
            scaleSection.style.height = sectionH + 'px';

            CONFIG.containerWidth  = stageW;
            CONFIG.containerHeight = sectionH;
            CONFIG.pivotX          = stageW / 2;
        }

        function buildDials() {
            dialLayer.innerHTML = '';
            dialEls.length  = 0;
            dialNums.length = 0;

            DIALS.forEach(function (dial, i) {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'dial';

                const num = document.createElement('span');
                num.textContent = dialDisplay(i);
                el.appendChild(num);

                el.addEventListener('click', function (e) {
                    e.stopPropagation(); e.preventDefault();
                    stepDial(i, 1);
                });
                el.addEventListener('contextmenu', function (e) {
                    e.preventDefault(); e.stopPropagation();
                    stepDial(i, -1);
                });
                el.addEventListener('wheel', function (e) {
                    e.preventDefault();
                    stepDial(i, e.deltaY < 0 ? 1 : -1);
                }, { passive: false });
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                        e.preventDefault(); stepDial(i, 1);
                    } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                        e.preventDefault(); stepDial(i, -1);
                    }
                });
                el.addEventListener('animationend', function () {
                    el.classList.remove('pop');
                });

                dialLayer.appendChild(el);
                dialEls.push(el);
                dialNums.push(num);
            });

            updateDialLabels();
        }

        function layoutDials(colW, colH) {
            dialEls.forEach(function (el, i) {
                const d = DIALS[i];
                const sizePx = colW * d.size / 100;
                el.style.width  = sizePx + 'px';
                el.style.height = sizePx + 'px';
                el.style.left   = (colW * d.x / 100) + 'px';
                el.style.top    = (colH * d.y / 100) + 'px';
                el.style.fontSize = Math.max(10, Math.round(sizePx * 0.62)) + 'px';
            });
        }

        function stepDial(i, delta) {
            const d = DIALS[i];
            d.value = (d.value + delta + 11) % 11;
            dialNums[i].textContent = dialDisplay(i);

            const el = dialEls[i];
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');

            dialEls.forEach(function (x) { x.classList.remove('solved'); });
            updateDialLabels();
            updateDrawerGlow();
        }

        function updateDialLabels() {
            const names = ['star', 'triangle', 'circle'];
            dialEls.forEach(function (el, i) {
                const shown = DIALS[i].value === 10 ? DIALS[i].symbol : DIALS[i].value;
                el.setAttribute('aria-label', names[i] + ' dial, value ' + shown);
            });
        }

        function renderWeights() {
            leftBottomRow.innerHTML  = '';
            leftTopRow.innerHTML     = '';
            rightBottomRow.innerHTML = '';
            rightTopRow.innerHTML    = '';

            const l = splitPyramid(leftSet);
            l.bottom.forEach(function (t) { leftBottomRow.appendChild(makeBadge(t, 'left')); });
            l.top.forEach(function (t)    { leftTopRow.appendChild(makeBadge(t, 'left')); });

            const r = splitPyramid(rightSet);
            r.bottom.forEach(function (t) { rightBottomRow.appendChild(makeBadge(t, 'right')); });
            r.top.forEach(function (t)    { rightTopRow.appendChild(makeBadge(t, 'right')); });
        }

        function makeBadge(type, side) {
            const b = document.createElement('span');
            b.className = 'weight-badge';
            const img = document.createElement('img');
            img.src = getImagePath(type);
            img.alt = getChar(type);
            b.appendChild(img);
            b.addEventListener('click', function (e) {
                e.stopPropagation();
                if (selectedType !== null) addToSide(side);
                else                       removeWeight(side, type);
            });
            return b;
        }

        function removeWeight(side, type) {
            if (side === 'left') leftSet.delete(type);
            else                 rightSet.delete(type);
            if (selectedType === type) selectedType = null;
            renderAll();
        }

        function updatePositions(angle) {
            const column = OFFSETS.column;
            const beam   = OFFSETS.beam;
            const lpo    = OFFSETS.leftPan;
            const rpo    = OFFSETS.rightPan;
            const { containerWidth, containerHeight } = CONFIG;

            const colW = CONFIG.columnWidth  * column.scale;
            const colH = CONFIG.columnHeight * column.scale;
            const colTopPx = CONFIG.colTop + column.y;
            const colLeftCss = 'calc(50% - ' + (colW / 2) + 'px + ' + column.x + 'px)';

            columnEl.style.width  = colW + 'px';
            columnEl.style.height = colH + 'px';
            columnEl.style.left   = colLeftCss;
            columnEl.style.top    = colTopPx + 'px';

            dialLayer.style.width  = colW + 'px';
            dialLayer.style.height = colH + 'px';
            dialLayer.style.left   = colLeftCss;
            dialLayer.style.top    = colTopPx + 'px';
            layoutDials(colW, colH);

            const beamW = CONFIG.beamWidth  * beam.scale;
            const beamH = CONFIG.beamHeight * beam.scale;
            const halfW = beamW / 2;
            const pivotX = containerWidth / 2;

            beamEl.style.width  = beamW + 'px';
            beamEl.style.height = beamH + 'px';
            beamEl.style.left   = (pivotX - halfW + beam.x) + 'px';
            beamEl.style.top    = (CONFIG.pivotY - beamH / 2 + beam.y) + 'px';
            beamEl.style.transformOrigin = halfW + 'px ' + (beamH / 2) + 'px';
            beamEl.style.transform = 'rotate(' + angle + 'deg)';

            const rad = angle * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            const beamCX = pivotX + beam.x;
            const beamCY = CONFIG.pivotY + beam.y;

            const leftEndX  = beamCX - halfW * cos;
            const leftEndY  = beamCY - halfW * sin;
            const rightEndX = beamCX + halfW * cos;
            const rightEndY = beamCY + halfW * sin;

            const stringLen = 70;

            const panW = CONFIG.panWidth  * lpo.scale;
            const panH = CONFIG.panHeight * lpo.scale;
            let lx = leftEndX + lpo.x;
            let ly = leftEndY + stringLen + lpo.y;
            lx = Math.max(panW / 2, Math.min(containerWidth  - panW / 2, lx));
            ly = Math.max(panH / 2, Math.min(containerHeight - panH / 2, ly));
            leftPan.style.width  = panW + 'px';
            leftPan.style.height = panH + 'px';
            leftPan.style.left   = (lx - panW / 2) + 'px';
            leftPan.style.top    = (ly - panH / 2) + 'px';

            const panWR = CONFIG.panWidth  * rpo.scale;
            const panHR = CONFIG.panHeight * rpo.scale;
            let rx = rightEndX + rpo.x;
            let ry = rightEndY + stringLen + rpo.y;
            rx = Math.max(panWR / 2, Math.min(containerWidth  - panWR / 2, rx));
            ry = Math.max(panHR / 2, Math.min(containerHeight - panHR / 2, ry));
            rightPan.style.width  = panWR + 'px';
            rightPan.style.height = panHR + 'px';
            rightPan.style.left   = (rx - panWR / 2) + 'px';
            rightPan.style.top    = (ry - panHR / 2) + 'px';
        }

        function renderAll() {
            renderWeights();
            const { l, r } = computeTotals();
            const diff  = l - r;
            const angle = Math.min(18, Math.max(-18, -diff * 0.8));
            updatePositions(angle);

            trayItems.forEach(function (item) {
                const t = item.dataset.type;
                item.classList.toggle('used', leftSet.has(t) || rightSet.has(t));
                item.classList.toggle('selected',
                    t === selectedType && !leftSet.has(t) && !rightSet.has(t));
            });
        }

        function addToSide(side) {
            if (!selectedType) {
                setMsg('Pick a weight from the tray first', 'err', 900);
                return;
            }
            if (leftSet.has(selectedType) || rightSet.has(selectedType)) {
                setMsg('That weight is already on the scale', 'err', 1000);
                return;
            }
            if (side === 'left') leftSet.add(selectedType);
            else                 rightSet.add(selectedType);

            selectedType = null;
            renderAll();

            const pan = (side === 'left') ? leftPan : rightPan;
            pan.classList.add('bounce');
            setTimeout(function () { pan.classList.remove('bounce'); }, 200);

            setMsg('');
        }

        function resetAll() {
            leftSet.clear();
            rightSet.clear();
            selectedType = null;

            DIALS.forEach(function (d, i) {
                d.value = 0;
                dialNums[i].textContent = dialDisplay(i);
                dialEls[i].classList.remove('solved', 'pop');
            });
            updateDialLabels();

            renderAll();
            setMsg('');
            updateDrawerGlow();
        }

        trayItems.forEach(function (item) {
            item.addEventListener('click', function () {
                const t = item.dataset.type;
                if (leftSet.has(t) || rightSet.has(t)) {
                    setMsg('That weight is already on the scale', 'err', 900);
                    return;
                }
                selectedType = (selectedType === t) ? null : t;
                renderAll();
                if (selectedType) setMsg('Selected ' + getChar(selectedType) + ' — now tap a pan', null, 1100);
                else              setMsg('', null, 0);
            });
        });

        leftPan.addEventListener('click',  function () { addToSide('left');  });
        rightPan.addEventListener('click', function () { addToSide('right'); });
        resetBtn.addEventListener('click', resetAll);

        document.getElementById('scaleBack').addEventListener('click', function () {
            showScreen('room');
        });

        checkBtn.addEventListener('click', function () {
            if (isCodeCorrect()) {
                setMsg('✅ Solved — the code is right!', 'ok');
                dialEls.forEach(function (el) { el.classList.add('solved'); });
            } else {
                setMsg('❌ Not quite — keep testing the pans.', 'err', 1800);
                dialEls.forEach(function (el) { el.classList.remove('solved'); });
            }
        });

        drawerClose.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!isCodeCorrect()) {
                setMsg('🔒 Set the correct code on the dials first', 'err', 1400);
                return;
            }
            drawer.classList.remove('can-open');
            drawer.classList.add('is-open');
        });

        drawerLetter.addEventListener('click', function (e) {
            e.stopPropagation();
            drawer.classList.add('letter-open');
        });

        function init() {
            fitColumn();
            renderAll();
            updateDrawerGlow();
        }

        (function preloadColumn() {
            const img = new Image();
            img.onload = function () {
                if (img.naturalWidth && img.naturalHeight) {
                    columnAspect = img.naturalWidth / img.naturalHeight;
                }
                init();
            };
            img.onerror = function () { init(); };
            img.src = 'column.png';
        })();

        buildDials();

        window.addEventListener('load', init);
        window.addEventListener('resize', function () {
            if (!document.getElementById('screenScale').hidden) init();
        });

        window.__scaleOnShow = function () {
            fitColumn();
            renderAll();
            updateDrawerGlow();
        };

        setTimeout(init, 100);
    })();

    /* =========================================================
       BOOT
       ========================================================= */
    showScreen('room');

    function markReady() { document.body.classList.add('ready'); }
    window.addEventListener('load', markReady);
    if (document.readyState === 'complete') markReady();

})();
</script>
</body>
</html>
