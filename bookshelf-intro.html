<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approaching the Vault — Whitby Case</title>
<link rel="preload" as="video" href="vaultvid1.mp4">
<link rel="preload" as="image" href="vaultentrance.jpg">
<link rel="preload" as="image" href="bookcaselink.png">

<style>
  /* ============================================================
     👇 POSITION & SCALE CONTROLS 👇
     ============================================================
     Background (vaultentrance.jpg):
       --bg-x      left/right  (0 = left, 50 = centre, 100 = right)
       --bg-y      up/down     (0 = top, 50 = centre, 100 = bottom)
       --bg-scale  1.0 = normal, 1.5 = bigger, 0.7 = smaller

     Bookcase link (bookcaselink.png):
       --link-x / --link-y   where on the picture it sits
       --link-w              width as % of the screen
       --link-scale          extra size multiplier
     ============================================================ */
  :root {
    --bg-x: 50;
    --bg-y: 50;
    --bg-scale: 1.0;

    --link-x: 12;
    --link-y: 54;
    --link-w: 40;
    --link-scale: 0.70;

    --gold: #eace9f;
  }
  /* ============================================================ */

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    overflow: hidden;
    background: #0a0705;
    font-family: 'Courier New', monospace;
    color: #ece3d0;
    -webkit-tap-highlight-color: transparent;
  }
  body { opacity: 0; transition: opacity .4s ease; }
  body.ready { opacity: 1; }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #0a0705;
  }

  /* ── Fullscreen video on top ── */
  .intro-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    z-index: 10;
    opacity: 1;
    transition: opacity .5s ease;
    cursor: pointer;
  }
  .intro-video.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ── Still image behind the video ── */
  .entrance-layer {
    position: absolute;
    inset: 0;
    z-index: 5;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .entrance-layer.visible {
    opacity: 1;
  }

  .entrance-img {
    position: absolute;
    left: calc(var(--bg-x) * 1%);
    top:  calc(var(--bg-y) * 1%);
    transform: translate(-50%, -50%) scale(var(--bg-scale));
    transform-origin: center center;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ── Clickable bookshelf ── */
  .bookcase-link {
    position: absolute;
    left: calc(var(--link-x) * 1%);
    top:  calc(var(--link-y) * 1%);
    width: calc(var(--link-w) * 1%);
    height: auto;
    transform: translate(-50%, -50%) scale(var(--link-scale));
    transform-origin: center center;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
    z-index: 20;
    display: none;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.5));
    transition: filter .22s ease, transform .22s ease;
  }
  .bookcase-link.visible { display: block; }
  .bookcase-link:hover {
    filter: brightness(1.15) drop-shadow(0 0 20px rgba(255,224,160,.9));
  }
  .bookcase-link:active {
    filter: brightness(1.25) drop-shadow(0 0 30px rgba(255,224,160,1));
  }

  /* ── Skip button ── */
  .skip-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 10px 22px;
    background: rgba(20, 15, 8, 0.85);
    border: 1px solid #8a6e42;
    border-radius: 40px;
    color: var(--gold);
    font-family: 'Courier New', monospace;
    font-size: .72rem;
    font-weight: bold;
    letter-spacing: .22em;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 30;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background .18s ease, border-color .18s ease, opacity .3s ease;
  }
  .skip-btn:hover { background: rgba(90,60,20,.95); border-color: #d8ab6a; }
  .skip-btn.hidden { opacity: 0; pointer-events: none; }

  /* ── Back buttons ── */
  .back-to-desk,
  .back-to-puzzles {
    position: fixed;
    top: 14px;
    padding: 9px 20px;
    border-radius: 40px;
    font-family: 'Courier New', monospace;
    font-size: .72rem;
    font-weight: bold;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-decoration: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 9999;
    transition: background .18s ease, border-color .18s ease;
  }
  .back-to-puzzles {
    left: 14px;
    background: rgba(15,12,8,.85);
    border: 1px solid #8a6e42;
    color: var(--gold);
  }
  .back-to-puzzles:hover { background: rgba(60,40,15,.95); border-color: #d8ab6a; }
  .back-to-desk {
    right: 14px;
    background: rgba(15,42,63,.85);
    border: 1px solid rgba(182,139,92,.4);
    color: var(--gold);
  }
  .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }

  @media (max-width: 640px) {
    .back-to-desk, .back-to-puzzles { font-size: .68rem; padding: 8px 14px; letter-spacing: .18em; }
    .skip-btn { font-size: .68rem; padding: 8px 16px; bottom: 14px; right: 14px; }
  }
</style>
</head>
<body>

<a class="back-to-puzzles" href="puzzles.html">← Puzzles</a>
<a class="back-to-desk" href="desk.html">← Desk</a>

<div class="stage">

  <!-- Still image (sits behind the video, only visible after the video ends) -->
  <div class="entrance-layer" id="entranceLayer">
    <img class="entrance-img" src="vaultentrance.jpg" alt="Vault entrance" draggable="false" />
    <img class="bookcase-link" id="bookcaseLink" src="bookcaselink.png"
         alt="Open the bookshelf" draggable="false" />
  </div>

  <!-- Fullscreen video on top -->
  <video class="intro-video" id="introVideo" src="vaultvid1.mp4"
         playsinline preload="auto"></video>

  <button class="skip-btn" id="skipBtn">Skip ▶</button>

</div>

<script>
(function () {
  'use strict';

  var introVideo    = document.getElementById('introVideo');
  var entranceLayer = document.getElementById('entranceLayer');
  var bookcaseLink  = document.getElementById('bookcaseLink');
  var skipBtn       = document.getElementById('skipBtn');

  var finished = false;

  /* ── Video ends → fade to the still image and reveal the link ── */
  function showEntrance() {
    if (finished) return;
    finished = true;

    introVideo.classList.add('hidden');
    try { introVideo.pause(); } catch (e) {}

    entranceLayer.classList.add('visible');

    /* Show the clickable bookshelf just after the fade begins */
    setTimeout(function () {
      bookcaseLink.classList.add('visible');
    }, 300);

    skipBtn.classList.add('hidden');
  }

  introVideo.addEventListener('ended', showEntrance);

  skipBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    showEntrance();
  });

  /* Tapping the video also skips to the still image */
  introVideo.addEventListener('click', function () {
    showEntrance();
  });

  /* ── Bookcase click → bookshelf puzzle ── */
  bookcaseLink.addEventListener('click', function () {
    bookcaseLink.style.filter = 'brightness(1.4) drop-shadow(0 0 26px rgba(255,236,190,1))';
    document.body.style.transition = 'opacity .22s ease';
    document.body.style.opacity = '0';
    setTimeout(function () {
      window.location.href = 'bookshelf.html';
    }, 200);
  });

  /* ── Start the video ── */
  var playPromise = introVideo.play();
  if (playPromise && playPromise.catch) {
    playPromise.catch(function () {
      /* Retry muted if the browser blocks autoplay with sound */
      introVideo.muted = true;
      introVideo.play().catch(function () {
        /* If even muted autoplay is blocked, just show the still image */
        showEntrance();
      });
    });
  }
})();

/* Fade in when ready */
window.addEventListener('load', function () { document.body.classList.add('ready'); });
if (document.readyState === 'complete') { document.body.classList.add('ready'); }
</script>
</body>
</html>
