<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image Layout</title>
<link rel="preload" as="image" href="Dback.jpg">
<link rel="preload" as="image" href="cryptomemo.jpg">
<link rel="preload" as="image" href="archivelog.jpg">
<link rel="preload" as="image" href="sclarkeevidence.jpg">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    opacity: 0;
    transition: opacity .4s ease;
  }
  body.ready { opacity: 1; }

  .stage {
    --ar: 1.7778;
    position: relative;
    width: min(100vw, calc(100vh * var(--ar)));
    aspect-ratio: var(--ar);
    background: #222 center / 100% 100% no-repeat;
    overflow: hidden;
  }

  .layer {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    will-change: transform;
  }

  .item {
    position: absolute;
    left: calc(var(--x) * 1%);
    top:  calc(var(--y) * 1%);
    width: calc(var(--w) * 1%);
    height: auto;
    transform: translate(-50%, -50%)
               rotate(calc(var(--r) * 1deg))
               scale(var(--s));
    transform-origin: 50% 50%;
    z-index: var(--z);
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    transition: filter .22s ease, opacity .4s ease;
  }

  .item.clickable {
    pointer-events: auto;
    cursor: pointer;
  }
  .item.clickable:hover {
    filter: brightness(1.15) drop-shadow(0 0 14px rgba(255, 224, 160, .7));
  }
  .item.clickable:active {
    filter: brightness(1.25) drop-shadow(0 0 22px rgba(255, 224, 160, .9));
  }

  .item.active-step {
    filter: drop-shadow(0 0 22px rgba(255,210,110,0.95)) brightness(1.08);
  }

  .desk-item {
    position: absolute;
    left: calc(var(--x) * 1%);
    top:  calc(var(--y) * 1%);
    width: calc(var(--w) * 1%);
    height: auto;
    transform: translate(-50%, -50%) scale(var(--s));
    transform-origin: 50% 50%;
    z-index: var(--z, 5);
    pointer-events: auto;
    cursor: pointer;
    opacity: 0;
    transition: opacity .6s ease, filter .22s ease;
    user-select: none;
    -webkit-user-drag: none;
  }
  .desk-item.visible { opacity: 1; }
  .desk-item:hover {
    filter: brightness(1.1) drop-shadow(0 0 18px rgba(255, 224, 160, .7));
  }

  .item.hidden-item {
    opacity: 0;
    pointer-events: auto;
    cursor: pointer;
  }
  .item.hidden-item.revealed { opacity: 1; }

  .popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 99998;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .popup-overlay.active { display: flex; opacity: 1; }

  .popup-card {
    max-width: 440px;
    width: 100%;
    padding: 34px 28px 26px;
    background: linear-gradient(160deg, #1e3040 0%, #0f1d29 100%);
    border: 2px solid #b68b5c;
    border-radius: 16px;
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.8),
      0 0 40px rgba(240, 180, 41, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    text-align: center;
    transform: translateY(14px) scale(0.96);
    transition: transform .35s cubic-bezier(0.2, 0.9, 0.3, 1.05);
  }
  .popup-overlay.active .popup-card { transform: translateY(0) scale(1); }

  .popup-icon {
    font-size: 2.4rem;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 14px rgba(240, 180, 41, 0.55));
  }
  .popup-card h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #eace9f;
    margin: 0 0 16px;
  }
  .popup-card p {
    font-size: 0.95rem;
    line-height: 1.65;
    color: #cdba92;
    margin: 0 0 24px;
    letter-spacing: 0.01em;
  }
  .popup-continue-btn {
    display: inline-block;
    padding: 14px 40px;
    background: linear-gradient(180deg, #d99a1a, #a37812);
    border: 1px solid #ffd066;
    border-radius: 12px;
    color: #1a1006;
    font-family: 'Courier New', monospace;
    font-size: 0.86rem;
    font-weight: bold;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow:
      0 8px 22px rgba(240, 180, 41, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
    transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    white-space: nowrap;
  }
  .popup-continue-btn:hover { background: linear-gradient(180deg, #ffd066, #d99a1a); }
  .popup-continue-btn:active { transform: translateY(2px); box-shadow: 0 3px 12px rgba(240, 180, 41, 0.35); }

  .memo-overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .memo-overlay.active { display: flex; }

  .memo-img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    opacity: 0;
    transition: opacity .45s ease;
  }
  .memo-overlay.active .memo-img { opacity: 1; }

  .memo-desk-btn {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 42px;
    background: linear-gradient(180deg, #d99a1a, #a37812);
    border: 1px solid #ffd066;
    border-radius: 12px;
    color: #1a1006;
    font-family: 'Courier New', monospace;
    font-size: 0.88rem;
    font-weight: bold;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow:
      0 8px 22px rgba(0, 0, 0, 0.6),
      0 0 24px rgba(240, 180, 41, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
    transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease,
                opacity .45s ease;
    z-index: 2;
    white-space: nowrap;
    opacity: 0;
  }
  .memo-overlay.active .memo-desk-btn { opacity: 1; }
  .memo-desk-btn:hover { background: linear-gradient(180deg, #ffd066, #d99a1a); }
  .memo-desk-btn:active { transform: translateX(-50%) translateY(2px); box-shadow: 0 3px 12px rgba(240, 180, 41, 0.4); }

  @media (max-width: 480px) {
    .popup-card { padding: 26px 22px 20px; }
    .popup-card h2 { font-size: 0.95rem; }
    .popup-card p { font-size: 0.86rem; }
    .popup-continue-btn { padding: 12px 30px; font-size: 0.78rem; }
    .memo-desk-btn { padding: 12px 30px; font-size: 0.76rem; letter-spacing: 0.16em; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="layer" id="layer"></div>
  </div>

  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-card">
      <div class="popup-icon" id="popupIcon">📋</div>
      <h2 id="popupTitle">New Case</h2>
      <p id="popupMessage"></p>
      <button class="popup-continue-btn" id="popupContinueBtn">Continue →</button>
    </div>
  </div>

  <div class="memo-overlay" id="memoOverlay">
    <img class="memo-img" id="memoImg" src="" alt="" draggable="false">
    <button class="memo-desk-btn" id="memoDeskBtn">← Desk</button>
  </div>

<script>
/* ============================================================
   ★★★ STORY STEPS ★★★
   ============================================================ */
const STEPS = [
  { type:'popup', icon:'📋', title:'New Case',
    message:'A Cryptogram puzzle has been found at the Mad Hatter Jewellery Store that has just been burgled. A police officer has also discovered a strange puzzle hidden at the scene. It appears to have been deliberately left behind by the criminals.' },

  { type:'puzzle', file:'p1.html', flag:'whitby_p1_solved' },

  { type:'popup', icon:'🔎', title:'Discovery on the Embankment',
    message:'Discovery of a Cryptogram digit on the embankment, as well as some muddy footprints and a jacket. A call has just come in — another small jewellery store called "Yasmin Jewellery Store" nearby has just been burgled. A note addressed to \u2018Detective\u2019 was discovered at the scene.' },

  { type:'puzzle', file:'braggers.html', flag:'whitby_braggers_solved' },

  { type:'popup', icon:'📋', title:'Second Discovery',
    message:'An archive log and another strange puzzle have been found at Walker\u2019s Jewellery Store. Let\u2019s bring in Neil Down for questioning before going any further.' },

  { type:'interview', deskItem:'archivelog.jpg' },

  { type:'puzzle', file:'p2.html', flag:'whitby_p2_solved' },

  { type:'popup', icon:'⛪', title:'Get to the Cathedral',
    message:'I need you to get down to the Cathedral ASAP. A discovery of another Cryptogram digit and a strange box has been made.' },

  { type:'puzzle', file:'scale.html', flag:'whitby_scale_solved' },

  { type:'popup', icon:'👥', title:'New Suspects',
    message:'Two additional suspects have been brought in for questioning.' },

  { type:'interview' },

  { type:'popup', icon:'📋', title:'Another Puzzle',
    message:'Another puzzle has been discovered by a police officer at the Cathedral.' },

  { type:'puzzle', file:'p3.html', flag:'whitby_p3_solved' },

  { type:'popup', icon:'🏛️', title:'Lincoln Museum',
    message:'Police officers have rushed to the museum. Fortunately, there has been no burglary, but a notepad and Cryptogram Digit 3 have been discovered.' },

  { type:'image', src:'sclarkeevidence.jpg', title:'Evidence', deskItem:'sclarkeevidence.jpg' },

  { type:'popup', icon:'☕', title:'Coffee',
    message:'You need some coffee. Go get a brew.' },

  { type:'puzzle', file:'coffee.html', flag:'whitby_coffee_solved' },

  { type:'puzzle', file:'hanoi.html', flag:'whitby_hanoi_solved' },

  { type:'popup', icon:'💾', title:'USB Stick',
    message:'What\u2019s this? A USB stick? Who\u2019s left that here... one of the suspects?' },

  { type:'interview' },

  { type:'popup', icon:'📋', title:'Another Puzzle',
    message:'Another cryptic puzzle has been found, but let\u2019s see if any of the suspects want to start talking.' },

  { type:'puzzle', file:'p4.html', flag:'whitby_p4_solved' },

  { type:'popup', icon:'🏟️', title:'Lincoln Stadium',
    message:'A police officer has found another Cryptogram digit. The changing-room lockers have been tampered with. We\u2019re going to need you down here.' },

  { type:'puzzle', file:'locker.html', flag:'whitby_locker_solved' },

  { type:'popup', icon:'📋', title:'More Evidence',
    message:'More evidence. The suspects are being cornered now.' },

  { type:'interview' },

  { type:'popup', icon:'📋', title:'Another Puzzle',
    message:'A cryptic puzzle has been discovered by a police officer outside Lincoln Stadium.' },

  { type:'puzzle', file:'p5.html', flag:'whitby_p5_solved' },

  { type:'popup', icon:'🏰', title:'Lincoln Castle',
    message:'Officers rush to the Castle and find a Cryptogram digit inside one of the cannons. Staff at the Castle have also reported that a mysterious person was seen inside the vault.' },

  { type:'puzzle', file:'bookshelf.html', flag:'whitby_bookshelf_solved' },

  { type:'popup', icon:'📹', title:'CCTV',
    message:'What\u2019s her explanation for this? And another cryptic puzzle... hopefully the missing piece to our mystery. Let\u2019s find out what she has to say first.' },

  { type:'interview' },

  { type:'puzzle', file:'p6.html', flag:'whitby_p6_solved' },

  { type:'popup', icon:'📋', title:'Last Digit',
    message:'An officer has investigated the Guildhall and discovered another Cryptogram digit. All six Cryptogram digits have now been discovered. Can the puzzle finally be solved?' },

  { type:'puzzle', file:'cryptogram.html', flag:'whitby_cryptogram_solved' },

  { type:'popup', icon:'🗝️', title:'The Vault Location',
    message:'The final location! The treasure! It\u2019s obvious now! The thief must be...' },

  { type:'accusation' },

  { type:'popup', icon:'🏆', title:'Case Closed',
    message:'Congratulations! You\u2019ve found the thief. Let\u2019s see if we can get the treasure back. Let\u2019s get to that vault.' },

  { type:'puzzle', file:'vault.html', flag:'whitby_vault_solved' },

  { type:'complete' }
];

/* ============================================================
   DESK ITEMS — dynamic evidence (x, y, w as %)
   ============================================================ */
const DESK_ITEMS = {
  'archivelog.jpg':      { x: 15, y: 42, w: 14, s: 1, z: 20 },
  'sclarkeevidence.jpg': { x: 85, y: 42, w: 14, s: 1, z: 20 }
};

/* ============================================================
   IMAGE LAYOUT — permanent desk items
   ============================================================ */
const CONFIG = {
  background: 'Dback.jpg',
  global: { x: 0, y: 0, scale: 1 },
  images: [
    { id: 'D1',  file: 'D1.png',  x: 23,   y: 93.5, w: 14, z: 1,  scale: 1.2,  rotation: 0, role: 'interview', link: 'interrogation.html' },
    { id: 'D2',  file: 'D2.png',  x: 9.4,  y: 80,   w: 14, z: 4,  scale: 1.5,  rotation: 0 },
    { id: 'D3',  file: 'D3.png',  x: 55,   y: 74,   w: 14, z: 3,  scale: 3.0,  rotation: 0 },
    { id: 'D4',  file: 'D4.png',  x: 12.5, y: 62,   w: 14, z: 2,  scale: 2.1,  rotation: 0 },
    { id: 'D5',  file: 'D5.png',  x: 52,   y: 82,   w: 14, z: 5,  scale: 4.2,  rotation: 0 },
    { id: 'D6',  file: 'D6.png',  x: 82.5, y: 21.5, w: 14, z: 6,  scale: 2.45, rotation: 0 },
    { id: 'D7',  file: 'D7.png',  x: 51,   y: 53.1, w: 14, z: 7,  scale: 3.36, rotation: 0, role: 'puzzle' },
    { id: 'D8',  file: 'D8.png',  x: 88,   y: 63,   w: 14, z: 8,  scale: 1.8,  rotation: 0, link: 'index.html' },
    { id: 'D9',  file: 'D9.png',  x: 50.5, y: 28,   w: 14, z: 9,  scale: 1.8,  rotation: 0 },
    { id: 'D10', file: 'D10.png', x: 84,   y: 95,   w: 13, z: 10, scale: 2.3,  rotation: 0 },

    { file: 'emptycup.png', x: 93.31, y: 84.33, w: 14, z: 11, scale: 0.965, rotation: 0, hidden: true },
    { file: 'mapboard.png', x: 17,    y: 28,   w: 14, z: 12, scale: 2.4,  rotation: 0 },
    { file: 'fullcup.png',  x: 93.31, y: 84.33, w: 14, z: 13, scale: 0.965, rotation: 0, hidden: true }
  ]
};

/* ============================================================
   BOOT
   ============================================================ */
const STEP_KEY = 'whitby_step';
const INTERVIEW_DONE_KEY = 'whitby_interview_complete';
const ACCUSE_CORRECT_KEY = 'whitby_accusation_correct';

const stage = document.querySelector('.stage');
const layer = document.getElementById('layer');
const popupOverlay = document.getElementById('popupOverlay');
const popupIcon    = document.getElementById('popupIcon');
const popupTitle   = document.getElementById('popupTitle');
const popupMessage = document.getElementById('popupMessage');
const popupContinue= document.getElementById('popupContinueBtn');
const memoOverlay  = document.getElementById('memoOverlay');
const memoImg      = document.getElementById('memoImg');
const memoDeskBtn  = document.getElementById('memoDeskBtn');

stage.style.backgroundImage = `url("${CONFIG.background}")`;

const bgProbe = new Image();
bgProbe.onload = () => {
  const ar = bgProbe.naturalWidth / bgProbe.naturalHeight;
  stage.style.setProperty('--ar', ar);
};
bgProbe.src = CONFIG.background;

const itemEls = {};
CONFIG.images.forEach(cfg => {
  const img = document.createElement('img');
  img.className = 'item';
  img.src = cfg.file;
  img.draggable = false;

  img.style.setProperty('--x', cfg.x);
  img.style.setProperty('--y', cfg.y);
  img.style.setProperty('--w', cfg.w);
  img.style.setProperty('--z', cfg.z ?? 1);
  img.style.setProperty('--s', cfg.scale ?? 1);
  img.style.setProperty('--r', cfg.rotation ?? 0);

  if (cfg.link) { img.dataset.link = cfg.link; img.classList.add('clickable'); }
  if (cfg.hidden) img.classList.add('hidden-item');
  if (cfg.id) itemEls[cfg.id] = img;

  layer.appendChild(img);
});

(function applyGlobal() {
  const g = CONFIG.global;
  layer.style.transform = `translate(${g.x}%, ${g.y}%) scale(${g.scale})`;
})();

function hasFlag(key) {
  try { return localStorage.getItem(key) === '1'; }
  catch (e) { return false; }
}
function setFlag(key) { try { localStorage.setItem(key, '1'); } catch (e) {} }
function clearFlag(key) { try { localStorage.removeItem(key); } catch (e) {} }
function getStep() {
  const n = parseInt(localStorage.getItem(STEP_KEY) || '1', 10);
  return Math.min(Math.max(n, 1), STEPS.length);
}
function setStep(n) {
  try { localStorage.setItem(STEP_KEY, String(Math.min(Math.max(n, 1), STEPS.length))); } catch (e) {}
}
function stepCfg(n) { return STEPS[n - 1] || null; }

const addedDeskItems = new Set();
function addDeskItem(src) {
  if (addedDeskItems.has(src)) return;
  addedDeskItems.add(src);

  const pos = DESK_ITEMS[src];
  if (!pos) return;

  const img = document.createElement('img');
  img.className = 'desk-item';
  img.src = src;
  img.draggable = false;
  img.alt = src;
  img.style.setProperty('--x', pos.x);
  img.style.setProperty('--y', pos.y);
  img.style.setProperty('--w', pos.w);
  img.style.setProperty('--s', pos.s ?? 1);
  img.style.setProperty('--z', pos.z ?? 20);

  img.addEventListener('click', function () {
    memoImg.src = src;
    memoImg.alt = src;
    memoOverlay.classList.add('active');
    memoOverlay.dataset.advanceStep = '';
  });

  layer.appendChild(img);
  requestAnimationFrame(() => img.classList.add('visible'));
}

function revealDeskItemsForStep(n) {
  for (let i = 1; i <= n; i++) {
    const cfg = stepCfg(i);
    if (!cfg) continue;
    if (cfg.deskItem) addDeskItem(cfg.deskItem);
    if (cfg.type === 'image' && cfg.src) addDeskItem(cfg.src);
  }
}

function advanceCompleted() {
  let n = getStep();
  let safety = 0;
  while (n <= STEPS.length && safety++ < STEPS.length + 2) {
    const cfg = stepCfg(n);
    if (!cfg) break;

    if (cfg.type === 'puzzle' && cfg.flag && hasFlag(cfg.flag)) { n++; continue; }
    if (cfg.type === 'interview' && hasFlag(INTERVIEW_DONE_KEY)) { clearFlag(INTERVIEW_DONE_KEY); n++; continue; }
    if (cfg.type === 'accusation' && hasFlag(ACCUSE_CORRECT_KEY)) { clearFlag(ACCUSE_CORRECT_KEY); n++; continue; }
    break;
  }
  setStep(n);
}

function renderCurrentStep() {
  const n = getStep();
  const cfg = stepCfg(n);
  if (!cfg) return;

  console.log('[desk] Step ' + n + '/' + STEPS.length, cfg.type);

  /* ---------- D1 — interview (always clickable) ---------- */
  const d1 = itemEls['D1'];
  if (d1) {
    d1.classList.remove('locked');
    d1.classList.add('clickable');
    d1.dataset.link = 'interrogation.html';
    if (cfg.type === 'interview') d1.classList.add('active-step');
    else d1.classList.remove('active-step');
  }

  /* ---------- D7 — puzzle (step-gated) ---------- */
  const d7 = itemEls['D7'];
  if (d7) {
    if (cfg.type === 'puzzle') {
      d7.classList.remove('locked');
      d7.classList.add('clickable', 'active-step');
      d7.dataset.link = cfg.file;
    } else {
      d7.classList.remove('clickable', 'active-step');
      d7.dataset.link = '';
    }
  }

  /* ---------- D8 — always opens the main menu ---------- */
  const d8 = itemEls['D8'];
  if (d8) {
    d8.classList.remove('locked');
    d8.classList.add('clickable');
    d8.dataset.link = 'index.html';
  }

  revealDeskItemsForStep(n);

  /* ---------- Overlay per step type ---------- */
  if (cfg.type === 'popup') {
    showPopup(cfg);
  } else if (cfg.type === 'image') {
    openMemo(cfg.src, cfg.title);
    memoOverlay.dataset.advanceStep = 'yes';
  } else if (cfg.type === 'accusation') {
    if (hasFlag('whitby_cryptogram_solved')) {
      showAccusationPopup();
    } else {
      console.warn('[desk] Accusation step without prerequisite — rolling back to step 35');
      setStep(35);
      advanceCompleted();
      renderCurrentStep();
      return;
    }
  } else if (cfg.type === 'complete') {
    showCompletePopup();
  }
}

function showPopup(cfg) {
  popupIcon.textContent    = cfg.icon    || '📋';
  popupTitle.textContent   = cfg.title   || '';
  popupMessage.textContent = cfg.message || '';
  popupContinue.textContent = 'Continue →';
  popupContinue.dataset.action = 'next';
  popupOverlay.classList.add('active');
}
function showAccusationPopup() {
  popupIcon.textContent    = '⚖️';
  popupTitle.textContent   = 'Present Your Accusation';
  popupMessage.textContent = 'You have all the evidence. It\u2019s time to name the thief.';
  popupContinue.textContent = 'Accuse →';
  popupContinue.dataset.action = 'accuse';
  popupOverlay.classList.add('active');
}
function showCompletePopup() {
  popupIcon.textContent    = '🏆';
  popupTitle.textContent   = 'Case Closed';
  popupMessage.textContent = 'You solved the case. Well done, Detective.';
  popupContinue.textContent = 'Return to Menu';
  popupContinue.dataset.action = 'menu';
  popupOverlay.classList.add('active');
}
function hidePopup() { popupOverlay.classList.remove('active'); }

popupContinue.addEventListener('click', function () {
  const action = popupContinue.dataset.action;
  if (action === 'accuse') {
    hidePopup();
    document.body.style.transition = 'opacity .22s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = 'accusation.html'; }, 220);
    return;
  }
  if (action === 'menu') { window.location.href = 'index.html'; return; }
  hidePopup();
  setStep(getStep() + 1);
  advanceCompleted();
  renderCurrentStep();
});

function openMemo(src, title) {
  memoImg.src = src;
  memoImg.alt = title || 'Evidence';
  memoOverlay.classList.add('active');
}
function closeMemo() { memoOverlay.classList.remove('active'); }

memoDeskBtn.addEventListener('click', function () {
  const advance = memoOverlay.dataset.advanceStep === 'yes';
  closeMemo();
  if (advance) {
    memoOverlay.dataset.advanceStep = '';
    setStep(getStep() + 1);
    advanceCompleted();
    renderCurrentStep();
  }
});

function openLink(el) {
  const url = el && el.dataset.link;
  if (!url) return;
  el.style.filter = 'brightness(1.4) drop-shadow(0 0 26px rgba(255,236,190,1))';
  document.body.style.transition = 'opacity .22s ease';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = url; }, 220);
}

layer.addEventListener('click', (e) => {
  const el = e.target.closest('.item');
  if (!el) return;
  if (el.classList.contains('hidden-item') && !el.classList.contains('revealed')) {
    el.classList.add('revealed');
    return;
  }
  if (el.dataset.link) openLink(el);
});

layer.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('.item');
  if (!el) return;
  if (el.classList.contains('hidden-item') && !el.classList.contains('revealed')) {
    e.preventDefault(); el.classList.add('revealed'); return;
  }
  if (el.dataset.link) { e.preventDefault(); openLink(el); }
});

(function setupDebugCups() {
  var fullcup  = layer.querySelector('img[src*="fullcup"]');
  var emptycup = layer.querySelector('img[src*="emptycup"]');
  if (!fullcup || !emptycup) return;

  var NEED = 5;
  var K_FULL  = 'debug_fullcup_clicks';
  var K_EMPTY = 'debug_emptycup_clicks';

  var ALL_FLAGS = [
    'whitby_p1_solved','whitby_p2_solved','whitby_p3_solved',
    'whitby_p4_solved','whitby_p5_solved','whitby_p6_solved',
    'whitby_p7_solved',
    'whitby_braggers_solved','whitby_scale_solved',
    'whitby_coffee_solved','whitby_hanoi_solved',
    'whitby_locker_solved','whitby_bookshelf_solved',
    'whitby_cryptogram_solved','whitby_vault_solved',
    'whitby_scalePartsUnlocked',
    'evidence_archiveLog','evidence_braggersNote',
    'evidence_lockerPhoto','evidence_cryptogram',
    'evidence_postit5','evidence_postit6','evidence_postit7',
    'ashworth_memo_seen'
  ];

  fullcup.classList.add('revealed');
  emptycup.classList.add('revealed');
  fullcup.style.zIndex  = 100;
  emptycup.style.zIndex = 99;

  var pill = document.createElement('div');
  pill.style.cssText =
    'position:fixed;top:10px;left:50%;transform:translateX(-50%);' +
    'background:rgba(0,0,0,0.88);color:#ffd066;border:1px solid #8a6e42;' +
    'padding:6px 16px;border-radius:8px;font-family:"Courier New",monospace;' +
    'font-size:13px;letter-spacing:0.08em;z-index:99999;pointer-events:none;' +
    'opacity:0;transition:opacity 0.22s;white-space:nowrap;';
  document.body.appendChild(pill);

  var t = null;
  function flash(msg) {
    pill.textContent = msg;
    pill.style.opacity = '1';
    clearTimeout(t);
    t = setTimeout(function () { pill.style.opacity = '0'; }, 1400);
  }

  function getCount(k) { return parseInt(localStorage.getItem(k) || '0', 10); }
  function setCount(k, n) { localStorage.setItem(k, String(n)); }

  function solveAll() {
    ALL_FLAGS.forEach(function (k) { try { localStorage.setItem(k, '1'); } catch (e) {} });
    setStep(1);
    setCount(K_FULL, 0);
    setCount(K_EMPTY, 0);
    flash('✅ Puzzles solved — reloading');
    setTimeout(function () { location.reload(); }, 1400);
  }

  fullcup.addEventListener('click', function (e) {
    e.stopPropagation();
    var c = getCount(K_FULL) + 1;
    setCount(K_FULL, c);
    flash('Full cup: ' + c + ' / ' + NEED);
    fullcup.style.zIndex  = 99;
    emptycup.style.zIndex = 100;
    if (c >= NEED && getCount(K_EMPTY) >= NEED) solveAll();
  });

  emptycup.addEventListener('click', function (e) {
    e.stopPropagation();
    var c = getCount(K_EMPTY) + 1;
    setCount(K_EMPTY, c);
    flash('Empty cup: ' + c + ' / ' + NEED);
    emptycup.style.zIndex = 99;
    fullcup.style.zIndex  = 100;
    if (c >= NEED && getCount(K_FULL) >= NEED) solveAll();
  });
})();

advanceCompleted();
renderCurrentStep();

window.addEventListener('load', function () { document.body.classList.add('ready'); });
if (document.readyState === 'complete') { document.body.classList.add('ready'); }
</script>
