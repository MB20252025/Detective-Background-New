<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map — Whitby Case</title>

<style>
  /* ============================================================
     👇 BASE MAP (map6.jpg) POSITION & SCALE 👇
     ============================================================ */
  :root {
    --map-x: 50;
    --map-y: 50;
    --map-scale: 1.0;
  }
  /* ============================================================ */

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0705;
    font-family: 'Courier New', monospace;
  }
  body {
    opacity: 0;
    transition: opacity .4s ease;
  }
  body.ready { opacity: 1; }

  /* ── Stage: container that holds the map + all overlays ── */
  .stage {
    position: fixed;
    left: calc(var(--map-x) * 1%);
    top:  calc(var(--map-y) * 1%);
    transform: translate(-50%, -50%) scale(var(--map-scale));
    transform-origin: center center;
    width: 96vw;
    max-width: 1400px;
    aspect-ratio: 1600 / 1000;
    z-index: 1;
  }

  .map-base {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.85),
                0 0 0 1px rgba(182,139,92,.25);
  }

  /* ── Clickable overlays on top of the map ──
     Invisible but still clickable — the player has to find each hotspot. */
  .map-item {
    position: absolute;
    left: calc(var(--x) * 1%);
    top:  calc(var(--y) * 1%);
    width: calc(var(--w) * 1%);
    height: auto;
    transform: translate(-50%, -50%)
               rotate(calc(var(--r) * 1deg))
               scale(var(--s));
    transform-origin: 50% 50%;
    z-index: var(--z);
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;

    /* ★ HIDDEN — invisible but still clickable */
    opacity: 0;
    transition: opacity .25s ease;
  }

  /* Tiny visual nudge on hover so the player knows they found something.
     Comment this whole block out if you'd rather the hotspot stay
     completely invisible even on hover. */
  .map-item:hover,
  .map-item:active {
    opacity: 0.35;
  }

  /* ── Big-image detail view ── */
  .detail-view {
    position: fixed;
    inset: 0;
    background: #0a0705;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
  }
  .detail-view.active {
    opacity: 1;
    pointer-events: auto;
  }
  .detail-view img {
    max-width: 96vw;
    max-height: 96vh;
    width: auto;
    height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.85),
                0 0 0 1px rgba(182,139,92,.25);
  }

  /* ── Back-to-detail button ── */
  .back-to-detail {
    position: fixed;
    top: 14px;
    left: 14px;
    padding: 9px 20px;
    background: rgba(60, 40, 15, 0.88);
    border: 1px solid #8a6e42;
    border-radius: 40px;
    color: #eace9f;
    font-family: 'Courier New', monospace;
    font-size: .72rem;
    font-weight: bold;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-decoration: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 600;
    cursor: pointer;
    display: none;
    transition: background .18s ease, border-color .18s ease;
  }
  .back-to-detail:hover { background: rgba(90, 60, 20, 0.95); border-color: #d8ab6a; }
  body.detail-active .back-to-detail { display: block; }

  /* ── Back-to-desk button ── */
  .back-to-desk {
    position: fixed;
    top: 14px;
    left: 14px;
    padding: 9px 20px;
    background: rgba(15, 42, 63, 0.85);
    border: 1px solid rgba(182, 139, 92, 0.4);
    border-radius: 40px;
    color: #eace9f;
    font-family: 'Courier New', monospace;
    font-size: .72rem;
    font-weight: bold;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-decoration: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 600;
    transition: background .18s ease, border-color .18s ease;
  }
  .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }
  body.detail-active .back-to-desk { display: none; }
</style>
</head>
<body>

  <a class="back-to-desk" href="index.html">← Desk</a>
  <button class="back-to-detail" id="backToMap">← Map</button>

  <div class="stage" id="stage">
    <img class="map-base" id="mapBase" src="map6.jpg" alt="Case map" draggable="false" />
  </div>

  <div class="detail-view" id="detailView">
    <img id="detailImage" src="" alt="" draggable="false" />
  </div>

<script>
/* ============================================================
   EDIT EVERYTHING HERE
   ============================================================ */
const CONFIG = {
  base: 'map6.jpg',

  items: [
    { file: 'map1.jpg',     big: 'bigmap1.jpg',     x: 38, y: 17, w: 8, z: 1, scale: 5.0, rotation: 0 },
    { file: 'map2.jpg',     big: 'bigmap2.jpg',     x: 0, y: 40, w: 8, z: 2, scale: 5.0, rotation: 0 },
    { file: 'map3.jpg',     big: 'bigmap3.jpg',     x: 20, y: 78, w: 8, z: 3, scale: 6.0, rotation: 0 },
    { file: 'map4.jpg',     big: 'bigmap4.jpg',     x: 65, y: 16, w: 8, z: 4, scale: 5.0, rotation: 0 },
    { file: 'map5.jpg',     big: 'bigmap5.jpg',     x: 96, y: 34, w: 8, z: 5, scale: 5.0, rotation: 0 },
    { file: 'receipt.png',  big: 'bigreceipt.png',  x: 90, y: 70, w: 8, z: 6, scale: 3.0, rotation: 0 },
    { file: 'boatpic.png',  big: 'bigboatpic.png',  x: 62, y: 60, w: 8, z: 7, scale: 4.0, rotation: 0 }
  ]
};
/* ========================= END OF CONFIG ==================== */


const stage       = document.getElementById('stage');
const mapBase     = document.getElementById('mapBase');
const detailView  = document.getElementById('detailView');
const detailImage = document.getElementById('detailImage');
const backToMap   = document.getElementById('backToMap');

mapBase.addEventListener('load', () => {
  stage.style.aspectRatio = mapBase.naturalWidth + ' / ' + mapBase.naturalHeight;
});

CONFIG.items.forEach(cfg => {
  const img = document.createElement('img');
  img.className = 'map-item';
  img.src = cfg.file;
  img.alt = cfg.big;
  img.draggable = false;

  img.style.setProperty('--x', cfg.x);
  img.style.setProperty('--y', cfg.y);
  img.style.setProperty('--w', cfg.w);
  img.style.setProperty('--z', cfg.z ?? 1);
  img.style.setProperty('--s', cfg.scale ?? 1);
  img.style.setProperty('--r', cfg.rotation ?? 0);

  img.addEventListener('click', () => openDetail(cfg.big));
  stage.appendChild(img);
});

function openDetail(bigSrc) {
  detailImage.src = bigSrc;
  detailView.classList.add('active');
  document.body.classList.add('detail-active');
}

function closeDetail() {
  detailView.classList.remove('active');
  document.body.classList.remove('detail-active');
  setTimeout(() => { if (!detailView.classList.contains('active')) detailImage.src = ''; }, 350);
}

backToMap.addEventListener('click', closeDetail);

detailView.addEventListener('click', (e) => {
  if (e.target === detailView || e.target === detailImage) closeDetail();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && detailView.classList.contains('active')) closeDetail();
});

window.addEventListener('load', function () { document.body.classList.add('ready'); });
if (document.readyState === 'complete') { document.body.classList.add('ready'); }
</script>
</body>
</html>
