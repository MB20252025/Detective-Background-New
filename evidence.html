<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evidence — Whitby Case</title>
<link rel="preload" as="image" href="bigevidence.jpg">

<style>
  /* ============================================================
     👇 EVIDENCE IMAGE POSITION & SCALE 👇
     ============================================================ */
  :root {
    --ev-x:     50;   /* 0 = left, 50 = centre, 100 = right */
    --ev-y:     50;   /* 0 = top,  50 = centre, 100 = bottom */
    --ev-scale: 1.0;  /* 1.0 = normal, 1.5 = bigger, 0.7 = smaller */
  }
  /* ============================================================ */

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0a0705;
    font-family: 'Courier New', monospace;
  }
  body { opacity: 0; transition: opacity .4s ease; }
  body.ready { opacity: 1; }

  .evidence-image {
    position: fixed;
    left: calc(var(--ev-x) * 1%);
    top:  calc(var(--ev-y) * 1%);
    transform: translate(-50%, -50%) scale(var(--ev-scale));
    transform-origin: center center;
    max-width: 96vw;
    max-height: 96vh;
    width: auto;
    height: auto;
    display: block;
    z-index: 1;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.85),
                0 0 0 1px rgba(182,139,92,.25);
  }

  .back-to-desk,
  .back-to-maps {
    position: fixed;
    top: 14px;
    padding: 9px 20px;
    border-radius: 40px;
    font-family: 'Courier New', monospace;
    font-size: .72rem;
    font-weight: bold;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-decoration: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 9999;
    transition: background .18s ease, border-color .18s ease;
  }
  .back-to-desk {
    left: 14px;
    background: rgba(15,42,63,.85);
    border: 1px solid rgba(182,139,92,.4);
    color: #eace9f;
  }
  .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }

  .back-to-maps {
    right: 14px;
    background: rgba(60,40,15,.85);
    border: 1px solid #8a6e42;
    color: #eace9f;
  }
  .back-to-maps:hover { background: rgba(90,60,20,.95); border-color: #d8ab6a; }
</style>
</head>
<body>

  <a class="back-to-desk" href="index.html">← Desk</a>
  <a class="back-to-maps" href="maps.html">← Maps</a>

  <img src="bigevidence.jpg" class="evidence-image" alt="Evidence" draggable="false" />

  <script>
    window.addEventListener('load', function () { document.body.classList.add('ready'); });
    if (document.readyState === 'complete') { document.body.classList.add('ready'); }
  </script>
</body>
</html>
