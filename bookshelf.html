        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        html,
        body {
            width: 100%;
            min-height: 100%;
            background-color: #2c1a12;
        }
        body {
            opacity: 0;
            transition: opacity .4s ease;
        }
        body.ready { opacity: 1; }

        #app {
            display: flex;
            width: 100%;
            min-height: 100vh;
            align-items: stretch;
            justify-content: center;
            background-color: #2c1a12;
        }
        .scene {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            height: auto;
            background-image: url('sbackground.jpg');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-color: #2c1a12;
            flex-shrink: 0;
        }
        .decor-container {
            display: none;
            flex: 1 1 0;
            overflow: hidden;
            background-color: #2c1a12;
            align-items: center;
            justify-content: center;
        }
        .decor-container img {
            height: 100%;
            width: auto;
            flex-shrink: 0;
        }
        .picture-item {
            position: absolute;
            pointer-events: none;
            transform-origin: top left;
            z-index: 5;
            opacity: 0.9;
        }
        .picture-item img {
            display: block;
            pointer-events: none;
            width: 100%;
            height: auto;
        }
        .book-item {
            position: absolute;
            pointer-events: auto;
            cursor: grab;
            transform-origin: top left;
            z-index: 10;
        }
        .book-item img {
            display: block;
            pointer-events: none;
        }
        .book-item.sortable-chosen {
            opacity: 0.7;
            outline: 2px solid #ffd700;
            z-index: 100;
        }
        .book-item.sortable-ghost {
            opacity: 0 !important;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            pointer-events: none !important;
            width: auto !important;
            height: auto !important;
            display: block !important;
            visibility: visible !important;
        }
        .box-item {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transform-origin: top left;
            z-index: 20;
            transition: left 0.2s, top 0.2s, transform 0.2s;
        }
        .box-item img {
            display: block;
            pointer-events: none;
        }
        .box-item.locked::after {
            content: '🔒';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(2);
            font-size: 40px;
            pointer-events: none;
            z-index: 30;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .photo-item {
            position: absolute;
            pointer-events: auto;
            transform-origin: top left;
            z-index: 100;
            display: none;
            cursor: pointer;
        }
        .photo-item img {
            display: block;
            pointer-events: none;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
        }
        .photo-item .close-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            font-size: 20px;
            line-height: 26px;
            text-align: center;
            cursor: pointer;
            pointer-events: auto;
            font-weight: bold;
            transition: 0.2s;
            z-index: 101;
        }
        .photo-item .close-btn:hover {
            background: #ff4444;
            transform: scale(1.1);
        }
        #smallfront,
        #smallstone,
        #smallmorse {
            z-index: 50;
            cursor: pointer;
            display: none;
        }
        #smallfront img,
        #smallstone img,
        #smallmorse img {
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }
        #frontphoto,
        #backphoto,
        #stonephoto,
        #morsephoto {
            z-index: 200;
            cursor: pointer;
        }
        @media (min-width: 1024px) {
            html,
            body {
                overflow: hidden;
                height: 100%;
            }
            #app {
                min-height: 0;
                height: 100vh;
                flex-direction: row;
            }
            .scene {
                max-width: 1300px;
                height: 100vh;
                min-height: 0;
                background-size: contain;
                background-position: center;
                flex: 1 1 0;
                width: 100%;
            }
            .decor-container {
                display: flex;
                flex: 1 1 0;
            }

            transition: background .18s ease, border-color .18s ease;
        }
        .back-to-desk:hover { background: #2a5a6a; border-color: #eace9f; }

</head>

        function checkPuzzle4() {
            const shelfBooks = booksData.filter(b => b.shelf === 3).sort((a, b) => a.order - b.order);
            if (shelfBooks.length !== 11) return false;

            function getColor(src) {
                if (src.includes('brown')) return 'brown';
                if (src.includes('red')) return 'red';
                if (src.includes('blue')) return 'blue';
                if (src.includes('green')) return 'green';
                if (src.includes('black')) return 'black';
                return null;
            }

            const colorSeq = shelfBooks.map(b => getColor(b.src));
            if (colorSeq.some(c => c === null)) return false;

            const groups = [];
            let curColor = colorSeq[0];
            let curCount = 1;
            for (let i = 1; i < colorSeq.length; i++) {
                if (colorSeq[i] === curColor) {
                    curCount++;
                } else {
                    groups.push({ color: curColor, count: curCount });
                    curColor = colorSeq[i];
                    curCount = 1;
                }
            }
            groups.push({ color: curColor, count: curCount });

            const expected = [
                { color: 'brown', count: 1 },
                { color: 'red', count: 2 },
                { color: 'blue', count: 3 },
                { color: 'green', count: 3 },
                { color: 'black', count: 2 }
            ];

            if (groups.length !== expected.length) return false;
            for (let i = 0; i < groups.length; i++) {
                if (groups[i].color !== expected[i].color) return false;
                if (groups[i].count !== expected[i].count) return false;
            }
            return true;
        }

            let i = 0;
            for (const src of order) {
                if (src === CORRECT_SEQUENCE_1[i]) { i++; if (i === CORRECT_SEQUENCE_1.length) return true; }
            }
            return false;
        }

            const shelfBooks = booksData.filter(b => b.shelf === 1).sort((a, b) => a.order - b.order);
            if (shelfBooks.length !== 11) return false;
            const word = shelfBooks.map(b => letterMap[b.src] || '').join('');
            return word === TARGET_WORD;

                back.style.display = 'block';
                front.style.display = 'none';
                largePhotoVisible = true;
            }
        }

        function hideLargePhotos() {
            document.getElementById('frontphoto').style.display = 'none';
            document.getElementById('backphoto').style.display = 'none';
            largePhotoVisible = false;
        }

        function toggleLargePhoto() {
            const front = document.getElementById('frontphoto');
            const back = document.getElementById('backphoto');
            if (front.style.display === 'block') showLargePhoto('back');
            else if (back.style.display === 'block') showLargePhoto('front');
        }

        function showStoneLarge() {
            const el = document.getElementById('stonephoto');
            if (el) el.style.display = 'block';
            stoneVisible = true;
        }

        function hideStoneLarge() {
            document.getElementById('stonephoto').style.display = 'none';
            stoneVisible = false;
        }

        function showMorseLarge() {
            const el = document.getElementById('morsephoto');
            if (el) el.style.display = 'block';
            morseVisible = true;
        }

        function hideMorseLarge() {
            document.getElementById('morsephoto').style.display = 'none';
            morseVisible = false;
        }

        function createPhotoElements() {
            const small = document.createElement('div');
            small.id = 'smallfront';
            small.className = 'photo-item';
            small.style.left = PHOTOS.small.x + 'px';
            small.style.top = PHOTOS.small.y + 'px';
            small.style.transform = `scale(${PHOTOS.small.scale})`;
            small.style.transformOrigin = 'top left';
            small.style.display = 'none';
            const smallImg = document.createElement('img');
            smallImg.src = PHOTOS.small.src;
            smallImg.alt = 'small front';
            smallImg.onerror = function() { this.style.backgroundColor = '#886644';
                this.width = 100;
                this.height = 100; };
            small.appendChild(smallImg);
            small.addEventListener('click', function(e) { e.stopPropagation();
                showLargePhoto('front'); });
            container.appendChild(small);

            const front = document.createElement('div');
            front.id = 'frontphoto';
            front.className = 'photo-item';
            front.style.left = PHOTOS.front.x + 'px';
            front.style.top = PHOTOS.front.y + 'px';
            front.style.transform = `scale(${PHOTOS.front.scale})`;
            front.style.transformOrigin = 'top left';
            front.style.display = 'none';
            const frontImg = document.createElement('img');
            frontImg.src = PHOTOS.front.src;
            frontImg.alt = 'front photo';
            frontImg.onerror = function() { this.style.backgroundColor = '#886644';
                this.width = 300;
                this.height = 400; };
            front.appendChild(frontImg);
            const closeFront = document.createElement('div');
            closeFront.className = 'close-btn';
            closeFront.textContent = '✕';
            closeFront.addEventListener('click', function(e) { e.stopPropagation();
                hideLargePhotos(); });
            front.appendChild(closeFront);
            front.addEventListener('click', function(e) { if (e.target === closeFront || closeFront.contains(e.target))
                    return;
                toggleLargePhoto(); });
            container.appendChild(front);

            const back = document.createElement('div');
            back.id = 'backphoto';
            back.className = 'photo-item';
            back.style.left = PHOTOS.back.x + 'px';
            back.style.top = PHOTOS.back.y + 'px';
            back.style.transform = `scale(${PHOTOS.back.scale})`;
            back.style.transformOrigin = 'top left';
            back.style.display = 'none';
            const backImg = document.createElement('img');
            backImg.src = PHOTOS.back.src;
            backImg.alt = 'back photo';
            backImg.onerror = function() { this.style.backgroundColor = '#886644';
                this.width = 300;
                this.height = 400; };
            back.appendChild(backImg);
            const closeBack = document.createElement('div');
            closeBack.className = 'close-btn';
            closeBack.textContent = '✕';
            closeBack.addEventListener('click', function(e) { e.stopPropagation();
                hideLargePhotos(); });
            back.appendChild(closeBack);
            back.addEventListener('click', function(e) { if (e.target === closeBack || closeBack.contains(e.target))
                    return;
                toggleLargePhoto(); });
            container.appendChild(back);

            const stoneSmall = document.createElement('div');
            stoneSmall.id = 'smallstone';
            stoneSmall.className = 'photo-item';
            stoneSmall.style.left = PHOTOS.stoneSmall.x + 'px';
            stoneSmall.style.top = PHOTOS.stoneSmall.y + 'px';
            stoneSmall.style.transform = `scale(${PHOTOS.stoneSmall.scale})`;
            stoneSmall.style.transformOrigin = 'top left';
            stoneSmall.style.display = 'none';
            const stoneSmallImg = document.createElement('img');
            stoneSmallImg.src = PHOTOS.stoneSmall.src;
            stoneSmallImg.alt = 'small stone';
            stoneSmallImg.onerror = function() { this.style.backgroundColor = '#886644';
                this.width = 80;
                this.height = 80; };
            stoneSmall.appendChild(stoneSmallImg);
            stoneSmall.addEventListener('click', function(e) { e.stopPropagation();
                showStoneLarge(); });
            container.appendChild(stoneSmall);

            const stoneLarge = document.createElement('div');
            stoneLarge.id = 'stonephoto';
            stoneLarge.className = 'photo-item';
            stoneLarge.style.left = PHOTOS.stoneLarge.x + 'px';
            stoneLarge.style.top = PHOTOS.stoneLarge.y + 'px';
            stoneLarge.style.transform = `scale(${PHOTOS.stoneLarge.scale})`;
            stoneLarge.style.transformOrigin = 'top left';
            stoneLarge.style.display = 'none';
            const stoneLargeImg = document.createElement('img');
            stoneLargeImg.src = PHOTOS.stoneLarge.src;
            stoneLargeImg.alt = 'stone';
            stoneLargeImg.onerror = function() { this.style.backgroundColor = '#886644';
                this.width = 300;
                this.height = 300; };
            stoneLarge.appendChild(stoneLargeImg);
            const closeStone = document.createElement('div');
            closeStone.className = 'close-btn';
            closeStone.textContent = '✕';
            closeStone.addEventListener('click', function(e) { e.stopPropagation();
                hideStoneLarge(); });
            stoneLarge.appendChild(closeStone);
            stoneLarge.addEventListener('click', function(e) { if (e.target === closeStone || closeStone.contains(e.target))
                    return; });
            container.appendChild(stoneLarge);

            const morseSmall = document.createElement('div');
            morseSmall.id = 'smallmorse';
            morseSmall.className = 'photo-item';
            morseSmall.style.left = PHOTOS.morseSmall.x + 'px';
            morseSmall.style.top = PHOTOS.morseSmall.y + 'px';
            morseSmall.style.transform = `scale(${PHOTOS.morseSmall.scale})`;
            morseSmall.style.transformOrigin = 'top left';
            morseSmall.style.display = 'none';
            const morseSmallImg = document.createElement('img');
            morseSmallImg.src = PHOTOS.morseSmall.src;
            morseSmallImg.alt = 'small morse';
            morseSmallImg.onerror = function() { this.style.backgroundColor = '#886644';
                this.width = 80;
                this.height = 80; };
            morseSmall.appendChild(morseSmallImg);
            morseSmall.addEventListener('click', function(e) { e.stopPropagation();
                showMorseLarge(); });
            container.appendChild(morseSmall);

            const morseLarge = document.createElement('div');
            morseLarge.id = 'morsephoto';
            morseLarge.className = 'photo-item';
            morseLarge.style.left = PHOTOS.morseLarge.x + 'px';
            morseLarge.style.top = PHOTOS.morseLarge.y + 'px';
            morseLarge.style.transform = `scale(${PHOTOS.morseLarge.scale})`;
            morseLarge.style.transformOrigin = 'top left';
            morseLarge.style.display = 'none';
            const morseLargeImg = document.createElement('img');
            morseLargeImg.src = PHOTOS.morseLarge.src;
            morseLargeImg.alt = 'morse';
            morseLargeImg.onerror = function() { this.style.backgroundColor = '#886644';
                this.width = 300;
                this.height = 300; };
            morseLarge.appendChild(morseLargeImg);
            const closeMorse = document.createElement('div');
            closeMorse.className = 'close-btn';
            closeMorse.textContent = '✕';
            closeMorse.addEventListener('click', function(e) { e.stopPropagation();
                hideMorseLarge(); });
            morseLarge.appendChild(closeMorse);
            morseLarge.addEventListener('click', function(e) { if (e.target === closeMorse || closeMorse.contains(e.target))
                    return; });
            container.appendChild(morseLarge);
        }

        function renderPictures() {
            container.querySelectorAll('.picture-item').forEach(el => el.remove());
            colourPictures.forEach(pic => {
                const wrapper = document.createElement('div');
                wrapper.className = 'picture-item';
                wrapper.style.left = pic.x + 'px';
                wrapper.style.top = pic.y + 'px';
                wrapper.style.transform = `scale(${pic.scale})`;
                wrapper.style.transformOrigin = 'top left';
                wrapper.style.width = '300px';
                wrapper.style.height = 'auto';
                const img = document.createElement('img');
                img.src = pic.src;
                img.alt = pic.src;
                img.style.width = '100%';
                img.style.height = 'auto';
                img.onerror = function() { this.style.backgroundColor = '#885533';
                    this.style.width = '100%';
                    this.style.height = '200px';
                    this.alt = 'missing'; };
                wrapper.appendChild(img);
                container.appendChild(wrapper);
            });
        }

        function renderBooks() {
            container.querySelectorAll('.book-item').forEach(el => el.remove());

            const groups = {};
            booksData.forEach(book => {
                if (!groups[book.shelf]) groups[book.shelf] = [];
                groups[book.shelf].push(book);
            });

            const shelfKeys = Object.keys(groups).sort((a, b) => a - b);
            shelfKeys.forEach(shelfIdx => {
                const books = groups[shelfIdx];
                books.sort((a, b) => a.order - b.order);
                let currentX = 10;
                books.forEach(book => {
                    const size = imageSizes[book.src] || { width: 50, height: 50 };
                    const scaledW = size.width * book.scale;
                    const scaledH = size.height * book.scale;
                    const item = document.createElement('div');
                    item.className = 'book-item';
                    item.dataset.src = book.src;
                    item.style.left = currentX + 'px';

                    if (book.shelf === 3) {
                        item.style.top = (book.y - scaledH) + 'px';
                    } else {
                        item.style.top = book.y + 'px';
                    }

                    const img = document.createElement('img');
                    img.src = book.src;
                    img.alt = book.src;
                    img.style.width = scaledW + 'px';
                    img.style.height = scaledH + 'px';
                    item.appendChild(img);
                    container.appendChild(item);
                    currentX += scaledW;
                });
            });

            if (window.sortableInstance) window.sortableInstance.destroy();

            window.sortableInstance = new Sortable(container, {
                group: 'books',
                animation: 200,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',
                draggable: '.book-item',
                filter: '.box-item, .picture-item, .photo-item',
                preventOnFilter: false,
                onMove: function(evt) {
                    const dragged = evt.dragged;
                    const related = evt.related;
                    if (!dragged || !related) return true;
                    const draggedSrc = dragged.dataset.src;
                    const relatedSrc = related.dataset.src;
                    const draggedBook = booksData.find(b => b.src === draggedSrc);
                    const relatedBook = booksData.find(b => b.src === relatedSrc);
                    if (!draggedBook || !relatedBook) return true;
                    return draggedBook.shelf === relatedBook.shelf;
                },
                onEnd: function(evt) {
                    const src = evt.item.dataset.src;
                    const book = booksData.find(b => b.src === src);
                    if (!book) return;

                    const items = container.querySelectorAll('.book-item');
                    const orderMap = {};
                    items.forEach((el, idx) => {
                        const s = el.dataset.src;
                        orderMap[s] = idx;
                    });
                    booksData.forEach(b => {
                        if (orderMap[b.src] !== undefined) b.order = orderMap[b.src];
                    });
                    booksData.sort((a, b) => a.shelf - b.shelf || a.order - b.order);

                    let puzzle1Solved = false,
                        puzzle2Solved = false,
                        puzzle3Solved = false,
                        puzzle4Solved = false;
                    if (!box1Unlocked && checkPuzzle1()) { box1Unlocked = true; puzzle1Solved = true; }
                    if (!box2Unlocked && checkPuzzle2()) { box2Unlocked = true; puzzle2Solved = true; }
                    if (!box3Unlocked && checkPuzzle3()) { box3Unlocked = true; puzzle3Solved = true; }
                    if (!box4Unlocked && checkPuzzle4()) { box4Unlocked = true; puzzle4Solved = true; }

                    renderBooks();
                    renderBoxes();

                    if (puzzle1Solved) showSmallFront();
                    if (puzzle2Solved) showSmallStone();
                    if (puzzle3Solved) showSmallMorse();
                }
            });

            ['1', '2', '3', '4'].forEach(id => {
                const boxEl = container.querySelector(`.box-item[data-box-id="${id}"]`);
                if (boxEl) {
                    const unlocked = (id === '1' ? box1Unlocked : (id === '2' ? box2Unlocked : (id === '3' ?
                        box3Unlocked : box4Unlocked)));
                    if (!unlocked) boxEl.classList.add('locked');
                    else boxEl.classList.remove('locked');
                }
            });
        }

        function renderBoxes() {
            container.querySelectorAll('.box-item').forEach(el => el.remove());
            boxesData.forEach(box => {
                const item = document.createElement('div');
                item.className = 'box-item';
                item.dataset.boxId = box.id;

                let isOpen = false;
                if (box.id === 1) isOpen = box1Unlocked;
                else if (box.id === 2) isOpen = box2Unlocked;
                else if (box.id === 3) isOpen = box3Unlocked;
                else if (box.id === 4) isOpen = box4Unlocked;

                const imgSrc = isOpen ? box.openImg : box.closedImg;
                const xPos = isOpen ? box.openX : box.closedX;
                const yPos = isOpen ? box.openY : box.closedY;
                const scale = isOpen ? box.openScale : box.closedScale;

                item.style.left = xPos + 'px';
                item.style.top = yPos + 'px';
                item.style.transform = `scale(${scale})`;
                item.style.transformOrigin = 'top left';

                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = `Box ${box.id}`;
                img.dataset.closedImg = box.closedImg;
                img.dataset.openImg = box.openImg;
                img.dataset.isOpen = isOpen ? 'true' : 'false';
                img.onerror = function() { this.style.backgroundColor = '#ff0000';
                    this.style.width = '100px';
                    this.style.height = '100px';
                    this.alt = 'Image missing'; };

                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const boxId = parseInt(this.dataset.boxId, 10);
                    console.log(`Box ${boxId} is permanently open.`);
                });

                item.appendChild(img);
                container.appendChild(item);
            });

            ['1', '2', '3', '4'].forEach(id => {
                const boxEl = container.querySelector(`.box-item[data-box-id="${id}"]`);
                if (boxEl) {
                    const unlocked = (id === '1' ? box1Unlocked : (id === '2' ? box2Unlocked : (id === '3' ?
                        box3Unlocked : box4Unlocked)));
                    if (!unlocked) boxEl.classList.add('locked');
                    else boxEl.classList.remove('locked');
                }
            });
        }

        function loadImages(callback) {
            const bookPromises = booksData.map(book => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = function() { imageSizes[book.src] = { width: this.naturalWidth,
                            height: this.naturalHeight };
                        resolve(); };
                    img.onerror = function() { imageSizes[book.src] = { width: 100, height: 150 };
                        resolve(); };
                    img.src = book.src;
                });
            });
            const colourPromises = colourPictures.map(pic => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve();
                    img.onerror = () => resolve();
                    img.src = pic.src;
                });
            });
            const photoPromises = [
                PHOTOS.small.src, PHOTOS.front.src, PHOTOS.back.src,
                PHOTOS.stoneSmall.src, PHOTOS.stoneLarge.src,
                PHOTOS.morseSmall.src, PHOTOS.morseLarge.src
            ].map(src => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve();
                    img.onerror = () => resolve();
                    img.src = src;
                });
            });
            Promise.all([...bookPromises, ...colourPromises, ...photoPromises]).then(callback);
        }

        if (isPC && DECOR) {
            const leftContainer = document.getElementById('decor-left');
            const rightContainer = document.getElementById('decor-right');
            if (DECOR.leftImage) {
                const leftImg = document.createElement('img');
                leftImg.src = DECOR.leftImage;
                leftImg.alt = 'Left decor';
                leftImg.style.transform = `scale(${DECOR.scale})`;
                leftImg.style.marginLeft = DECOR.leftOffsetX + 'px';
                leftImg.style.marginTop = DECOR.leftOffsetY + 'px';
                leftContainer.appendChild(leftImg);
            }
            if (DECOR.rightImage) {
                const rightImg = document.createElement('img');
                rightImg.src = DECOR.rightImage;
                rightImg.alt = 'Right decor';
                rightImg.style.transform = `scale(${DECOR.scale})`;
                rightImg.style.marginRight = DECOR.rightOffsetX + 'px';
                rightImg.style.marginTop = DECOR.rightOffsetY + 'px';
                rightContainer.appendChild(rightImg);
            }
        }

        loadImages(() => {
            renderPictures();
            renderBooks();
            renderBoxes();
            createPhotoElements();
            console.log(`📱 ${isPC ? 'PC' : 'Mobile'} mode – All four puzzles active.`);
        });

        /* ---- fade in when everything is ready ---- */
        window.addEventListener('load', function () { document.body.classList.add('ready'); });
        if (document.readyState === 'complete') { document.body.classList.add('ready'); }
    </script>
</body>
</html>
